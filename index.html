  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, 
      onSnapshot, query, where, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZfsS5xjUyunwIt_cHaPWHQI3H_lzYXoo",
      authDomain: "ntumlt.firebaseapp.com",
      projectId: "ntumlt",
      storageBucket: "ntumlt.firebasestorage.app",
      messagingSenderId: "658799327665",
      appId: "1:658799327665:web:8841af44d52aa7caa12590"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // تصدير أدوات Firebase للواجهة
    window.fb = {
      auth, db,
      signInAnonymously, onAuthStateChanged,
      collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
      onSnapshot, query, where, serverTimestamp
    };
    window.dispatchEvent(new Event('firebase-ready'));

    signInAnonymously(auth).catch(console.error);
    onAuthStateChanged(auth, user => {
      if (user && !window.fbAuthed) {
        window.fbAuthed = true;
        window.dispatchEvent(new Event('fb-authed'));
      }
    });
  </script>

    const waitForFirebase = () => new Promise(resolve => {
      if (window.fbAuthed) return resolve();
      window.addEventListener('fb-authed', () => resolve(), { once: true });
    });

    let xlsxLoadPromise = null;
    const loadXLSX = () => {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      if (xlsxLoadPromise) return xlsxLoadPromise;
      xlsxLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
        script.async = true;
        script.onload = () => resolve(window.XLSX);
        script.onerror = (err) => {
          xlsxLoadPromise = null;
          reject(err);
        };
        document.head.appendChild(script);
      });
      return xlsxLoadPromise;
    };

      if (str === null || str === undefined) return '';

    };

    // 2. دالة مهلة زمنية للعمليات السحابية لمنع التعليق عند ضعف الشبكة
    const withTimeout = (promise, ms, code = 'app/timeout') => {
      let timer;
      const timeoutPromise = new Promise((_, reject) => {
        timer = setTimeout(() => {
          const err = new Error(code);
          err.code = code;
          reject(err);
        }, ms);
      });
      return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timer));
    };

    // تحديد نوع MIME للملف من اسمه أو نوعه
    const resolveMimeType = (file) => {
      if (file && file.type) return file.type;
      const ext = (file?.name || '').split('.').pop().toLowerCase();
      const map = {
        pdf: 'application/pdf',
        doc: 'application/msword',
        docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        ppt: 'application/vnd.ms-powerpoint',
        pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
        png: 'image/png',
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg'
      };
      return map[ext] || 'application/octet-stream';
    };

    // 3. رفع الملف إلى Firestore بطريقة الأجزاء (Chunks) بدلاً من Storage
    const uploadFileInChunks = async ({ file, parentDocPath, onProgress, cancelRef }) => {
      const MAX_BYTES = 10 * 1024 * 1024; // 10MB
      if (!file) {
        const e = new Error('لم يتم اختيار ملف');
        e.customArabic = 'يرجى اختيار ملف أولاً';
        throw e;
      }
      if (file.size > MAX_BYTES) {
        const e = new Error('file-too-large');
        e.customArabic = 'حجم الملف يتجاوز الحد الأقصى المسموح به (10 ميغابايت)';
        throw e;
      }

      if (cancelRef?.current) {
        const e = new Error('canceled');
        e.code = 'canceled';
        throw e;
      }

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('فشل قراءة الملف من الجهاز'));
        reader.readAsDataURL(file);
      });

      const commaIdx = String(dataUrl).indexOf(',');
      const base64Str = commaIdx !== -1 ? String(dataUrl).slice(commaIdx + 1) : String(dataUrl);
      const CHUNK_SIZE = 700000;
      const totalChunks = Math.max(1, Math.ceil(base64Str.length / CHUNK_SIZE));
      const { db, doc, setDoc, deleteDoc } = window.fb;
      const writtenChunkPaths = [];

      if (onProgress) onProgress(5);

      try {
        for (let i = 0; i < totalChunks; i++) {
          if (cancelRef?.current) {
            const cancelErr = new Error('canceled');
            cancelErr.code = 'canceled';
            throw cancelErr;
          }

          const piece = base64Str.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          const chunkPath = `${parentDocPath}/chunks/${i}`;
          await withTimeout(
            setDoc(doc(db, chunkPath), { i, d: piece }),
            45000,
            'app/timeout'
          );
          writtenChunkPaths.push(chunkPath);

          if (onProgress) {
            const pct = Math.min(99, Math.round(((i + 1) / totalChunks) * 95) + 5);
            onProgress(pct);
          }
        }
      } catch (err) {
        for (const cPath of writtenChunkPaths) {
          try {
            await deleteDoc(doc(db, cPath));
          } catch (_) {}
        }
        throw err;
      }

      return {
        chunkCount: totalChunks,
        fileSize: file.size,
        mimeType: resolveMimeType(file)
      };
    };

    // 4. جلب أجزاء الملف من Firestore وتجميعها في Blob مع التخزين المؤقت
    const fetchFileBlobFromChunks = async (parentDocPath, mimeType = 'application/octet-stream') => {
      if (FILE_BLOB_CACHE.has(parentDocPath)) {
        return FILE_BLOB_CACHE.get(parentDocPath);
      }

      const { db, collection, getDocs } = window.fb;
      const chunksSnap = await withTimeout(
        getDocs(collection(db, `${parentDocPath}/chunks`)),
        45000,
        'app/timeout'
      );

      if (chunksSnap.empty) {
        throw new Error('لم يتم العثور على بيانات الملف');
      }

      const parts = chunksSnap.docs
        .map(d => d.data())
        .sort((a, b) => (a.i ?? 0) - (b.i ?? 0))
        .map(item => item.d || '');

      const fullBase64 = parts.join('');
      const effectiveMime = mimeType || 'application/octet-stream';
      const response = await fetch(`data:${effectiveMime};base64,${fullBase64}`);
      const blob = await response.blob();

      FILE_BLOB_CACHE.set(parentDocPath, blob);
      return blob;
    };

    // 5. حذف جميع أجزاء الملف عند حذف المحاضرة
    const deleteChunks = async (parentDocPath) => {
      if (!parentDocPath) return;
      const { db, collection, getDocs, doc, deleteDoc } = window.fb;
      const snap = await getDocs(collection(db, `${parentDocPath}/chunks`));
      for (const d of snap.docs) {
        try {
          await deleteDoc(doc(db, `${parentDocPath}/chunks/${d.id}`));
        } catch (_) {}
      }
      FILE_BLOB_CACHE.delete(parentDocPath);
    };

    // 6. ضغط صورة الجدول لتناسب حد 1MB في Firestore
    const compressImageToDataUrl = async (file, maxChars = 850000) => {
      if (!file) throw new Error('لم يتم اختيار صورة');
      const rawDataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('تعذرت قراءة ملف الصورة'));
        reader.readAsDataURL(file);
      });

      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('الملف المختار ليس صورة صالحة'));
        image.src = rawDataUrl;
      });

      let targetWidth = Math.min(img.width || 1600, 1600);
      let targetHeight = Math.round((img.height / (img.width || 1)) * targetWidth);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      for (let scaleAttempt = 0; scaleAttempt < 6; scaleAttempt++) {
        canvas.width = Math.max(200, targetWidth);
        canvas.height = Math.max(200, targetHeight);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        let quality = 0.85;
        while (quality >= 0.4) {
          const compressed = canvas.toDataURL('image/jpeg', quality);
          if (compressed.length <= maxChars) {
            return compressed;
          }
          quality = Math.round((quality - 0.1) * 100) / 100;
        }

        targetWidth = Math.round(targetWidth * 0.8);
        targetHeight = Math.round(targetHeight * 0.8);
      }

      const err = new Error('image-too-large');
      err.customArabic = 'تعذر ضغط الصورة بالحجم المطلوب، يرجى اختيار صورة أصغر حجماً أو أقل دقة';
      throw err;
    };

    // 7. ترجمة أخطاء الرفع للعربية
    const uploadErrorMessage = (err) => {
      console.error('Upload error details:', err);
      if (err?.customArabic) return err.customArabic;
      const code = err?.code || err?.message || '';
      if (String(code).includes('app/timeout')) {
        return 'انقطع الاتصال أو الشبكة بطيئة. حاول مجدداً';
      }
      if (String(code).includes('permission-denied')) {
        return 'لا توجد صلاحية كتابة. افحص قواعد Firestore وتفعيل الدخول المجهول';
      }
      if (String(code).includes('canceled')) {
        return 'تم إلغاء الرفع';
      }
      return 'فشل الرفع، تحقق من الإنترنت وأعد المحاولة';
    };

    // تنظيف النصوص والمسافات الزائدة وتوحيد الألف والهمزات للمطابقة الذكية
    const normalizeArabic = (str) => {
      if (!str) return '';
      return str
        .trim()
        .replace(/\s+/g, ' ')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي');
    };

    const cleanSpaces = (str) => (str || '').trim().replace(/\s+/g, ' ');

    // توحيد مفتاح القسم لمنع التكرار بسبب اختلاف الصياغة (مثل قسم المختبرات الطبية / المختبرات الطبية)
    const canonicalDeptKey = (name) => {
      if (!name) return '';
      let s = normalizeArabic(name);
      // حذف التشكيل والتطويل
      s = s.replace(/[\u064B-\u065F\u0670\u0640]/g, '');
      // حذف علامات الترقيم والأقواس والشرطات
      s = s.replace(/[()\[\]{}\-–—_.,،؛:!؟/\\|"'`~@#$%^&*+=<>]/g, ' ');
      const stopWords = new Set(['قسم', 'كليه', 'الكليه', 'فرع']);
      const words = s
        .split(/\s+/)
        .filter(Boolean)
        .filter(w => !stopWords.has(w))
        .map(w => (w.startsWith('ال') && w.length > 3 ? w.slice(2) : w))
        .filter(w => !stopWords.has(w));
      return cleanSpaces(words.join(' ')).toLowerCase();
    };

    // إنشاء معرّف نظيف للقسم ليكون مساراً آمناً في Firestore
    const slugifyDept = (deptName) => {
      const normalized = normalizeArabic(deptName).toLowerCase();
      let hash = 0;
      for (let i = 0; i < normalized.length; i++) {
        hash = ((hash << 5) - hash) + normalized.charCodeAt(i);
        hash |= 0;
      }
      return 'dept_' + Math.abs(hash).toString(36);
    };

    // إنشاء هاش ثابت للمادة وعنوان الامتحان لمنع تكرار الدرجات عند إعادة النشر
    const hashExamKey = (subjectName, examTitle = '') => {
      const combined = `${normalizeArabic(subjectName)}__${normalizeArabic(examTitle)}`.toLowerCase();
      let hash = 0;
      for (let i = 0; i < combined.length; i++) {
        hash = ((hash << 5) - hash) + combined.charCodeAt(i);
        hash |= 0;
      }
      return 'ex_' + Math.abs(hash).toString(36);
    };

    // بناء المسار المعزول بالكامل:
    // branches/{branchId}/stages/{stage}/studyTypes/{studyType}/departments/{departmentId}
    const getIsolatedBasePath = (branchId, stageId, studyTypeId, deptName) => {
      const deptId = slugifyDept(deptName);
      return `branches/${branchId}/stages/${stageId}/studyTypes/${studyTypeId}/departments/${deptId}`;
    };

    // Hook لمراقبة قائمة الأقسام الموحدة من Firestore
    function useDepartments() {
      const [departments, setDepartments] = useState([]);
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        let unsub = null;
        let active = true;

        waitForFirebase().then(() => {
          if (!active) return;
          const { db, collection, onSnapshot } = window.fb;
          unsub = onSnapshot(collection(db, 'departments'), (snap) => {
            const list = snap.docs
              .map(d => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            setDepartments(list);
            setLoaded(true);
          }, (err) => {
            console.error('useDepartments error:', err);
            setLoaded(true);
          });
        });

        return () => {
          active = false;
          if (unsub) unsub();
        };
      }, []);

      return { departments, loaded };
    }

    // التأكد من وجود القسم في القائمة الموحدة أو إنشاؤه دون تكرار أو تصادم
    async function ensureDepartment(rawName) {
      const cleanedName = cleanSpaces(rawName);
      const cKey = canonicalDeptKey(cleanedName);
      if (!cleanedName || !cKey) {
        const err = new Error('invalid-dept');
        err.customArabic = 'يرجى كتابة اسم القسم بشكل صحيح';
        throw err;
      }

      await waitForFirebase();
      const { db, collection, doc, getDoc, getDocs, setDoc, serverTimestamp } = window.fb;

      const allSnap = await withTimeout(getDocs(collection(db, 'departments')), 20000, 'app/timeout');
      for (const d of allSnap.docs) {
        const data = d.data();
        if (data.canonicalKey === cKey) {
          return {
            departmentId: d.id,
            departmentName: data.name,
            existed: true
          };
        }
      }

      const deptId = slugifyDept(cleanedName);
      const deptRef = doc(db, `departments/${deptId}`);
      const existingById = await withTimeout(getDoc(deptRef), 20000, 'app/timeout');

      if (existingById.exists()) {
        const existingData = existingById.data();
        if (existingData.canonicalKey === cKey) {
          return {
            departmentId: deptId,
            departmentName: existingData.name,
            existed: true
          };
        }
        const err = new Error('dept-id-collision');
        err.customArabic = 'حدث تعارض في معرّف القسم مع قسم آخر، يرجى تعديل صياغة اسم القسم قليلاً';
        throw err;
      }

      await withTimeout(
        setDoc(deptRef, {
          name: cleanedName,
          canonicalKey: cKey,
          createdAt: serverTimestamp()
        }),
        20000,
        'app/timeout'
      );

      return {
        departmentId: deptId,
        departmentName: cleanedName,
        existed: false
      };
    }

    // تشفير الرمز السري باستخدام SHA-256 مع Salt
    async function hashPassword(password, salt) {
      const encoder = new TextEncoder();
      const data = encoder.encode(`${salt}:${password}:NTU_SECURE_2026`);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function generateSalt() {
      const array = new Uint8Array(16);
      crypto.getRandomValues(array);
      return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
    }

    // ==========================================
    // ErrorBoundary لمنع الشاشة البيضاء عند حدوث أي خطأ غير متوقع
    // ==========================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }

      static getDerivedStateFromError() {
        return { hasError: true };
      }

      componentDidCatch(error, info) {
        console.error('UI ErrorBoundary caught:', error, info);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-6 text-center space-y-4">
              <div className="w-16 h-16 rounded-2xl bg-rose-100 text-rose-700 flex items-center justify-center text-2xl font-extrabold">!</div>

              <button
                onClick={() => window.location.reload()}
                className="px-6 py-3 rounded-2xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold shadow transition"
              >
                إعادة تحميل الصفحة

            </div>
          );
        }
        return this.props.children;
      }
    }

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-fadeIn">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <h3 className="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                <span className="p-2 rounded-xl bg-ntu-100 text-ntu-700"><Icons.User /></span>
                الملف الشخصي
              </h3>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold">✕</button>
            </div>

            <div className="mt-5 space-y-3 text-sm">
              {session.role === 'student' && (
                <>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">الاسم الرباعي</span>
                    <span className="font-extrabold text-slate-900 text-base">{session.fullName}</span>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                      <span className="text-xs text-slate-500 block">الفرع</span>
                      <span className="font-bold text-ntu-800">{branchName}</span>
                    </div>
                    <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                      <span className="text-xs text-slate-500 block">نوع الدراسة</span>
                      <span className="font-bold text-ntu-800">{studyName}</span>
                    </div>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">المرحلة</span>
                    <span className="font-bold text-slate-900">المرحلة {stageName}</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">القسم</span>
                    <span className="font-bold text-slate-900">{session.departmentName}</span>
                  </div>
                </>
              )}

              {session.role === 'doctor' && (
                <>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">الاسم الكامل</span>
                    <span className="font-extrabold text-slate-900 text-base">{session.doctorName}</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">الفرع</span>
                    <span className="font-bold text-ntu-800">{branchName}</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">المادة والقسم</span>
                    <span className="font-bold text-slate-900">{session.subjectAndDept}</span>
                  </div>
                </>
              )}

              {session.role === 'coordinator' && (
                <>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">الصفة الإدارية</span>
                    <span className="font-extrabold text-slate-900 text-base">مقرر قسم</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">الفرع</span>
                    <span className="font-bold text-ntu-800">{branchName}</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-100">
                    <span className="text-xs text-slate-500 block">القسم المسؤول عنه</span>
                    <span className="font-bold text-ntu-800">{session.departmentName}</span>
                  </div>
                </>
              )}
            </div>

            <button 
              onClick={onClose}
              className="mt-6 w-full py-3 rounded-2xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold transition"
            >
              إغلاق
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. الصفحة الرئيسية وبوابات الدخول (Landing & Auth)
    // ==========================================
    function LandingAndAuth({ authConfig, onLoginSuccess, notify }) {
      const { departments, loaded: deptsLoaded } = useDepartments();

      // الحالات: 'home' | 'student_login' | 'student_register' | 'doctor_login' | 'coordinator_login'
      const [view, setView] = useState('home');
      const [loading, setLoading] = useState(false);

      // --- حقول تسجيل الدخول للطالب ---
      const [loginName, setLoginName] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginBranch, setLoginBranch] = useState('kirkuk');
      const [matchingAccounts, setMatchingAccounts] = useState([]);

      // --- حقول إنشاء حساب طالب ---
      const [regName, setRegName] = useState('');
      const [regPass, setRegPass] = useState('');
      const [regPassConfirm, setRegPassConfirm] = useState('');
      const [regBranch, setRegBranch] = useState('kirkuk');
      const [regStudyType, setRegStudyType] = useState('morning');
      const [regStage, setRegStage] = useState('stage1');
      const [regDeptId, setRegDeptId] = useState('');

      // --- حقول دخول الدكتور (خطوات متسلسلة) ---
      const [docStep, setDocStep] = useState(1);
      const [docUser, setDocUser] = useState('');
      const [docPass, setDocPass] = useState('');
      const [docBranch, setDocBranch] = useState('kirkuk');
      const [docBranchCode, setDocBranchCode] = useState('');
      const [docFullName, setDocFullName] = useState('');
      const [docSubject, setDocSubject] = useState('');
      const [docDeptId, setDocDeptId] = useState('');

      // --- حقول دخول مقرر القسم ---
      const [coordStep, setCoordStep] = useState(1);
      const [coordUser, setCoordUser] = useState('');
      const [coordPass, setCoordPass] = useState('');
      const [coordDeptChoice, setCoordDeptChoice] = useState(''); // departmentId أو '__new__'
      const [coordNewDeptName, setCoordNewDeptName] = useState('');
      const [coordBranch, setCoordBranch] = useState('kirkuk');
      const [coordBranchCode, setCoordBranchCode] = useState('');

      // اختيار أول قسم تلقائياً عند توفر القائمة
      useEffect(() => {
        if (departments.length > 0) {
          if (!regDeptId) setRegDeptId(departments[0].id);
          if (!docDeptId) setDocDeptId(departments[0].id);
          if (!coordDeptChoice) setCoordDeptChoice(departments[0].id);
        } else if (deptsLoaded && !coordDeptChoice) {
          setCoordDeptChoice('__new__');
        }
      }, [departments, deptsLoaded]);

      // التحقق من الاسم الرباعي
      const validateQuadName = (rawName) => {
        const cleaned = cleanSpaces(rawName);
        const words = cleaned.split(' ').filter(Boolean);
        if (words.length < 4) {
          return { valid: false, cleaned };
        }
        return { valid: true, cleaned };
      };

      const completeStudentLogin = (studentObj) => {
        notify(`أهلاً بك، ${studentObj.fullName}`, 'success');
        setMatchingAccounts([]);
        onLoginSuccess({
          role: 'student',
          studentId: studentObj.id,
          fullName: studentObj.fullName,
          normalizedName: studentObj.normalizedName,
          branchId: studentObj.branchId,
          studyTypeId: studentObj.studyTypeId,
          stageId: studentObj.stageId,
          departmentName: studentObj.departmentName,
          departmentId: studentObj.departmentId || slugifyDept(studentObj.departmentName)
        });
      };

      // معالجة تسجيل دخول الطالب
      const handleStudentLogin = async (e) => {
        e.preventDefault();
        if (loading) return;

        const nameCheck = validateQuadName(loginName);
        if (!nameCheck.valid) {
          notify('يرجى كتابة الاسم الرباعي المسجل به', 'error');
          return;
        }
        if (!loginPass) {
          notify('يرجى إدخال الرمز السري', 'error');
          return;
        }

        setLoading(true);
        setMatchingAccounts([]);
        try {
          await withTimeout(waitForFirebase(), 20000, 'app/timeout');
          const { db, collection, query, where, getDocs, doc, getDoc } = window.fb;
          const normName = normalizeArabic(nameCheck.cleaned);

          const indexRef = collection(db, `branches/${loginBranch}/student_index`);
          const qIndex = query(indexRef, where('normalizedName', '==', normName));
          const indexSnap = await withTimeout(getDocs(qIndex), 20000, 'app/timeout');

          if (indexSnap.empty) {
            notify('لم يتم العثور على طالب بهذا الاسم في هذا الفرع', 'error');
            return;
          }

          const validMatches = [];
          for (const idxDoc of indexSnap.docs) {
            const meta = idxDoc.data();
            const studentDocRef = doc(db, `${meta.basePath}/students/${meta.studentId}`);
            const studentSnap = await withTimeout(getDoc(studentDocRef), 20000, 'app/timeout');
            if (studentSnap.exists()) {
              const sData = studentSnap.data();
              const checkHash = await hashPassword(loginPass, sData.salt);
              if (checkHash === sData.passwordHash) {
                validMatches.push({ id: studentSnap.id, ...sData });
              }
            }
          }

          if (validMatches.length === 0) {
            notify('الرمز السري غير صحيح', 'error');
            return;
          }

          if (validMatches.length === 1) {
            completeStudentLogin(validMatches[0]);
          } else {
            setMatchingAccounts(validMatches);
            notify('تم العثور على أكثر من حساب، يرجى اختيار الحساب المطلوب', 'warning');
          }
        } catch (err) {
          console.error(err);
          notify(err?.code === 'app/timeout' ? 'الاتصال بطيء، حاول مجدداً' : 'حدث خطأ أثناء تسجيل الدخول', 'error');
        } finally {
          setLoading(false);
        }
      };

      // إنشاء حساب طالب جديد ضمن القسم الموحد المختار
      const handleStudentRegisterWithIndex = async (e) => {
        e.preventDefault();
        if (loading) return;

        const nameCheck = validateQuadName(regName);
        if (!nameCheck.valid) {
          notify('يرجى كتابة الاسم الرباعي (4 كلمات على الأقل)', 'error');
          return;
        }
        if (!regPass || regPass.length < 4) {
          notify('يرجى إدخال رمز سري لا يقل عن 4 رموز', 'error');
          return;
        }
        if (regPass !== regPassConfirm) {
          notify('الرمز السري وتأكيده غير متطابقين', 'error');
          return;
        }
        const selectedDeptObj = departments.find(d => d.id === regDeptId);
        if (!selectedDeptObj) {
          notify('يرجى اختيار القسم من القائمة (يُضاف القسم من قبل مقرر القسم)', 'error');
          return;
        }

        setLoading(true);
        try {
          await withTimeout(waitForFirebase(), 20000, 'app/timeout');
          const { db, collection, query, where, getDocs, addDoc, setDoc, doc, serverTimestamp } = window.fb;
          const cleanedDept = selectedDeptObj.name;
          const basePath = getIsolatedBasePath(regBranch, regStage, regStudyType, cleanedDept);
          const studentsRef = collection(db, `${basePath}/students`);
          const normName = normalizeArabic(nameCheck.cleaned);

          const q = query(studentsRef, where('normalizedName', '==', normName));
          const existingSnap = await withTimeout(getDocs(q), 20000, 'app/timeout');
          if (!existingSnap.empty) {
            notify('عذراً، هذا الحساب مسجل مسبقاً في نفس القسم والمرحلة ونوع الدراسة!', 'error');
            return;
          }

          const salt = generateSalt();
          const passwordHash = await hashPassword(regPass, salt);
          const deptId = selectedDeptObj.id;

          const studentData = {
            fullName: nameCheck.cleaned,
            normalizedName: normName,
            passwordHash,
            salt,
            branchId: regBranch,
            studyTypeId: regStudyType,
            stageId: regStage,
            departmentName: cleanedDept,
            departmentId: deptId,
            createdAt: serverTimestamp()
          };

          const docRef = await withTimeout(addDoc(studentsRef, studentData), 20000, 'app/timeout');
          
          await withTimeout(
            setDoc(doc(db, `branches/${regBranch}/student_index/${docRef.id}`), {
              studentId: docRef.id,
              normalizedName: normName,
              basePath,
              branchId: regBranch,
              stageId: regStage,
              studyTypeId: regStudyType,
              departmentName: cleanedDept,
              departmentId: deptId
            }),
            20000,
            'app/timeout'
          );

          notify('تم إنشاء حسابك بنجاح!', 'success');
          onLoginSuccess({
            role: 'student',
            studentId: docRef.id,
            fullName: studentData.fullName,
            normalizedName: normName,
            branchId: regBranch,
            studyTypeId: regStudyType,
            stageId: regStage,
            departmentName: cleanedDept,
            departmentId: deptId
          });
        } catch (err) {
          console.error(err);
          notify(err?.code === 'app/timeout' ? 'الاتصال بطيء، حاول مجدداً' : 'حدث خطأ أثناء إنشاء الحساب', 'error');
        } finally {
          setLoading(false);
        }
      };

      // خطوات دخول الدكتور
      const handleDoctorStep1 = (e) => {
        e.preventDefault();
        const inputUser = cleanSpaces(docUser).toLowerCase();
        const inputPass = (docPass || '').trim().toLowerCase();

        const cfgUser = cleanSpaces(authConfig?.doctorUser || '').toLowerCase();
        const cfgPass = String(authConfig?.doctorPass || '').trim().toLowerCase();
        const defUser = DEFAULT_AUTH_CONFIG.doctorUser.toLowerCase();
        const defPass = DEFAULT_AUTH_CONFIG.doctorPass.toLowerCase();

        const userValid = (cfgUser && inputUser === cfgUser) || inputUser === defUser;
        if (!userValid) {
          notify('اسم غير صحيح', 'error');
          return;
        }

        const passValid = (cfgPass && inputPass === cfgPass) || inputPass === defPass;
        if (!passValid) {
          notify('رمز غير صحيح', 'error');
          return;
        }

        setDocStep(2);
        notify('تم التحقق من بيانات الدخول الأساسية', 'success');
      };

      const handleDoctorStep2 = (e) => {
        e.preventDefault();
        const enteredCode = toLatinDigits(docBranchCode).trim();
        const cfgCode = toLatinDigits(authConfig?.branchCodes?.[docBranch] || '').trim();
        const defCode = toLatinDigits(DEFAULT_AUTH_CONFIG.branchCodes[docBranch] || '').trim();

        if ((cfgCode && enteredCode === cfgCode) || enteredCode === defCode) {
          setDocStep(3);
          notify('تم التحقق من رمز الفرع بنجاح', 'success');
        } else {
          notify('رمز الفرع غير صحيح، يرجى التأكد والمحاولة مجدداً', 'error');
        }
      };

      const handleDoctorStep3 = async (e) => {
        e.preventDefault();
        if (loading) return;
        const cleanedName = cleanSpaces(docFullName);
        const words = cleanedName.split(' ').filter(Boolean);
        if (!cleanedName.startsWith('دكتور') || words.length < 2) {
          notify('يجب أن يبدأ الاسم بكلمة "دكتور" متبوعة بالاسم الكامل (ثنائي أو ثلاثي أو رباعي)', 'error');
          return;
        }
        const cleanedSubj = cleanSpaces(docSubject);
        if (!cleanedSubj || cleanedSubj.length < 2) {
          notify('يرجى كتابة اسم المادة الدراسية', 'error');
          return;
        }
        const selectedDeptObj = departments.find(d => d.id === docDeptId);
        if (!selectedDeptObj) {
          notify('يرجى اختيار القسم من القائمة', 'error');
          return;
        }

        setLoading(true);
        try {
          await withTimeout(waitForFirebase(), 20000, 'app/timeout');
          const { db, doc, setDoc, serverTimestamp } = window.fb;
          const docId = 'doc_' + normalizeArabic(cleanedName).replace(/\s+/g, '_');
          const subjectAndDept = `${cleanedSubj} – ${selectedDeptObj.name}`;

          await withTimeout(
            setDoc(doc(db, `branches/${docBranch}/doctors/${docId}`), {
              doctorName: cleanedName,
              branchId: docBranch,
              subjectAndDept,
              departmentId: selectedDeptObj.id,
              departmentName: selectedDeptObj.name,
              deptMap: { [selectedDeptObj.id]: selectedDeptObj.name },
              lastLogin: serverTimestamp()
            }, { merge: true }),
            20000,
            'app/timeout'
          );

          notify(`مرحباً ${cleanedName}`, 'success');
          onLoginSuccess({
            role: 'doctor',
            doctorId: docId,
            doctorName: cleanedName,
            branchId: docBranch,
            subjectAndDept,
            departmentId: selectedDeptObj.id,
            departmentName: selectedDeptObj.name
          });
        } catch (err) {
          console.error(err);
          notify(err?.code === 'app/timeout' ? 'الاتصال بطيء، حاول مجدداً' : 'حدث خطأ أثناء حفظ بيانات الدكتور', 'error');
        } finally {
          setLoading(false);
        }
      };

      // دخول مقرر القسم: الخطوة 1 (الاسم + الرمز + اختيار أو إضافة القسم)
      const handleCoordinatorStep1 = (e) => {
        e.preventDefault();
        const inputUser = cleanSpaces(coordUser).toLowerCase();
        const inputPass = (coordPass || '').trim().toLowerCase();

        const cfgUser = cleanSpaces(authConfig?.coordinatorUser || '').toLowerCase();
        const cfgPass = String(authConfig?.coordinatorPass || '').trim().toLowerCase();
        const defUser = DEFAULT_AUTH_CONFIG.coordinatorUser.toLowerCase();
        const defPass = DEFAULT_AUTH_CONFIG.coordinatorPass.toLowerCase();

        const userValid = (cfgUser && inputUser === cfgUser) || inputUser === defUser;
        if (!userValid) {
          notify('اسم غير صحيح', 'error');
          return;
        }

        const passValid = (cfgPass && inputPass === cfgPass) || inputPass === defPass;
        if (!passValid) {
          notify('رمز غير صحيح', 'error');
          return;
        }

        if (coordDeptChoice === '__new__') {
          const cleanedNew = cleanSpaces(coordNewDeptName);
          if (!cleanedNew || cleanedNew.length < 3 || !canonicalDeptKey(cleanedNew)) {
            notify('يرجى كتابة اسم القسم الجديد بشكل كامل وواضح', 'error');
            return;
          }
        } else {
          const found = departments.find(d => d.id === coordDeptChoice);
          if (!found) {
            notify('يرجى اختيار القسم أو إضافة قسم جديد', 'error');
            return;
          }
        }

        setCoordStep(2);
        notify('تم التحقق من بيانات المقرر، اختر الفرع وأدخل رمزه', 'success');
      };

      // دخول مقرر القسم: الخطوة 2 (التحقق من رمز الفرع ثم إنشاء/تأكيد القسم)
      const handleCoordinatorStep2 = async (e) => {
        e.preventDefault();
        if (loading) return;

        const enteredCode = toLatinDigits(coordBranchCode).trim();
        const cfgCode = toLatinDigits(authConfig?.branchCodes?.[coordBranch] || '').trim();
        const defCode = toLatinDigits(DEFAULT_AUTH_CONFIG.branchCodes[coordBranch] || '').trim();

        if (!((cfgCode && enteredCode === cfgCode) || enteredCode === defCode)) {
          notify('رمز الفرع غير صحيح، يرجى التأكد والمحاولة مجدداً', 'error');
          return;
        }

        setLoading(true);
        try {
          let finalDeptId = '';
          let finalDeptName = '';

          if (coordDeptChoice === '__new__') {
            const ensured = await ensureDepartment(coordNewDeptName);
            finalDeptId = ensured.departmentId;
            finalDeptName = ensured.departmentName;
            if (ensured.existed) {
              notify(`هذا القسم موجود باسم: ${ensured.departmentName}`, 'warning');
            } else {
              notify('تمت إضافة القسم وتسجيل الدخول بنجاح', 'success');
            }
          } else {
            const found = departments.find(d => d.id === coordDeptChoice);
            if (!found) {
              notify('القسم المختار غير موجود، حاول مجدداً', 'error');
              return;
            }
            finalDeptId = found.id;
            finalDeptName = found.name;
            notify('تم تسجيل الدخول بصفة مقرر قسم', 'success');
          }

          onLoginSuccess({
            role: 'coordinator',
            branchId: coordBranch,
            departmentName: finalDeptName,
            departmentId: finalDeptId
          });
        } catch (err) {
          console.error(err);
          notify(
            err?.customArabic || (err?.code === 'app/timeout' ? 'الاتصال بطيء، حاول مجدداً' : 'حدث خطأ أثناء تأكيد القسم'),
            'error'
          );
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-[calc(100vh-80px)] flex flex-col items-center justify-center p-4">
          {/* البطاقة الرئيسية في الواجهة الأولى */}
          {view === 'home' && (
            <div className="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 shadow-xl text-center space-y-6">
              <div className="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-ntu-600 to-ntu-800 text-white flex items-center justify-center shadow-lg">
                <svg className="w-11 h-11" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.7}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
              </div>

              <div>
                <h2 className="text-2xl font-extrabold text-slate-900">البوابة التعليمية الإلكترونية</h2>
                <p className="text-sm text-slate-500 mt-1">اختر بوابة الدخول للمتابعة</p>
              </div>

              {/* أزرار الطلاب */}
              <div className="space-y-3 pt-2">
                <button
                  onClick={() => { setMatchingAccounts([]); setView('student_login'); }}
                  className="w-full py-3.5 px-5 rounded-2xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold text-base shadow-md hover:shadow-lg transition transform active:scale-[0.99]"
                >
                  تسجيل دخول الطلاب
                </button>
                <button
                  onClick={() => setView('student_register')}
                  className="w-full py-3.5 px-5 rounded-2xl bg-ntu-50 hover:bg-ntu-100 text-ntu-800 border-2 border-ntu-200 font-bold text-base transition transform active:scale-[0.99]"
                >
                  إنشاء حساب
                </button>
              </div>

              {/* خط فاصل وبوابات الكادر التدريسي والإداري */}
              <div className="pt-4 border-t border-slate-200 flex flex-col items-center gap-3">
                <button
                  onClick={() => { setDocStep(1); setView('doctor_login'); }}
                  className="text-slate-700 hover:text-ntu-700 font-extrabold text-base px-6 py-2 rounded-xl hover:bg-slate-100 transition"
                >
                  دكتور

    // ==========================================
    // 5. واجهة الطالب (Student Dashboard)
    // ==========================================
    function StudentDashboard({ session, notify, onLogout }) {
      const [activeTab, setActiveTab] = useState('lectures'); // 'lectures' | 'schedule' | 'results'
      const [lectures, setLectures] = useState([]);
      const [scheduleUrl, setScheduleUrl] = useState(null);
      const [schedKind, setSchedKind] = useState('weekly'); // 'weekly' | 'exam'
      const [schedSemester, setSchedSemester] = useState('sem1'); // 'sem1' | 'sem2'
      const [results, setResults] = useState([]);
      const [loadingData, setLoadingData] = useState(true);
      const [zoomSchedule, setZoomSchedule] = useState(false);

      // حالة تتبع أزرار الفتح والتنزيل للمحاضرات المجزأة
      const [loadingFileKey, setLoadingFileKey] = useState(null);

      // حالات التنقل داخل النتائج
      const [selectedSubject, setSelectedSubject] = useState(null);
      const [examCategory, setExamCategory] = useState(null); // 'daily' | 'sem1' | 'sem2'
      const [subExamType, setSubExamType] = useState(null); // 'mid' | 'final'

      const basePath = useMemo(() => {
        return getIsolatedBasePath(session.branchId, session.stageId, session.studyTypeId, session.departmentName);
      }, [session]);

      // التحقق من استمرار وجود حساب الطالب (خروج فوري عند حذفه من قبل المقرر)
      useEffect(() => {
        const { db, doc, onSnapshot } = window.fb;
        const studentRef = doc(db, `${basePath}/students/${session.studentId}`);
        const unsubStudent = onSnapshot(studentRef, (snap) => {
          if (!snap.exists()) {
            notify('تم حذف حسابك، يرجى التواصل مع مقرر القسم', 'error');
            if (onLogout) onLogout();
          }
        }, (err) => {
          console.error(err);
        });
        return () => unsubStudent();
      }, [basePath, session.studentId]);

      // الاستماع اللحظي للمحاضرات والنتائج المعزولة الخاصة بالطالب
      useEffect(() => {
        const { db, collection, query, where, onSnapshot } = window.fb;
        setLoadingData(true);

        const unsubLectures = onSnapshot(collection(db, `${basePath}/lectures`), (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setLectures(list);
          setLoadingData(false);
        }, (err) => {
          console.error(err);
          setLoadingData(false);
        });

        const qResults = query(
          collection(db, `${basePath}/results`),
          where('studentId', '==', session.studentId)
        );
        const unsubResults = onSnapshot(qResults, (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setResults(list);
        });

        return () => {
          unsubLectures();
          unsubResults();
        };
      }, [basePath, session.studentId]);

      // الاستماع لصورة الجدول المختار (أسبوعي/امتحاني + فصل أول/ثاني) فقط عندما يكون تبويب schedule مفتوحاً
      useEffect(() => {
        if (activeTab !== 'schedule') return;
        const { db, doc, getDoc, onSnapshot } = window.fb;
        const docKey = `${schedKind}_${schedSemester}`;
        let cancelled = false;

        const unsubSchedule = onSnapshot(doc(db, `${basePath}/schedule/${docKey}`), async (docSnap) => {
          if (cancelled) return;
          if (docSnap.exists()) {
            setScheduleUrl(docSnap.data().imageUrl);
          } else if (docKey === 'weekly_sem1') {
            try {
              const legacySnap = await getDoc(doc(db, `${basePath}/schedule/current`));
              if (!cancelled) {
                setScheduleUrl(legacySnap.exists() ? legacySnap.data().imageUrl : null);
              }
            } catch (_) {
              if (!cancelled) setScheduleUrl(null);
            }
          } else {
            setScheduleUrl(null);
          }
        }, (err) => {
          console.error(err);
        });

        return () => {
          cancelled = true;
          unsubSchedule();
        };
      }, [activeTab, basePath, schedKind, schedSemester]);

      // تنزيل المحاضرة من أجزاء Firestore
      const triggerBlobDownload = (blob, fileName) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName || 'lecture_file';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const handleDownloadChunkedLecture = async (lec) => {
        const key = `${lec.id}_download`;
        if (loadingFileKey) return;
        setLoadingFileKey(key);
        try {
          const lecDocPath = `${basePath}/lectures/${lec.id}`;
          const mime = lec.mimeType || resolveMimeType({ name: lec.fileName });
          const blob = await fetchFileBlobFromChunks(lecDocPath, mime);
          triggerBlobDownload(blob, lec.fileName || lec.title);
        } catch (err) {
          console.error(err);
          notify('تعذر تنزيل المحاضرة، تحقق من الاتصال بالإنترنت وأعد المحاولة', 'error');
        } finally {
          setLoadingFileKey(null);
        }
      };

      const handleOpenChunkedLecture = async (lec) => {
        const key = `${lec.id}_open`;
        if (loadingFileKey) return;

        const mime = lec.mimeType || resolveMimeType({ name: lec.fileName });
        const canPreviewInBrowser = mime === 'application/pdf' || mime.startsWith('image/');

        if (!canPreviewInBrowser) {
          await handleDownloadChunkedLecture(lec);
          return;
        }

        const popup = window.open('', '_blank');
        setLoadingFileKey(key);
        try {
          const lecDocPath = `${basePath}/lectures/${lec.id}`;
          const blob = await fetchFileBlobFromChunks(lecDocPath, mime);
          const blobUrl = URL.createObjectURL(blob);
          if (popup && !popup.closed) {
            popup.location.href = blobUrl;
          } else {
            triggerBlobDownload(blob, lec.fileName || lec.title);
          }
        } catch (err) {
          if (popup && !popup.closed) popup.close();
          console.error(err);
          notify('تعذر فتح المحاضرة، تحقق من الاتصال بالإنترنت وأعد المحاولة', 'error');
        } finally {
          setLoadingFileKey(null);
        }
      };

      // تجميع المحاضرات حسب الدكتور، ثم داخل كل دكتور حسب المادة، وبداخلها نظري وعملي منفصلان
      const groupedLectures = useMemo(() => {
        const doctorsMap = {};
        lectures.forEach(lec => {
          const docKey = lec.doctorId || `name_${normalizeArabic(lec.doctorName || 'دكتور المادة')}`;
          if (!doctorsMap[docKey]) {
            doctorsMap[docKey] = {
              doctorName: lec.doctorName || 'دكتور المادة',
              subjects: {}
            };
          }
          const subjNorm = normalizeArabic(lec.subjectName || 'مادة دراسية');
          if (!doctorsMap[docKey].subjects[subjNorm]) {
            doctorsMap[docKey].subjects[subjNorm] = {
              subjectName: lec.subjectName || 'مادة دراسية',
              theoretical: [],
              practical: []
            };
          }
          if (lec.lectureType === 'practical') {
            doctorsMap[docKey].subjects[subjNorm].practical.push(lec);
          } else {
            doctorsMap[docKey].subjects[subjNorm].theoretical.push(lec);
          }
        });
        return Object.entries(doctorsMap);
      }, [lectures]);

      // استخراج قائمة المواد المتوفرة في نتائج الطالب أو محاضراته
      const availableSubjects = useMemo(() => {
        const set = new Set();
        results.forEach(r => set.add(r.subjectName));
        lectures.forEach(l => set.add(l.subjectName));
        return Array.from(set);
      }, [results, lectures]);

      // تصفية الدرجات المعروضة بناءً على اختيار الطالب الدقيق
      const filteredStudentResults = useMemo(() => {
        if (!selectedSubject || !examCategory) return [];

        return results.filter(r => 
          normalizeArabic(r.subjectName) === normalizeArabic(selectedSubject) &&

      }, [results, selectedSubject, examCategory, subExamType]);

      const renderLectureRow = (lec) => {

      return (

          {/* 1. قسم المحاضرات (مفصول حسب الدكتور ثم المادة ثم نظري وعملي) */}

                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {/* 2. قسم الجدول الدراسي (بنوعين وفصلين) */}
          {activeTab === 'schedule' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
              <h3 className="text-lg font-extrabold text-slate-900 text-center">الجدول الدراسي</h3>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setSchedKind('weekly')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedKind === 'weekly'

                    }`}
                  >
                    جدول أسبوعي
                  </button>
                  <button
                    type="button"
                    onClick={() => setSchedKind('exam')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedKind === 'exam'

                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setSchedSemester('sem1')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedSemester === 'sem1'
                        ? 'bg-amber-600 text-white border-amber-600 shadow-xs'
                        : 'bg-amber-50 text-amber-900 border-amber-200 hover:border-amber-400'
                    }`}
                  >
                    الفصل الأول
                  </button>
                  <button
                    type="button"
                    onClick={() => setSchedSemester('sem2')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedSemester === 'sem2'

              <div className="text-center pt-2">
                {scheduleUrl ? (

                      onClick={() => setZoomSchedule(true)}

                        >

                        <button
                          onClick={() => { setExamCategory('sem1'); setSubExamType(null); }}
                          className={`p-3.5 rounded-2xl font-bold text-sm border-2 transition ${

                        </button>
                        <button

    // ==========================================

    function DoctorDashboard({ session, notify }) {

      const [myLectures, setMyLectures] = useState([]);
      const [editingLecture, setEditingLecture] = useState(null);

      const [gradeSubject, setGradeSubject] = useState('');

      const [gradeStudyType, setGradeStudyType] = useState('morning');
      const [gradeDeptId, setGradeDeptId] = useState(session.departmentId || '');
      const [rawPasteText, setRawPasteText] = useState('');
      const [parsedRows, setParsedRows] = useState([]);
      const [reviewMode, setReviewMode] = useState(false);
      const [publishingGrades, setPublishingGrades] = useState(false);

      // --- نتائجي المنشورة للدكتور ---
      const [myResultGroups, setMyResultGroups] = useState([]);
      const [expandedGroupId, setExpandedGroupId] = useState(null);
      const [groupStudents, setGroupStudents] = useState([]);
      const [loadingGroupDetails, setLoadingGroupDetails] = useState(false);

      useEffect(() => {
        if (departments.length > 0) {
          if (!deptId) setDeptId(session.departmentId || departments[0].id);
          if (!gradeDeptId) setGradeDeptId(session.departmentId || departments[0].id);
        }
      }, [departments, session.departmentId]);

      // جلب محاضرات ونتائج هذا الدكتور فقط ضمن الفرع
      useEffect(() => {
        const { db, collection, query, where, onSnapshot } = window.fb;
        const qLec = query(
          collection(db, `branches/${session.branchId}/doctor_lectures_index`),
          where('doctorId', '==', session.doctorId)
        );
        const unsubLec = onSnapshot(qLec, (snap) => {
          setMyLectures(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const qRes = query(
          collection(db, `branches/${session.branchId}/doctor_results_index`),
          where('doctorId', '==', session.doctorId)
        );
        const unsubRes = onSnapshot(qRes, (snap) => {
          setMyResultGroups(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        return () => {
          unsubLec();
          unsubRes();
        };
      }, [session]);

      // تقسيم محاضرات الدكتور إلى نظري وعملي
      const myTheoreticalLectures = useMemo(
        () => myLectures.filter(l => l.lectureType !== 'practical'),
        [myLectures]
      );
      const myPracticalLectures = useMemo(
        () => myLectures.filter(l => l.lectureType === 'practical'),
        [myLectures]
      );

      // إضافة محاضرة جديدة عبر الأجزاء (Chunks) في Firestore
      const handleAddLecture = async (e) => {
        e.preventDefault();
        if (uploading) return;

        const cleanSubj = cleanSpaces(subjectName);
        const cleanTitle = cleanSpaces(lectureTitle);
        const selectedDeptObj = departments.find(d => d.id === deptId);

        if (!cleanSubj || !cleanTitle || !selectedDeptObj || !lectureFile) {
          notify('يرجى ملء جميع الحقول واختيار القسم وملف المحاضرة', 'error');
          return;
        }

        cancelRef.current = false;
        setUploadProgress(0);
        setUploading(true);

        try {
          const { db, collection, setDoc, doc, serverTimestamp } = window.fb;
          const cleanDept = selectedDeptObj.name;
          const basePath = getIsolatedBasePath(session.branchId, stageId, studyTypeId, cleanDept);
          const lecRef = doc(collection(db, `${basePath}/lectures`));

          const { chunkCount, fileSize, mimeType } = await uploadFileInChunks({
            file: lectureFile,
            parentDocPath: lecRef.path,
            onProgress: (pct) => setUploadProgress(pct),
            cancelRef
          });

          const lecPayload = {
            subjectName: cleanSubj,
            lectureType,
            title: cleanTitle,
            doctorId: session.doctorId,
            doctorName: session.doctorName,
            branchId: session.branchId,
            stageId,
            studyTypeId,
            departmentId: selectedDeptObj.id,
            departmentName: cleanDept,
            fileName: lectureFile.name,
            chunkCount,
            fileSize,
            mimeType,
            createdAt: serverTimestamp()
          };

          await withTimeout(setDoc(lecRef, lecPayload), 30000, 'app/timeout');
          await withTimeout(
            setDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${lecRef.id}`), {
              ...lecPayload,
              lectureDocPath: lecRef.path
            }),
            30000,
            'app/timeout'
          );

          notify('تم رفع ونشر المحاضرة بنجاح!', 'success');
          setLectureTitle('');
          setLectureFile(null);
          if (lectureFileInputRef.current) lectureFileInputRef.current.value = '';
        } catch (err) {
          notify(uploadErrorMessage(err), 'error');
        } finally {
          setUploading(false);
          setUploadProgress(0);
        }
      };

      // حذف محاضرة للدكتور مع أجزائها
      const handleDeleteLecture = async (lec) => {
        if (!window.confirm(`هل أنت متأكد من حذف المحاضرة "${lec.title}"؟`)) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          if (lec.lectureDocPath) {
            await deleteChunks(lec.lectureDocPath);
            await deleteDoc(doc(db, lec.lectureDocPath));
          }
          await deleteDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${lec.id}`));
          notify('تم حذف المحاضرة بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف المحاضرة', 'error');
        }
      };

      // تعديل عنوان المحاضرة
      const handleUpdateLectureTitle = async () => {
        if (!editingLecture || !cleanSpaces(editingLecture.title)) return;
        try {
          const { db, doc, updateDoc } = window.fb;
          const newTitle = cleanSpaces(editingLecture.title);
          if (editingLecture.lectureDocPath) {
            await updateDoc(doc(db, editingLecture.lectureDocPath), { title: newTitle });
          }
          await updateDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${editingLecture.id}`), { title: newTitle });
          notify('تم تحديث عنوان المحاضرة', 'success');
          setEditingLecture(null);
        } catch (err) {
          notify('فشل التحديث', 'error');
        }
      };

      // قراءة ملف Excel / CSV للدرجات (تحمل SheetJS عند الحاجة فقط)
      const handleExcelUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const XLSXLib = await loadXLSX();
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSXLib.read(bstr, { type: 'binary' });
              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];
              const data = XLSXLib.utils.sheet_to_json(ws, { header: 1 });
              const lines = data
                .filter(row => row && row.length >= 2 && row[0] && row[1] !== undefined)
                .map(row => `${cleanSpaces(String(row[0]))} - ${String(row[1]).trim()}`);
              setRawPasteText(lines.join('\n'));
              notify(`تم استخراج ${lines.length} صف من الملف بنجاح`, 'success');
            } catch (parseErr) {
              console.error(parseErr);
              notify('تعذرت قراءة محتوى الملف، تأكد من صيغته', 'error');
            }
          };
          reader.readAsBinaryString(file);
        } catch (err) {
          console.error(err);
          notify('تعذر تحميل أداة قراءة Excel، تحقق من الإنترنت', 'error');
        }
      };

      // تحليل ومطابقة أسماء الطلاب مع قاعدة البيانات والتحقق من الدرجة العظمى
      const handleAnalyzeAndMatchGrades = async () => {
        const cleanSubj = cleanSpaces(gradeSubject);
        const selectedDeptObj = departments.find(d => d.id === gradeDeptId);
        const maxNum = Number(toLatinDigits(gradeMaxScore).trim());

        if (!cleanSubj || !selectedDeptObj || !rawPasteText.trim()) {
          notify('يرجى إدخال اسم المادة واختيار القسم وقائمة الطلاب والدرجات', 'error');
          return;
        }
        if (!Number.isFinite(maxNum) || maxNum <= 0) {
          notify('يرجى إدخال قيمة صحيحة لحقل "الدرجة من" (أكبر من 0)', 'error');
          return;
        }

        setPublishingGrades(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, selectedDeptObj.name);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const studentsList = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const lines = rawPasteText.split('\n').map(l => l.trim()).filter(Boolean);
          const analyzed = lines.map((line, idx) => {
            const match = line.match(/^(.+?)[\t\-:,،]+([^\t\-:,،]+)$/) || line.match(/^(.+?)\s+(\S+)$/);
            if (!match) {
              return { id: idx, rawLine: line, rawName: line, score: '', matchedStudent: null, status: 'invalid' };
            }
            const rawName = cleanSpaces(match[1]);
            const rawScoreStr = toLatinDigits(match[2]).trim();
            const numScore = Number(rawScoreStr);
            const normInput = normalizeArabic(rawName);
            const found = studentsList.find(s => s.normalizedName === normInput);

            if (!found) {
              return {
                id: idx,
                rawLine: line,
                rawName,
                score: rawScoreStr,
                matchedStudent: null,
                status: 'unmatched'
              };
            }

            if (rawScoreStr === '' || !Number.isFinite(numScore) || numScore < 0 || numScore > maxNum) {
              return {
                id: idx,
                rawLine: line,
                rawName,
                score: rawScoreStr,
                matchedStudent: found,
                status: 'badscore'
              };
            }

            return {
              id: idx,
              rawLine: line,
              rawName,
              score: numScore,
              matchedStudent: found,
              status: 'matched'
            };
          });

          setParsedRows(analyzed);
          setReviewMode(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء مطابقة أسماء الطلاب', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      // نشر الدرجات المطابقة فقط على دفعات متوازية مع فهرس نتائجي للدكتور
      const handlePublishMatchedGrades = async () => {
        const matchedItems = parsedRows.filter(r => r.status === 'matched' && r.matchedStudent);
        if (matchedItems.length === 0) {
          notify('لا توجد أسماء مطابقة لنشر درجاتها', 'error');
          return;
        }
        const selectedDeptObj = departments.find(d => d.id === gradeDeptId);
        if (!selectedDeptObj) {
          notify('يرجى اختيار القسم من القائمة', 'error');
          return;
        }

        const maxNum = Number(toLatinDigits(gradeMaxScore).trim());
        setPublishingGrades(true);
        try {
          const { db, doc, setDoc, serverTimestamp } = window.fb;
          const cleanSubj = cleanSpaces(gradeSubject);
          const cleanExamTitle = cleanSpaces(gradeExamTitle);
          const cleanDept = selectedDeptObj.name;
          const deptIdVal = selectedDeptObj.id;
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, cleanDept);
          const examHash = hashExamKey(cleanSubj, cleanExamTitle);
          const finalExamTitle = cleanExamTitle || `امتحان يومي - ${cleanSubj}`;

          const BATCH_SIZE = 20;
          for (let i = 0; i < matchedItems.length; i += BATCH_SIZE) {
            const batch = matchedItems.slice(i, i + BATCH_SIZE);
            await Promise.all(batch.map(item => {
              const resultId = `${item.matchedStudent.id}__daily__${examHash}`;
              return setDoc(doc(db, `${basePath}/results/${resultId}`), {
                studentId: item.matchedStudent.id,
                studentName: item.matchedStudent.fullName,
                subjectName: cleanSubj,
                examType: 'daily',
                examTitle: finalExamTitle,
                score: Number(item.score),
                maxScore: maxNum,
                doctorId: session.doctorId,
                doctorName: session.doctorName,
                examHash,
                branchId: session.branchId,
                stageId: gradeStage,
                studyTypeId: gradeStudyType,
                departmentId: deptIdVal,
                departmentName: cleanDept,
                createdAt: serverTimestamp()
              });
            }));
          }

          // حفظ مستند فهرس المجموعة في doctor_results_index
          const groupIndexId = `${session.doctorId}__${examHash}__${gradeStage}__${gradeStudyType}__${deptIdVal}`;
          await setDoc(doc(db, `branches/${session.branchId}/doctor_results_index/${groupIndexId}`), {
            doctorId: session.doctorId,
            subjectName: cleanSubj,
            examTitle: finalExamTitle,
            maxScore: maxNum,
            stageId: gradeStage,
            studyTypeId: gradeStudyType,
            departmentId: deptIdVal,
            departmentName: cleanDept,
            basePath,
            examHash,
            updatedAt: serverTimestamp()
          });

          notify(`تم نشر ${matchedItems.length} درجة`, 'success');
          setReviewMode(false);
          setRawPasteText('');
          setParsedRows([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر الدرجات', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      // عرض طلاب مجموعة درجات منشورة للدكتور
      const handleViewDoctorResultGroup = async (grp) => {
        if (expandedGroupId === grp.id) {
          setExpandedGroupId(null);
          setGroupStudents([]);
          return;
        }
        setExpandedGroupId(grp.id);
        setLoadingGroupDetails(true);
        try {
          const { db, collection, query, where, getDocs } = window.fb;
          const q = query(
            collection(db, `${grp.basePath}/results`),
            where('examHash', '==', grp.examHash),
            where('doctorId', '==', session.doctorId)
          );
          const snap = await getDocs(q);
          setGroupStudents(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء تحميل قائمة الطلاب', 'error');
        } finally {
          setLoadingGroupDetails(false);
        }
      };

      // حذف درجة طالب واحد من مجموعة الدكتور
      const handleDeleteSingleDoctorResult = async (grp, resItem) => {
        if (!window.confirm(`هل أنت متأكد من حذف درجة الطالب "${resItem.studentName}"؟`)) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          await deleteDoc(doc(db, `${grp.basePath}/results/${resItem.id}`));
          const remaining = groupStudents.filter(s => s.id !== resItem.id);
          setGroupStudents(remaining);
          if (remaining.length === 0) {
            await deleteDoc(doc(db, `branches/${session.branchId}/doctor_results_index/${grp.id}`));
            setExpandedGroupId(null);
          }
          notify('تم حذف الدرجة بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف الدرجة', 'error');
        }
      };

      // حذف مجموعة درجات كاملة للدكتور
      const handleDeleteDoctorResultGroup = async (grp) => {
        if (!window.confirm(`هل أنت متأكد من حذف جميع درجات "${grp.examTitle}" بالكامل؟`)) return;
        try {
          const { db, collection, query, where, getDocs, doc, deleteDoc } = window.fb;
          const q = query(
            collection(db, `${grp.basePath}/results`),
            where('examHash', '==', grp.examHash),
            where('doctorId', '==', session.doctorId)
          );
          const snap = await getDocs(q);
          for (const d of snap.docs) {
            await deleteDoc(doc(db, `${grp.basePath}/results/${d.id}`));
          }
          await deleteDoc(doc(db, `branches/${session.branchId}/doctor_results_index/${grp.id}`));
          if (expandedGroupId === grp.id) {
            setExpandedGroupId(null);
            setGroupStudents([]);
          }
          notify('تم حذف مجموعة الدرجات بالكامل', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف المجموعة', 'error');
        }
      };

      const maxNumDisplay = Number(toLatinDigits(gradeMaxScore).trim()) || 0;

      const renderMyLectureCard = (lec) => (
        <div key={lec.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-ntu-100 text-ntu-800">
              {lec.subjectName} – {lec.lectureType === 'practical' ? 'عملي' : 'نظري'}
            </span>
            <p className="font-extrabold text-slate-900 mt-1.5">{lec.title}</p>
            <p className="text-xs text-slate-500 mt-0.5">
              {lec.departmentName} | مرحلة {STAGES.find(s => s.id === lec.stageId)?.name} ({STUDY_TYPES.find(t => t.id === lec.studyTypeId)?.name})
            </p>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button
              onClick={() => setEditingLecture({ ...lec })}
              className="px-3.5 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs"
            >
              تعديل
            </button>
            <button
              onClick={() => handleDeleteLecture(lec)}
              className="px-3.5 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs"
            >
              حذف
            </button>
          </div>
        </div>
      );

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
          {/* بطاقة معلومات الدكتور */}
          <div className="bg-gradient-to-l from-slate-900 to-ntu-900 rounded-3xl p-5 sm:p-6 text-white shadow-lg">
            <span className="px-3 py-1 rounded-full bg-ntu-600/40 text-ntu-100 text-xs font-bold">لوحة تحكم التدريسي</span>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-2">{session.doctorName}</h2>
            <p className="text-xs sm:text-sm text-slate-300 mt-1">
              فرع {BRANCHES.find(b => b.id === session.branchId)?.name} | {session.subjectAndDept}
            </p>
          </div>

          {/* أزرار التبويب */}
          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={() => setActiveTab('lectures')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeTab === 'lectures' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
              }`}
            >
              إنشاء محاضرات
            </button>
            <button
              onClick={() => setActiveTab('daily_grades')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeTab === 'daily_grades' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
              }`}
            >
              امتحانات يومية
            </button>
          </div>

          {/* تبويب 1: إنشاء محاضرات */}
          {activeTab === 'lectures' && (
            <div className="space-y-6">
              <form onSubmit={handleAddLecture} className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
                <h3 className="text-lg font-extrabold text-slate-900">إضافة محاضرة جديدة</h3>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">اسم المادة</label>
                    <input
                      type="text"
                      value={subjectName}
                      onChange={(e) => setSubjectName(e.target.value)}
                      placeholder="مثال: طفيليات"
                      className="w-full p-3 rounded-2xl border border-slate-300 outline-none focus:ring-2 focus:ring-ntu-600"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">نوع المحاضرة</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setLectureType('theoretical')}
                        className={`py-3 rounded-2xl font-bold text-sm border-2 ${
                          lectureType === 'theoretical' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
                        }`}
                      >
                        نظري
                      </button>
                      <button
                        type="button"
                        onClick={() => setLectureType('practical')}
                        className={`py-3 rounded-2xl font-bold text-sm border-2 ${
                          lectureType === 'practical' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
                        }`}
                      >
                        عملي
                      </button>
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">عنوان المحاضرة</label>
                  <input
                    type="text"
                    value={lectureTitle}
                    onChange={(e) => setLectureTitle(e.target.value)}
                    placeholder="مثال: المحاضرة الأولى - مقدمة في علم الطفيليات"
                    className="w-full p-3 rounded-2xl border border-slate-300 outline-none focus:ring-2 focus:ring-ntu-600"
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">المرحلة</label>
                    <select value={stageId} onChange={(e) => setStageId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">نوع الدراسة</label>
                    <select value={studyTypeId} onChange={(e) => setStudyTypeId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">
                      {STUDY_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">القسم</label>
                    {departments.length === 0 ? (
                      <div className="p-3 rounded-2xl bg-slate-100 border border-slate-200 text-slate-600 text-xs font-bold">
                        لا توجد أقسام بعد. يضيفها مقرر القسم
                      </div>
                    ) : (
                      <select
                        value={deptId}
                        onChange={(e) => setDeptId(e.target.value)}
                        className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold"
                      >
                        {departments.map(d => (
                          <option key={d.id} value={d.id}>{d.name}</option>
                        ))}
                      </select>
                    )}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">ملف المحاضرة (PDF / Word / PowerPoint)</label>
                  <input
                    ref={lectureFileInputRef}
                    type="file"
                    accept=".pdf,.doc,.docx,.ppt,.pptx"
                    onChange={(e) => setLectureFile(e.target.files?.[0] || null)}
                    className="w-full p-3 rounded-2xl border border-dashed border-ntu-400 bg-ntu-50/40 text-sm"
                  />
