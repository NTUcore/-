    // ==========================================
    // 7. واجهة مقرر القسم (Department Coordinator)
    // ==========================================
    function CoordinatorDashboard({ session, notify }) {
      // التبديل بين أقسام المقرر: 'results' | 'schedule' | 'members' | 'published'
      const [activeSection, setActiveSection] = useState('results');

      // اختيار الفصل والامتحان على مستويين
      const [selectedSemester, setSelectedSemester] = useState(null); // 'sem1' | 'sem2'
      const [selectedSubExam, setSelectedSubExam] = useState(null); // 'mid' | 'final'
      const [midMaxScore, setMidMaxScore] = useState(40); // 30 أو 40 (الافتراضي 40)

      // الفرع والقسم ثابتان من جلسة المقرر
      const branchId = session.branchId;
      const branchName = BRANCHES.find(b => b.id === branchId)?.name || branchId;

      const [stageId, setStageId] = useState('stage1');
      const [studyTypeId, setStudyTypeId] = useState('morning');
      const deptName = session.departmentName || '';

      const [rawText, setRawText] = useState('');
      const [reviewList, setReviewList] = useState([]);
      const [isReviewing, setIsReviewing] = useState(false);
      const [processing, setProcessing] = useState(false);

      // حالات رفع الجدول الدراسي لمقرر القسم (نوعين وفصلين)
      const [schedKind, setSchedKind] = useState('weekly'); // 'weekly' | 'exam'
      const [schedSemester, setSchedSemester] = useState('sem1'); // 'sem1' | 'sem2'
      const [schedStage, setSchedStage] = useState('stage1');
      const [schedStudyType, setSchedStudyType] = useState('morning');
      const [schedFile, setSchedFile] = useState(null);
      const [uploadingSched, setUploadingSched] = useState(false);
      const [schedProgress, setSchedProgress] = useState(0);
      const cancelSchedRef = useRef(false);
      const schedInputRef = useRef(null);

      // --- حالات "سجل أعضاء" ---
      const [membersTab, setMembersTab] = useState('students'); // 'students' | 'doctors'
      const [memberStageFilter, setMemberStageFilter] = useState('all');
      const [memberStudyFilter, setMemberStudyFilter] = useState('all');
      const [memberSearch, setMemberSearch] = useState('');
      const [deptStudents, setDeptStudents] = useState([]);
      const [loadingMembers, setLoadingMembers] = useState(false);
      const [resetPassTarget, setResetPassTarget] = useState(null);
      const [newStudentPass, setNewStudentPass] = useState('');
      const [updatingPass, setUpdatingPass] = useState(false);
      const [deptDoctors, setDeptDoctors] = useState([]);
      const [loadingDoctors, setLoadingDoctors] = useState(false);

      // --- حالات "ما تم نشره" ---
      const [publishedTab, setPublishedTab] = useState('results'); // 'results' | 'schedules'
      const [pubStage, setPubStage] = useState('stage1');
      const [pubStudyType, setPubStudyType] = useState('morning');
      const [pubResultGroups, setPubResultGroups] = useState([]);
      const [loadingPubResults, setLoadingPubResults] = useState(false);
      const [expandedPubGroupKey, setExpandedPubGroupKey] = useState(null);
      const [pubSchedules, setPubSchedules] = useState([]);
      const [loadingPubSchedules, setLoadingPubSchedules] = useState(false);
      const [viewingScheduleImg, setViewingScheduleImg] = useState(null);

      // معرّف نوع الامتحان الفعلي المحفوظ في Firestore
      const selectedExamType = useMemo(() => {
        if (!selectedSemester || !selectedSubExam) return null;
        return `${selectedSemester}_${selectedSubExam}`;
      }, [selectedSemester, selectedSubExam]);

      const currentMaxScore = selectedSubExam === 'final' ? 100 : midMaxScore;

      const examLabelsMap = {
        sem1_mid: 'الفصل الأول – ميدتيرم',
        sem1_final: 'الفصل الأول – فاينل',
        sem2_mid: 'الفصل الثاني – ميدتيرم',
        sem2_final: 'الفصل الثاني – فاينل'
      };

      // التحقق من أن مقرر القسم يعدّل قسمه فقط
      const isAuthorizedDept = () => {
        return slugifyDept(cleanSpaces(deptName)) === session.departmentId;
      };

      const handleExcelImport = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const XLSXLib = await loadXLSX();
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const wb = XLSXLib.read(evt.target.result, { type: 'binary' });
              const ws = wb.Sheets[wb.SheetNames[0]];
              const rows = XLSXLib.utils.sheet_to_json(ws, { header: 1 });
              const formatted = rows
                .filter(r => r && r.length >= 3 && r[0] && r[1] && r[2] !== undefined)
                .map(r => `${cleanSpaces(String(r[0]))} | ${cleanSpaces(String(r[1]))} | ${String(r[2]).trim()}`);
              setRawText(formatted.join('\n'));
              notify(`تم استيراد ${formatted.length} سجل من الملف`, 'success');
            } catch (parseErr) {
              console.error(parseErr);
              notify('تعذرت قراءة محتوى الملف، تأكد من صيغته', 'error');
            }
          };
          reader.readAsBinaryString(file);
        } catch (err) {
          console.error(err);
          notify('تعذر تحميل أداة قراءة Excel، تحقق من الإنترنت', 'error');
        }
      };

      const handleVerifyCoordinatorData = async () => {
        if (!selectedExamType) {
          notify('يرجى اختيار الفصل ونوع الامتحان أولاً', 'error');
          return;
        }
        if (!isAuthorizedDept()) {
          notify(`غير مصرح لك! يمكنك النشر لقسمك (${session.departmentName}) فقط.`, 'error');
          return;
        }
        if (!rawText.trim()) {
          notify('يرجى إدخال النتائج أو رفع ملف Excel', 'error');
          return;
        }

        setProcessing(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const students = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const maxAllowed = currentMaxScore;
          const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
          const checked = lines.map((line, i) => {
            const parts = line.split(/[\|\t,،\-]+/).map(p => cleanSpaces(p)).filter(Boolean);
            if (parts.length < 3) {
              return { id: i, rawLine: line, subject: '', rawName: line, score: '', matchedStudent: null, status: 'invalid' };
            }
            const subject = parts[0];
            const rawScoreStr = toLatinDigits(parts[parts.length - 1]).trim();
            const numScore = Number(rawScoreStr);
            const rawName = parts.slice(1, parts.length - 1).join(' ');
            const normName = normalizeArabic(rawName);

            const found = students.find(s => s.normalizedName === normName);
            if (!found) {
              return {
                id: i,
                rawLine: line,
                subject,
                rawName,
                score: rawScoreStr,
                matchedStudent: null,
                status: 'unmatched'
              };
            }

            if (rawScoreStr === '' || !Number.isFinite(numScore) || numScore < 0 || numScore > maxAllowed) {
              return {
                id: i,
                rawLine: line,
                subject,
                rawName,
                score: rawScoreStr,
                matchedStudent: found,
                status: 'badscore'
              };
            }

            return {
              id: i,
              rawLine: line,
              subject,
              rawName,
              score: numScore,
              matchedStudent: found,
              status: 'matched'
            };
          });

          setReviewList(checked);
          setIsReviewing(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء فحص البيانات', 'error');
        } finally {
          setProcessing(false);
        }
      };

      const handlePublishResults = async () => {
        const validRows = reviewList.filter(r => r.status === 'matched' && r.matchedStudent);
        if (validRows.length === 0) {
          notify('لا توجد سجلات مطابقة للنشر', 'error');
          return;
        }

        const maxAllowed = currentMaxScore;
        setProcessing(true);
        try {
          const { db, doc, setDoc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const examLabel = examLabelsMap[selectedExamType] || selectedExamType;

          const BATCH_SIZE = 20;
          for (let i = 0; i < validRows.length; i += BATCH_SIZE) {
            const batch = validRows.slice(i, i + BATCH_SIZE);
            await Promise.all(batch.map(row => {
              const subjHash = hashExamKey(row.subject, '');
              const resultId = `${row.matchedStudent.id}__${selectedExamType}__${subjHash}`;
              return setDoc(doc(db, `${basePath}/results/${resultId}`), {
                studentId: row.matchedStudent.id,
                studentName: row.matchedStudent.fullName,
                subjectName: row.subject,
                examType: selectedExamType,
                examTitle: `${row.subject} (${examLabel})`,
                score: Number(row.score),
                maxScore: maxAllowed,
                publishedBy: 'مقرر القسم',
                branchId,
                stageId,
                studyTypeId,
                departmentId: session.departmentId,
                departmentName: session.departmentName,
                createdAt: serverTimestamp()
              });
            }));
          }

          notify(`تم نشر ${validRows.length} درجة`, 'success');
          setIsReviewing(false);
          setRawText('');
          setReviewList([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر النتائج', 'error');
        } finally {
          setProcessing(false);
        }
      };

      // رفع صورة الجدول الدراسي للقسم (بنوعين وفصلين) مع فهرس خفيف
      const handleCoordinatorUploadSchedule = async (e) => {
        e.preventDefault();
        if (uploadingSched) return;

        if (!isAuthorizedDept()) {
          notify(`غير مصرح لك! يمكنك رفع الجدول لقسمك (${session.departmentName}) فقط.`, 'error');
          return;
        }
        if (!schedFile) {
          notify('يرجى اختيار صورة الجدول الدراسي أولاً', 'error');
          return;
        }

        cancelSchedRef.current = false;
        setSchedProgress(10);
        setUploadingSched(true);

        try {
          const compressedDataUrl = await compressImageToDataUrl(schedFile, 850000);
          if (cancelSchedRef.current) {
            const cErr = new Error('canceled');
            cErr.code = 'canceled';
            throw cErr;
          }
          setSchedProgress(60);

          const { db, doc, setDoc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(branchId, schedStage, schedStudyType, session.departmentName);
          const schedDocKey = `${schedKind}_${schedSemester}`;

          await withTimeout(
            setDoc(doc(db, `${basePath}/schedule/${schedDocKey}`), {
              imageUrl: compressedDataUrl,
              kind: schedKind,
              semester: schedSemester,
              updatedBy: `مقرر قسم (${session.departmentName})`,
              updatedAt: serverTimestamp()
            }),
            45000,
            'app/timeout'
          );

          const indexDocId = `${session.departmentId}__${schedStage}__${schedStudyType}__${schedKind}__${schedSemester}`;
          await withTimeout(
            setDoc(doc(db, `branches/${branchId}/schedule_index/${indexDocId}`), {
              departmentId: session.departmentId,
              departmentName: session.departmentName,
              kind: schedKind,
              semester: schedSemester,
              stageId: schedStage,
              studyTypeId: schedStudyType,
              basePath,
              updatedAt: serverTimestamp()
            }),
            30000,
            'app/timeout'
          );

          setSchedProgress(100);
          notify('تم رفع ونشر صورة الجدول الدراسي بنجاح!', 'success');
          setSchedFile(null);
          if (schedInputRef.current) schedInputRef.current.value = '';
        } catch (err) {
          notify(uploadErrorMessage(err), 'error');
        } finally {
          setUploadingSched(false);
          setSchedProgress(0);
        }
      };

      // ==========================================
      // منطق تبويب "سجل أعضاء"
      // ==========================================
      useEffect(() => {
        if (activeSection !== 'members') return;
        const { db, collection, getDocs } = window.fb;

        if (membersTab === 'students') {
          let cancelled = false;
          setLoadingMembers(true);

          const targetStages = memberStageFilter === 'all' ? STAGES.map(s => s.id) : [memberStageFilter];
          const targetTypes = memberStudyFilter === 'all' ? STUDY_TYPES.map(t => t.id) : [memberStudyFilter];

          const tasks = [];
          for (const stId of targetStages) {
            for (const tyId of targetTypes) {
              const bp = getIsolatedBasePath(branchId, stId, tyId, session.departmentName);
              tasks.push(
                getDocs(collection(db, `${bp}/students`)).then(snap =>
                  snap.docs.map(d => ({
                    id: d.id,
                    basePath: bp,
                    ...d.data(),
                    stageId: d.data().stageId || stId,
                    studyTypeId: d.data().studyTypeId || tyId
                  }))
                )
              );
            }
          }

          Promise.all(tasks)
            .then(resultsArrays => {
              if (cancelled) return;
              const merged = resultsArrays.flat().sort((a, b) =>
                (a.fullName || '').localeCompare(b.fullName || '', 'ar')
              );
              setDeptStudents(merged);
            })
            .catch(err => {
              console.error(err);
              if (!cancelled) notify('حدث خطأ أثناء تحميل سجل الطلاب', 'error');
            })
            .finally(() => {
              if (!cancelled) setLoadingMembers(false);
            });

          return () => { cancelled = true; };
        } else if (membersTab === 'doctors') {
          let cancelled = false;
          setLoadingDoctors(true);
          getDocs(collection(db, `branches/${branchId}/doctors`))
            .then(snap => {
              if (cancelled) return;
              const list = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(docItem => docItem.deptMap && docItem.deptMap[session.departmentId]);
              setDeptDoctors(list);
            })
            .catch(err => {
              console.error(err);
              if (!cancelled) notify('حدث خطأ أثناء تحميل قائمة الدكاترة', 'error');
            })
            .finally(() => {
              if (!cancelled) setLoadingDoctors(false);
            });
          return () => { cancelled = true; };
        }
      }, [activeSection, membersTab, memberStageFilter, memberStudyFilter, branchId, session.departmentName, session.departmentId]);

      const filteredDeptStudents = useMemo(() => {
        const q = normalizeArabic(memberSearch);
        if (!q) return deptStudents;
        return deptStudents.filter(st => normalizeArabic(st.fullName).includes(q));
      }, [deptStudents, memberSearch]);

      const handleSaveNewStudentPassword = async (e) => {
        e.preventDefault();
        if (!resetPassTarget || updatingPass) return;
        if (!newStudentPass || newStudentPass.length < 4) {
          notify('يرجى إدخال رمز سري جديد لا يقل عن 4 أحرف/أرقام', 'error');
          return;
        }

        setUpdatingPass(true);
        try {
          const { db, doc, updateDoc } = window.fb;
          const salt = generateSalt();
          const passwordHash = await hashPassword(newStudentPass, salt);
          await updateDoc(doc(db, `${resetPassTarget.basePath}/students/${resetPassTarget.id}`), {
            salt,
            passwordHash
          });
          notify(`تم تحديث الرمز السري للطالب ${resetPassTarget.fullName} بنجاح`, 'success');
          setResetPassTarget(null);
          setNewStudentPass('');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء تحديث الرمز السري', 'error');
        } finally {
          setUpdatingPass(false);
        }
      };

      const handleDeleteStudentMember = async (st) => {
        if (!window.confirm(`هل أنت متأكد من حذف الطالب "${st.fullName}" وجميع درجاته نهائياً؟`)) return;
        try {
          const { db, doc, deleteDoc, collection, query, where, getDocs } = window.fb;
          await deleteDoc(doc(db, `${st.basePath}/students/${st.id}`));
          try {
            await deleteDoc(doc(db, `branches/${branchId}/student_index/${st.id}`));
          } catch (_) {}

          const qRes = query(collection(db, `${st.basePath}/results`), where('studentId', '==', st.id));
          const resSnap = await getDocs(qRes);
          for (const rDoc of resSnap.docs) {
            await deleteDoc(doc(db, `${st.basePath}/results/${rDoc.id}`));
          }

          setDeptStudents(prev => prev.filter(item => item.id !== st.id));
          notify('تم حذف الطالب وجميع سجلاته بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف الطالب', 'error');
        }
      };

      const handleDeleteDoctorMember = async (docItem) => {

        try {
          const { db, doc, deleteDoc } = window.fb;
          await deleteDoc(doc(db, `branches/${branchId}/doctors/${docItem.id}`));
          setDeptDoctors(prev => prev.filter(item => item.id !== docItem.id));
          notify('تم حذف الدكتور بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف الدكتور', 'error');
        }
      };

      // ==========================================
      // منطق تبويب "ما تم نشره"
      // ==========================================
      const loadPublishedResults = async () => {
        setLoadingPubResults(true);
        setExpandedPubGroupKey(null);
        try {
          const { db, collection, getDocs } = window.fb;
          const bp = getIsolatedBasePath(branchId, pubStage, pubStudyType, session.departmentName);
          const snap = await getDocs(collection(db, `${bp}/results`));
          const semesterTypes = new Set(['sem1_mid', 'sem1_final', 'sem2_mid', 'sem2_final']);

            .filter(r => semesterTypes.has(r.examType));

          const groupsMap = {};
          rawRows.forEach(r => {
            const gKey = `${r.examType}__${normalizeArabic(r.subjectName)}`;
            if (!groupsMap[gKey]) {
              groupsMap[gKey] = {
                key: gKey,
                examType: r.examType,
                examLabel: examLabelsMap[r.examType] || r.examType,
                subjectName: r.subjectName,
                maxScore: r.maxScore,
                basePath: bp,
                items: []
              };
            }
            groupsMap[gKey].items.push(r);
          });

          setPubResultGroups(Object.values(groupsMap));
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء جلب النتائج المنشورة', 'error');
        } finally {
          setLoadingPubResults(false);
        }
      };

      const loadPublishedSchedules = async () => {
        setLoadingPubSchedules(true);
        try {
          const { db, collection, query, where, getDocs } = window.fb;
          const q = query(
            collection(db, `branches/${branchId}/schedule_index`),
            where('departmentId', '==', session.departmentId)

          const snap = await getDocs(q);

          notify('حدث خطأ أثناء جلب الجداول المنشورة', 'error');

          setLoadingPubSchedules(false);

          loadPublishedSchedules();

      }, [activeSection, publishedTab, pubStage, pubStudyType]);

      const handleDeleteSinglePublishedResult = async (groupKey, item) => {

          notify('حدث خطأ أثناء حذف النتيجة', 'error');

          for (const item of grp.items) {

          if (expandedPubGroupKey === grp.key) setExpandedPubGroupKey(null);
          notify('تم حذف نتائج المادة بالكامل', 'success');

          notify('حدث خطأ أثناء حذف المادة', 'error');
        }
      };

      const handleViewPublishedSchedule = async (schedItem) => {
        try {
          const { db, doc, getDoc } = window.fb;
          const docKey = `${schedItem.kind}_${schedItem.semester}`;
          const snap = await getDoc(doc(db, `${schedItem.basePath}/schedule/${docKey}`));
          if (snap.exists() && snap.data().imageUrl) {

          notify('تعذر تحميل صورة الجدول', 'error');
        }
      };

      const handleDeletePublishedSchedule = async (schedItem) => {
        if (!window.confirm('هل أنت متأكد من حذف هذا الجدول نهائياً؟')) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          const docKey = `${schedItem.kind}_${schedItem.semester}`;
          await deleteDoc(doc(db, `${schedItem.basePath}/schedule/${docKey}`));
          await deleteDoc(doc(db, `branches/${branchId}/schedule_index/${schedItem.id}`));

          notify('حدث خطأ أثناء حذف الجدول', 'error');

      const formatFirestoreDate = (ts) => {
        if (!ts) return '—';
        try {
          const d = ts.toDate ? ts.toDate() : new Date(ts);
          return d.toLocaleDateString('ar-IQ');
        } catch {
          return '—';
        }

        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">

            <span className="px-3 py-1 rounded-full bg-white/20 text-xs font-bold">لوحة مقرر القسم</span>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-2">{session.departmentName}</h2>
            <p className="text-xs sm:text-sm text-amber-100 mt-1">
              فرع {branchName} | إدارة ونشر نتائج الفصول الدراسية والجدول الأسبوعي والأعضاء
            </p>

          {/* 4 أزرار للتبديل فوق البطاقة (grid-cols-2 على الجوال و grid-cols-4 على الشاشات الكبيرة) */}

            <button

              className={`p-3.5 rounded-2xl font-extrabold text-sm border-2 transition ${
                activeSection === 'results'

                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              نتائج
            </button>
            <button
              onClick={() => setActiveSection('schedule')}
              className={`p-3.5 rounded-2xl font-extrabold text-sm border-2 transition ${
                activeSection === 'schedule'
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md'
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'

            >

            >
              سجل أعضاء
            </button>
            <button

            >
              ما تم نشره
            </button>
          </div>

          {/* القسم الأول: نتائج الامتحانات الفصلية */}
          {activeSection === 'results' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-5">
              <h3 className="text-lg font-extrabold text-slate-900">نتائج الامتحانات الفصلية</h3>

                  className={`p-4 rounded-2xl font-extrabold text-sm border-2 transition ${

                      ? 'bg-ntu-700 text-white border-ntu-700 shadow-md'

                >

                </button>
                <button
                  type="button"
                  onClick={() => {
                    setSelectedSemester('sem2');
                    setSelectedSubExam(null);
                    setIsReviewing(false);
                  }}
                  className={`p-4 rounded-2xl font-extrabold text-sm border-2 transition ${
                    selectedSemester === 'sem2'
                      ? 'bg-ntu-700 text-white border-ntu-700 shadow-md'
                      : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-ntu-400'

                >
                  الفصل الثاني

              {selectedSemester && (
                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={() => {

                  >

                  <button
                    type="button"
                    onClick={() => {

                      setIsReviewing(false);

                    className={`p-3.5 rounded-2xl font-extrabold text-sm border-2 transition ${
                      selectedSubExam === 'final'

                              type="button"
                              onClick={() => handleDeletePublishedSchedule(sc)}
                              className="px-3.5 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs"
                            >
                              حذف
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              )}

              {/* نافذة معاينة الجدول المنشور */}
              {viewingScheduleImg && (
                <div
                  onClick={() => setViewingScheduleImg(null)}
                  className="fixed inset-0 z-50 bg-black/90 p-4 flex items-center justify-center cursor-zoom-out"
                >
                  <img src={viewingScheduleImg} alt="معاينة الجدول" className="max-w-full max-h-full object-contain rounded-xl" />
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. التطبيق الرئيسي (Main App Container)
    // ==========================================
    function App() {
      const [cloudReady, setCloudReady] = useState(!!window.fbAuthed);
      const [authConfig, setAuthConfig] = useState(DEFAULT_AUTH_CONFIG);

      // جلسة الدخول (مع حذف جلسة مقرر القسم القديمة إذا كانت بدون branchId)
      const [userSession, setUserSession] = useState(() => {
        try {
          const saved = localStorage.getItem('ntu_platform_session');
          if (!saved) return null;
          const parsed = JSON.parse(saved);
          if (parsed && parsed.role === 'coordinator' && !parsed.branchId) {
            localStorage.removeItem('ntu_platform_session');
            return null;
          }
          return parsed;
        } catch {
          return null;
        }
      });

      const [profileOpen, setProfileOpen] = useState(false);
      const [toast, setToast] = useState({ message: '', type: 'success' });

      const notify = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast({ message: '', type: 'success' }), 4500);
      };

      // انتظار المصادقة السحابية في الخلفية وجلب config/auth دون حجب الواجهة
      useEffect(() => {
        let active = true;
        waitForFirebase().then(async () => {
          if (!active) return;
          setCloudReady(true);
          try {
            const { db, doc, getDoc, setDoc } = window.fb;
            const configRef = doc(db, 'config', 'auth');
            const snap = await getDoc(configRef);
            if (!active) return;
            if (snap.exists()) {
              setAuthConfig({ ...DEFAULT_AUTH_CONFIG, ...snap.data() });
            } else {
              await setDoc(configRef, DEFAULT_AUTH_CONFIG);
            }
          } catch (e) {
            console.warn('Using default config:', e);
          }
        });

        return () => { active = false; };
      }, []);

      const handleLoginSuccess = (sessionObj) => {
        setUserSession(sessionObj);
        try {
          localStorage.setItem('ntu_platform_session', JSON.stringify(sessionObj));
        } catch (_) {}
      };

      const handleLogout = () => {
        setUserSession(null);
        setProfileOpen(false);
        try {
          localStorage.removeItem('ntu_platform_session');
        } catch (_) {}
        notify('تم تسجيل الخروج بنجاح', 'success');
      };

      return (
        <div className="min-h-screen flex flex-col">
          <Header
            userSession={userSession}
            onLogout={handleLogout}
            onOpenProfile={() => setProfileOpen(true)}
          />

          <main className="flex-1">
            {!userSession && (
              <LandingAndAuth
                authConfig={authConfig}
                onLoginSuccess={handleLoginSuccess}
                notify={notify}
              />
            )}

            {userSession && !cloudReady && (
              <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6 animate-pulse">
                <div className="h-28 rounded-3xl bg-slate-200"></div>
                <div className="grid grid-cols-3 gap-3">
                  <div className="h-14 rounded-2xl bg-slate-200"></div>
                  <div className="h-14 rounded-2xl bg-slate-200"></div>
                  <div className="h-14 rounded-2xl bg-slate-200"></div>
                </div>
                <div className="h-64 rounded-3xl bg-slate-200"></div>
              </div>
            )}

            {userSession && cloudReady && userSession.role === 'student' && (
              <StudentDashboard session={userSession} notify={notify} onLogout={handleLogout} />
            )}

            {userSession && cloudReady && userSession.role === 'doctor' && (
              <DoctorDashboard session={userSession} notify={notify} />
            )}

            {userSession && cloudReady && userSession.role === 'coordinator' && (
              <CoordinatorDashboard session={userSession} notify={notify} />
            )}
          </main>

          <ProfileModal
            isOpen={profileOpen}
            onClose={() => setProfileOpen(false)}
            session={userSession}
          />

          <Toast
            message={toast.message}
            type={toast.type}
            onClose={() => setToast({ message: '', type: 'success' })}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
