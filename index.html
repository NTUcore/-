    // ==========================================
    // 7. واجهة مقرر القسم (Department Coordinator)
    // ==========================================
    function CoordinatorDashboard({ session, departments, notify }) {
      const [activeSection, setActiveSection] = useState('results'); // 'results' | 'schedule'
      const [selectedExamType, setSelectedExamType] = useState(null); // 'sem1_mid' | 'sem1_final' | 'sem2_mid' | 'sem2_final'
      const [branchId, setBranchId] = useState('kirkuk');
      const [stageId, setStageId] = useState('stage1');
      const [studyTypeId, setStudyTypeId] = useState('morning');
      const [deptName, setDeptName] = useState(session.departmentName || departments[0] || DEFAULT_DEPARTMENTS[0]);

      const [rawText, setRawText] = useState('');
      const [reviewList, setReviewList] = useState([]);
      const [isReviewing, setIsReviewing] = useState(false);
      const [processing, setProcessing] = useState(false);

      // --- حقول رفع الجدول الدراسي لمقرر القسم ---
      const [schedBranchId, setSchedBranchId] = useState('kirkuk');
      const [schedStageId, setSchedStageId] = useState('stage1');
      const [schedStudyTypeId, setSchedStudyTypeId] = useState('morning');
      const [schedDeptName, setSchedDeptName] = useState(session.departmentName || departments[0] || DEFAULT_DEPARTMENTS[0]);
      const [schedFile, setSchedFile] = useState(null);
      const [uploadingSched, setUploadingSched] = useState(false);
      const [schedProgress, setSchedProgress] = useState(0);
      const schedUploadTaskRef = useRef(null);
      const schedFileInputRef = useRef(null);

      const examOptions = [
        { id: 'sem1_mid', label: 'الفصل الأول – ميدتيرم', maxScore: 40 },
        { id: 'sem1_final', label: 'الفصل الأول – فاينل', maxScore: 100 },
        { id: 'sem2_mid', label: 'الفصل الثاني – ميدتيرم', maxScore: 40 },
        { id: 'sem2_final', label: 'الفصل الثاني – فاينل', maxScore: 100 }
      ];

      // الدرجة العظمى التلقائية حسب نوع الامتحان المختار
      const currentMaxScore = useMemo(() => {
        if (!selectedExamType) return null;
        return selectedExamType.endsWith('_mid') ? 40 : 100;
      }, [selectedExamType]);

      // التحقق من أن مقرر القسم يعدّل قسمه فقط
      const isAuthorizedDept = (targetDept = deptName) => {
        return slugifyDept(cleanSpaces(targetDept)) === session.departmentId;
      };

      const handleExcelImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const wb = XLSX.read(evt.target.result, { type: 'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
          const formatted = rows
            .filter(r => r && r.length >= 3 && r[0] && r[1] && r[2] !== undefined)
            .map(r => `${cleanSpaces(String(r[0]))} | ${cleanSpaces(String(r[1]))} | ${String(r[2]).trim()}`);
          setRawText(formatted.join('\n'));
          notify(`تم استيراد ${formatted.length} سجل من الملف`, 'success');
        };
        reader.readAsBinaryString(file);
      };

      const handleVerifyCoordinatorData = async () => {
        if (!selectedExamType) {
          notify('يرجى اختيار نوع الامتحان أولاً', 'error');
          return;
        }
        if (!isAuthorizedDept(deptName)) {
          notify(`غير مصرح لك! يمكنك النشر لقسمك (${session.departmentName}) فقط.`, 'error');
          return;
        }
        if (!rawText.trim()) {
          notify('يرجى إدخال النتائج أو رفع ملف Excel', 'error');
          return;
        }

        const maxScore = currentMaxScore;
        setProcessing(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const students = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
          const checked = lines.map((line, i) => {
            const parts = line.split(/[\|\t,،\-]+/).map(p => cleanSpaces(p)).filter(Boolean);
            if (parts.length < 3) {
              return { id: i, rawLine: line, subject: '', rawName: line, score: '', matchedStudent: null, status: 'invalid', errorReason: 'تنسيق السطر غير مكتمل' };
            }
            const subject = parts[0];
            const scoreStr = parts[parts.length - 1];
            const rawName = parts.slice(1, parts.length - 1).join(' ');
            const normName = normalizeArabic(rawName);

            const found = students.find(s => s.normalizedName === normName);
            const numericScore = Number(scoreStr);

            if (!found) {
              return {
                id: i,
                rawLine: line,
                subject,
                rawName,
                score: scoreStr,
                matchedStudent: null,
                status: 'unmatched',
                errorReason: 'الاسم غير مسجل في هذا القسم/المرحلة'
              };
            }

            if (scoreStr === '' || Number.isNaN(numericScore) || numericScore < 0) {
              return {
                id: i,
                rawLine: line,
                subject,
                rawName,
                score: scoreStr,
                matchedStudent: found,
                status: 'invalid_score',
                errorReason: 'الدرجة المدخلة غير رقمية أو غير صالحة'
              };
            }

            if (numericScore > maxScore) {
              return {
                id: i,
                rawLine: line,
                subject,
                rawName,
                score: scoreStr,
                matchedStudent: found,
                status: 'invalid_score',
                errorReason: `الدرجة (${numericScore}) تتجاوز الدرجة العظمى المحددة (${maxScore})`
              };
            }

            return {
              id: i,
              rawLine: line,
              subject,
              rawName,
              score: numericScore,
              matchedStudent: found,
              status: 'matched',
              errorReason: ''
            };
          });

          setReviewList(checked);
          setIsReviewing(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء فحص البيانات', 'error');
        } finally {
          setProcessing(false);
        }
      };

      // نشر النتائج بمعرّف ثابت وباستخدام writeBatch (500 عملية كحد أقصى للدفعة) لمنع التكرار
      const handlePublishResults = async () => {
        const validRows = reviewList.filter(r => r.status === 'matched' && r.matchedStudent);
        if (validRows.length === 0) {
          notify('لا توجد سجلات صحيحة ومطابقة للنشر', 'error');
          return;
        }

        const maxScore = currentMaxScore;
        setProcessing(true);
        try {
          const { db, doc, getDocs, collection, writeBatch, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const resultsColRef = collection(db, `${basePath}/results`);
          const examLabel = examOptions.find(o => o.id === selectedExamType)?.label || selectedExamType;

          // جلب المعرّفات الموجودة مسبقاً لحساب المضاف والمحدّث
          const existingSnap = await getDocs(resultsColRef);
          const existingIds = new Set(existingSnap.docs.map(d => d.id));

          // إزالة التكرار داخل نفس القائمة المرفوعة لنفس الطالب والمادة
          const uniqueMap = new Map();
          for (const row of validRows) {
            const stuId = row.matchedStudent.studentId || row.matchedStudent.id;
            const docId = buildResultDocId(stuId, row.subject, selectedExamType, '');
            uniqueMap.set(docId, { docId, stuId, row });
          }

          const entries = Array.from(uniqueMap.values());
          let addedCount = 0;
          let updatedCount = 0;

          const BATCH_LIMIT = 500;
          for (let i = 0; i < entries.length; i += BATCH_LIMIT) {
            const chunk = entries.slice(i, i + BATCH_LIMIT);
            const batch = writeBatch(db);

            for (const { docId, stuId, row } of chunk) {
              if (existingIds.has(docId)) {
                updatedCount++;
              } else {
                addedCount++;
              }

              const targetRef = doc(db, `${basePath}/results/${docId}`);
              batch.set(targetRef, {
                studentId: stuId,
                studentName: row.matchedStudent.fullName,
                subjectName: row.subject,
                examType: selectedExamType,
                examTitle: `${row.subject} (${examLabel})`,
                score: row.score,
                maxScore,
                publishedBy: 'مقرر القسم',
                branchId,
                stageId,
                studyTypeId,
                departmentName: session.departmentName,
                departmentId: session.departmentId,
                updatedAt: serverTimestamp()
              }, { merge: true });
            }

            await batch.commit();
          }

          notify(`تم نشر النتائج بنجاح في (${examLabel})! (أُضيفت: ${addedCount}، حُدّثت: ${updatedCount})`, 'success');
          setIsReviewing(false);
          setRawText('');
          setReviewList([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر النتائج', 'error');
        } finally {
          setProcessing(false);
        }
      };

      // إلغاء رفع الجدول
      const handleCancelScheduleUpload = () => {
        if (schedUploadTaskRef.current) {
          try {
            schedUploadTaskRef.current.cancel();
          } catch (_) {}
          schedUploadTaskRef.current = null;
        }
        setUploadingSched(false);
        setSchedProgress(0);
      };

      // رفع صورة الجدول الدراسي لمقرر القسم فقط
      const handleCoordinatorUploadSchedule = async (e) => {
        e.preventDefault();
        if (uploadingSched) return;

        if (!isAuthorizedDept(schedDeptName)) {
          notify(`غير مصرح لك! يمكنك رفع الجدول لقسمك (${session.departmentName}) فقط.`, 'error');
          return;
        }
        if (!schedFile) {
          notify('يرجى اختيار صورة الجدول الدراسي أولاً', 'error');
          return;
        }
        if (schedFile.size > MAX_UPLOAD_SIZE_BYTES) {
          notify('حجم الصورة يتجاوز الحد الأقصى المسموح به (50 ميجابايت)', 'error');
          return;
        }

        setUploadingSched(true);
        setSchedProgress(0);
        try {
          const { storage, ref, db, doc, setDoc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(schedBranchId, schedStageId, schedStudyTypeId, session.departmentName);
          const safeFileName = sanitizeStorageFileName(schedFile.name);
          const storageRef = ref(storage, `${basePath}/schedule_${Date.now()}_${safeFileName}`);

          const imageUrl = await uploadFileWithProgress({
            storageRef,
            file: schedFile,
            onProgress: (pct) => setSchedProgress(pct),
            onTaskCreated: (task) => { schedUploadTaskRef.current = task; }
          });

          await setDoc(doc(db, `${basePath}/schedule/current`), {
            imageUrl,
            departmentId: session.departmentId,
            updatedBy: `مقرر القسم (${session.departmentName})`,
            updatedAt: serverTimestamp()
          });

          notify('تم رفع ونشر صورة الجدول الدراسي بنجاح!', 'success');
          setSchedFile(null);
          if (schedFileInputRef.current) schedFileInputRef.current.value = '';
        } catch (err) {
          console.error('Schedule upload error:', err);
          notify(getStorageErrorMessage(err), 'error');
        } finally {
          schedUploadTaskRef.current = null;
          setUploadingSched(false);
          setSchedProgress(0);
        }
      };

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
          <div className="bg-gradient-to-l from-amber-800 to-amber-600 rounded-3xl p-5 sm:p-6 text-white shadow-lg">
            <span className="px-3 py-1 rounded-full bg-white/20 text-xs font-bold">لوحة مقرر القسم</span>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-2">{session.departmentName}</h2>
            <p className="text-xs sm:text-sm text-amber-100 mt-1">إدارة ونشر نتائج الفصول الدراسية والجدول الأسبوعي</p>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={() => setActiveSection('results')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeSection === 'results' ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              نتائج الامتحانات الفصلية
            </button>
            <button
              onClick={() => setActiveSection('schedule')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeSection === 'schedule' ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              رفع الجدول
            </button>
          </div>

          {activeSection === 'results' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-5">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <h3 className="text-lg font-extrabold text-slate-900">نتائج الامتحانات الفصلية</h3>
                {currentMaxScore !== null && (
                  <span className="px-3.5 py-1.5 rounded-xl bg-amber-100 border border-amber-300 text-amber-900 font-extrabold text-xs sm:text-sm">
                    الدرجة العظمى: {currentMaxScore}
                  </span>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                {examOptions.map(opt => (
                  <button
                    key={opt.id}
                    onClick={() => { setSelectedExamType(opt.id); setIsReviewing(false); }}
                    className={`p-4 rounded-2xl font-extrabold text-sm border-2 transition ${
                      selectedExamType === opt.id
                        ? 'bg-ntu-700 text-white border-ntu-700 shadow-md'
                        : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-ntu-400'
                    }`}
                  >
                    <span>{opt.label}</span>
                    <span className={`block text-xs mt-1 font-bold ${selectedExamType === opt.id ? 'text-ntu-100' : 'text-slate-500'}`}>
                      من {opt.maxScore}
                    </span>
                  </button>
                ))}
              </div>

              {selectedExamType && (
                <div className="pt-4 border-t border-slate-100 space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">الفرع</label>
                      <select value={branchId} onChange={(e) => setBranchId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                        {BRANCHES.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">المرحلة</label>
                      <select value={stageId} onChange={(e) => setStageId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                        {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">نوع الدراسة</label>
                      <select value={studyTypeId} onChange={(e) => setStudyTypeId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                        {STUDY_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">القسم</label>
                      <select
                        value={deptName}
                        onChange={(e) => setDeptName(e.target.value)}
                        className="w-full p-3 rounded-2xl border border-slate-300 bg-white text-sm font-semibold"
                      >
                        {departments.map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                  </div>

                  {!isReviewing ? (
                    <div className="space-y-4">
                      <div className="p-4 rounded-2xl bg-slate-50 border border-dashed border-slate-300">
                        <label className="block text-sm font-bold text-slate-700 mb-2">
                          رفع ملف Excel / CSV (الأعمدة: المادة | اسم الطالب الرباعي | الدرجة من {currentMaxScore})
                        </label>
                        <input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelImport} className="text-sm" />
                      </div>

                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">
                          أو نسخ ولصق النتائج (الصيغة: المادة | الاسم الرباعي | الدرجة من {currentMaxScore})
                        </label>
                        <textarea
                          rows={6}
                          value={rawText}
                          onChange={(e) => setRawText(e.target.value)}
                          placeholder={currentMaxScore === 40
                            ? "طفيليات | أحمد محمد علي حسن | 35\nكيمياء حياتية | سارة خالد جاسم محمود | 38"
                            : "طفيليات | أحمد محمد علي حسن | 88\nكيمياء حياتية | سارة خالد جاسم محمود | 92"}
                          className="w-full p-3.5 rounded-2xl border border-slate-300 outline-none font-mono text-sm"
                        />
                      </div>

                      <button
                        onClick={handleVerifyCoordinatorData}
                        disabled={processing}
                        className="w-full py-3.5 rounded-2xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold shadow-md"
                      >
                        {processing ? 'جاري التحقق...' : 'فحص ومراجعة النتائج قبل النشر'}
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-sm font-bold text-amber-900 flex flex-wrap items-center justify-between gap-2">
                        <span>
                          السجلات الصحيحة والمطابقة: {reviewList.filter(r => r.status === 'matched').length} من أصل {reviewList.length}
                        </span>
                        <span>الدرجة العظمى: {currentMaxScore}</span>
                      </div>

                      <div className="max-h-72 overflow-y-auto space-y-2 border border-slate-200 rounded-2xl p-3">
                        {reviewList.map(r => (
                          <div key={r.id} className={`p-3 rounded-xl flex items-center justify-between text-sm ${r.status === 'matched' ? 'bg-emerald-50 border border-emerald-200' : 'bg-rose-50 border border-rose-200'}`}>
                            <div>
                              {r.subject && <><span className="font-bold text-ntu-800">[{r.subject}]</span> — </>}
                              <span className="font-bold">{r.rawName}</span>
                              <span className="block text-xs mt-0.5 font-semibold">
                                {r.status === 'matched' ? `✓ مطابق لحساب الطالب` : `✕ ${r.errorReason}`}
                              </span>
                            </div>
                            <span className="font-extrabold px-3 py-1 rounded-lg bg-white border" dir="ltr">
                              {r.score !== '' ? `${r.score} / ${currentMaxScore}` : '—'}
                            </span>
                          </div>
                        ))}
                      </div>

                      <div className="flex gap-3">
                        <button onClick={() => setIsReviewing(false)} className="flex-1 py-3 rounded-2xl bg-slate-200 font-bold">رجوع للتعديل</button>
                        <button onClick={handlePublishResults} disabled={processing} className="flex-[2] py-3 px-6 rounded-2xl bg-emerald-600 text-white font-bold shadow">
                          {processing ? 'جاري النشر...' : 'نشر النتائج الآن'}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {activeSection === 'schedule' && (
            <form onSubmit={handleCoordinatorUploadSchedule} className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
              <h3 className="text-lg font-extrabold text-slate-900">رفع صورة الجدول الدراسي</h3>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">الفرع</label>
                  <select value={schedBranchId} onChange={(e) => setSchedBranchId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                    {BRANCHES.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">المرحلة</label>
                  <select value={schedStageId} onChange={(e) => setSchedStageId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                    {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">نوع الدراسة</label>
                  <select value={schedStudyTypeId} onChange={(e) => setSchedStudyTypeId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                    {STUDY_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">القسم</label>
                  <select
                    value={schedDeptName}
                    onChange={(e) => setSchedDeptName(e.target.value)}
                    className="w-full p-3 rounded-2xl border border-slate-300 bg-white text-sm font-semibold outline-none"
                  >
                    {departments.map(d => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold text-slate-700 mb-1">صورة الجدول (بحد أقصى 50 ميجابايت)</label>
                <input
                  ref={schedFileInputRef}
                  type="file"
                  accept="image/*"
                  disabled={uploadingSched}
                  onChange={(e) => setSchedFile(e.target.files?.[0] || null)}
                  className="w-full p-3 rounded-2xl border border-dashed border-ntu-400 bg-ntu-50/40 text-sm"
                />
              </div>

              {uploadingSched && (
                <div className="p-4 rounded-2xl bg-ntu-50 border border-ntu-200 space-y-2.5">
                  <div className="flex items-center justify-between text-xs sm:text-sm font-extrabold text-ntu-800">
                    <span>جاري رفع صورة الجدول...</span>
                    <span>{schedProgress}%</span>
                  </div>
                  <div className="w-full h-3 bg-ntu-100 rounded-full overflow-hidden">
                    <div
                      className="h-full bg-ntu-700 transition-all duration-200"
                      style={{ width: `${schedProgress}%` }}
                    ></div>
                  </div>
                  <button
                    type="button"
                    onClick={handleCancelScheduleUpload}
                    className="w-full py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs transition"
                  >
                    إلغاء الرفع
                  </button>
                </div>
              )}

              <button
                type="submit"
                disabled={uploadingSched}
                className="w-full py-3.5 rounded-2xl bg-ntu-700 hover:bg-ntu-800 disabled:opacity-60 text-white font-bold shadow-md transition"
              >
                {uploadingSched ? `جاري الرفع (${schedProgress}%)...` : 'نشر الجدول الدراسي'}
              </button>
            </form>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. التطبيق الرئيسي (Main App Container)
    // ==========================================
    function App() {
      const [fbReady, setFbReady] = useState(!!window.fb);
      const [authChecked, setAuthChecked] = useState(false);
      const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS);
      const [logoUrl, setLogoUrl] = useState(NTU_DEFAULT_LOGO);
      const [userSession, setUserSession] = useState(null);

      const [profileOpen, setProfileOpen] = useState(false);
      const [toast, setToast] = useState({ message: '', type: 'success' });

      const notify = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast({ message: '', type: 'success' }), 4500);
      };

      useEffect(() => {
        if (window.fb) {
          setFbReady(true);
        } else {
          const handler = () => setFbReady(true);
          window.addEventListener('firebase-ready', handler);
          return () => window.removeEventListener('firebase-ready', handler);
        }
      }, []);

      // جلب قائمة الأقسام الرسمية من config/departments وإنشاؤها تلقائياً إن لم توجد
      const loadOfficialDepartments = async () => {
        const { db, doc, getDoc, setDoc } = window.fb;
        try {
          const deptRef = doc(db, 'config', 'departments');
          const snap = await getDoc(deptRef);
          if (snap.exists() && Array.isArray(snap.data().list) && snap.data().list.length > 0) {
            setDepartments(snap.data().list);
          } else {
            await setDoc(deptRef, { list: DEFAULT_DEPARTMENTS });
            setDepartments(DEFAULT_DEPARTMENTS);
          }
        } catch (err) {
          console.warn('Using default departments list:', err);
          setDepartments(DEFAULT_DEPARTMENTS);
        }
      };

      // الاعتماد الكامل على onAuthStateChanged وقراءة users/{uid} لمنع انتحال الأدوار
      useEffect(() => {
        if (!fbReady) return;
        const { auth, onAuthStateChanged, db, doc, getDoc, onSnapshot } = window.fb;

        loadOfficialDepartments();

        const unsubAuth = onAuthStateChanged(auth, async (user) => {
          if (!user) {
            setUserSession(null);
            setAuthChecked(true);
            return;
          }

          try {
            const userSnap = await getDoc(doc(db, 'users', user.uid));
            if (userSnap.exists()) {
              setUserSession({ uid: user.uid, ...userSnap.data() });
            } else {
              setUserSession(null);
            }

            // تحديث قائمة الأقسام واللوغو بعد المصادقة
            loadOfficialDepartments();
            onSnapshot(doc(db, 'config', 'branding'), (bSnap) => {
              if (bSnap.exists() && bSnap.data().logoUrl) {
                setLogoUrl(bSnap.data().logoUrl);
              } else {
                setLogoUrl(NTU_DEFAULT_LOGO);
              }
            }, () => {});
          } catch (err) {
            console.error('Error loading user profile:', err);
            setUserSession(null);
          } finally {
            setAuthChecked(true);
          }
        });

        return () => unsubAuth();
      }, [fbReady]);

      const handleSessionLoaded = (profileObj) => {
        setUserSession(profileObj);
      };

      const handleLogout = async () => {
        try {
          const { auth, signOut } = window.fb;
          await signOut(auth);
        } catch (_) {}
        setUserSession(null);
        setProfileOpen(false);
        notify('تم تسجيل الخروج بنجاح', 'success');
      };

      if (!fbReady || !authChecked) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4">
            <div className="w-12 h-12 border-4 border-ntu-200 border-t-ntu-700 rounded-full animate-spin"></div>
            <p className="font-bold text-slate-700">جاري الاتصال السحابي بمنصة جامعة التقنية الشمالية...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <Header
            logoUrl={logoUrl}
            userSession={userSession}
            onLogout={handleLogout}
            onOpenProfile={() => setProfileOpen(true)}
          />

          <main className="flex-1">
            {!userSession && (
              <LandingAndAuth
                departments={departments}
                onSessionLoaded={handleSessionLoaded}
                notify={notify}
              />
            )}

            {userSession?.role === 'student' && (
              <StudentDashboard session={userSession} notify={notify} />
            )}

            {userSession?.role === 'doctor' && (
              <DoctorDashboard session={userSession} departments={departments} notify={notify} />
            )}

            {userSession?.role === 'coordinator' && (
              <CoordinatorDashboard session={userSession} departments={departments} notify={notify} />
            )}
          </main>

          <ProfileModal
            isOpen={profileOpen}
            onClose={() => setProfileOpen(false)}
            session={userSession}
          />

          <Toast
            message={toast.message}
            type={toast.type}
            onClose={() => setToast({ message: '', type: 'success' })}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
