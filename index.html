                    <p className="text-center py-8 text-slate-500 font-bold">جاري تحميل قائمة الدكاترة...</p>
                  ) : deptDoctors.length === 0 ? (
                    <p className="text-center py-8 text-slate-500 font-bold">لا يوجد دكاترة مسجلون ضمن هذا القسم حالياً.</p>
                  ) : (
                    deptDoctors.map(d => (
                      <div key={d.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-3">
                        <div>
                          <p className="font-extrabold text-slate-900 text-sm">{d.doctorName}</p>
                          <p className="text-xs font-bold text-ntu-800 mt-1">{d.subjectAndDept}</p>
                        </div>
                        <button
                          type="button"
                          onClick={() => handleDeleteDoctorMember(d)}
                          className="px-3.5 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs shrink-0"
                        >
                          حذف
                        </button>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          )}

          {/* القسم الرابع: ما تم نشره */}
          {activeSection === 'published' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-5">
              <div className="flex items-center justify-between flex-wrap gap-3">
                <h3 className="text-lg font-extrabold text-slate-900">ما تم نشره للقسم</h3>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setPublishedTab('results')}
                    className={`px-4 py-2 rounded-xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      publishedTab === 'results' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
                    }`}
                  >
                    نتائج
                  </button>
                  <button
                    type="button"
                    onClick={() => setPublishedTab('schedules')}
                    className={`px-4 py-2 rounded-xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      publishedTab === 'schedules' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
                    }`}
                  >
                    جداول
                  </button>
                </div>
              </div>

              {publishedTab === 'results' && (
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">المرحلة</label>
                      <select
                        value={pubStage}
                        onChange={(e) => setPubStage(e.target.value)}
                        className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm"
                      >
                        {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">نوع الدراسة</label>
                      <select
                        value={pubStudyType}
                        onChange={(e) => setPubStudyType(e.target.value)}
                        className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm"
                      >
                        {STUDY_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    </div>
                  </div>

                  {loadingPubResults ? (
                    <p className="text-center py-8 text-slate-500 font-bold">جاري تحميل النتائج...</p>
                  ) : pubResultGroups.length === 0 ? (
                    <p className="text-center py-8 text-slate-500 font-bold">لا توجد نتائج فصلية منشورة لهذه المرحلة ونوع الدراسة.</p>
                  ) : (
                    <div className="space-y-3">
                      {pubResultGroups.map(grp => (
                        <div key={grp.key} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                              <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900">
                                {grp.examLabel}
                              </span>
                              <p className="font-extrabold text-slate-900 mt-1.5">
                                {grp.subjectName} <span className="text-xs text-slate-500">({grp.items.length} طالب)</span>
                              </p>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button
                                type="button"
                                onClick={() => setExpandedPubGroupKey(expandedPubGroupKey === grp.key ? null : grp.key)}
                                className="px-3.5 py-2 rounded-xl bg-ntu-100 hover:bg-ntu-200 text-ntu-900 font-bold text-xs"
                              >
                                {expandedPubGroupKey === grp.key ? 'إخفاء الطلاب' : 'عرض الطلاب'}
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeletePublishedGroup(grp)}
                                className="px-3.5 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs"
                              >
                                حذف المادة بالكامل
                              </button>
                            </div>
                          </div>

                          {expandedPubGroupKey === grp.key && (
                            <div className="pt-3 border-t border-slate-200 space-y-2 max-h-72 overflow-y-auto">
                              {grp.items.map(item => (
                                <div key={item.id} className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-2 text-sm">
                                  <span className="font-bold text-slate-800">{item.studentName}</span>
                                  <div className="flex items-center gap-2">
                                    <span className="font-extrabold px-2.5 py-1 rounded-lg bg-ntu-50 text-ntu-900" dir="ltr">
                                      {item.maxScore ? `${item.score} / ${item.maxScore}` : item.score}
                                    </span>
                                    <button
                                      type="button"
                                      onClick={() => handleDeleteSinglePublishedResult(grp.key, item)}
                                      className="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs"
                                    >
                                      حذف
                                    </button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {publishedTab === 'schedules' && (
                <div className="space-y-3">
                  {loadingPubSchedules ? (
                    <p className="text-center py-8 text-slate-500 font-bold">جاري تحميل الجداول...</p>
                  ) : pubSchedules.length === 0 ? (
                    <p className="text-center py-8 text-slate-500 font-bold">لا توجد جداول منشورة لهذا القسم حالياً.</p>
                  ) : (
                    pubSchedules.map(sc => {
                      const kindLabel = sc.kind === 'exam' ? 'جدول امتحاني' : 'جدول أسبوعي';
                      const semLabel = sc.semester === 'sem2' ? 'الفصل الثاني' : 'الفصل الأول';
                      const stLabel = STAGES.find(s => s.id === sc.stageId)?.name || sc.stageId;
                      const tyLabel = STUDY_TYPES.find(t => t.id === sc.studyTypeId)?.name || sc.studyTypeId;
                      return (
                        <div key={sc.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <div>
                            <p className="font-extrabold text-slate-900 text-sm">
                              {kindLabel} — {semLabel}
                            </p>
                            <p className="text-xs text-slate-600 mt-1">
                              المرحلة {stLabel} | {tyLabel} | التحديث: {formatFirestoreDate(sc.updatedAt)}
                            </p>
                          </div>
                          <div className="flex items-center gap-2 shrink-0">
                            <button
                              type="button"
                              onClick={() => handleViewPublishedSchedule(sc)}
                              className="px-3.5 py-2 rounded-xl bg-ntu-100 hover:bg-ntu-200 text-ntu-900 font-bold text-xs"
                            >
                              عرض
                            </button>
                            <button
                              type="button"
                              onClick={() => handleDeletePublishedSchedule(sc)}
                              className="px-3.5 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs"
                            >
                              حذف
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              )}

              {/* نافذة معاينة الجدول المنشور */}
              {viewingScheduleImg && (
                <div
                  onClick={() => setViewingScheduleImg(null)}
                  className="fixed inset-0 z-50 bg-black/90 p-4 flex items-center justify-center cursor-zoom-out"
                >
                  <img src={viewingScheduleImg} alt="معاينة الجدول" className="max-w-full max-h-full object-contain rounded-xl" />
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 8. التطبيق الرئيسي (Main App Container)
    // ==========================================
    function App() {
      const [cloudReady, setCloudReady] = useState(!!window.fbAuthed);
      const [authConfig, setAuthConfig] = useState(DEFAULT_AUTH_CONFIG);

      // جلسة الدخول (مع حذف جلسة مقرر القسم القديمة إذا كانت بدون branchId)
      const [userSession, setUserSession] = useState(() => {
        try {
          const saved = localStorage.getItem('ntu_platform_session');
          if (!saved) return null;
          const parsed = JSON.parse(saved);
          if (parsed && parsed.role === 'coordinator' && !parsed.branchId) {
            localStorage.removeItem('ntu_platform_session');
            return null;
          }
          return parsed;
        } catch {
          return null;
        }
      });

      const [profileOpen, setProfileOpen] = useState(false);
      const [toast, setToast] = useState({ message: '', type: 'success' });

      const notify = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast({ message: '', type: 'success' }), 4500);
      };

      // انتظار المصادقة السحابية في الخلفية وجلب config/auth دون حجب الواجهة
      useEffect(() => {
        let active = true;
        waitForFirebase().then(async () => {
          if (!active) return;
          setCloudReady(true);
          try {
            const { db, doc, getDoc, setDoc } = window.fb;
            const configRef = doc(db, 'config', 'auth');
            const snap = await getDoc(configRef);
            if (!active) return;
            if (snap.exists()) {
              setAuthConfig({ ...DEFAULT_AUTH_CONFIG, ...snap.data() });
            } else {
              await setDoc(configRef, DEFAULT_AUTH_CONFIG);
            }
          } catch (e) {
            console.warn('Using default config:', e);
          }
        });

        return () => { active = false; };
      }, []);

      const handleLoginSuccess = (sessionObj) => {
        setUserSession(sessionObj);
        try {
          localStorage.setItem('ntu_platform_session', JSON.stringify(sessionObj));
        } catch (_) {}
      };

      const handleLogout = () => {
        setUserSession(null);
        setProfileOpen(false);
        try {
          localStorage.removeItem('ntu_platform_session');
        } catch (_) {}
        notify('تم تسجيل الخروج بنجاح', 'success');
      };

      return (
        <div className="min-h-screen flex flex-col">
          <Header
            userSession={userSession}
            onLogout={handleLogout}
            onOpenProfile={() => setProfileOpen(true)}
          />

          <main className="flex-1">
            {!userSession && (
              <LandingAndAuth
                authConfig={authConfig}
                onLoginSuccess={handleLoginSuccess}
                notify={notify}
              />
            )}

            {userSession && !cloudReady && (
              <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6 animate-pulse">
                <div className="h-28 rounded-3xl bg-slate-200"></div>
                <div className="grid grid-cols-3 gap-3">
                  <div className="h-14 rounded-2xl bg-slate-200"></div>
                  <div className="h-14 rounded-2xl bg-slate-200"></div>
                  <div className="h-14 rounded-2xl bg-slate-200"></div>
                </div>
                <div className="h-64 rounded-3xl bg-slate-200"></div>
              </div>
            )}

            {userSession && cloudReady && userSession.role === 'student' && (
              <StudentDashboard session={userSession} notify={notify} onLogout={handleLogout} />
            )}

            {userSession && cloudReady && userSession.role === 'doctor' && (
              <DoctorDashboard session={userSession} notify={notify} />
            )}

            {userSession && cloudReady && userSession.role === 'coordinator' && (
              <CoordinatorDashboard session={userSession} notify={notify} />
            )}
          </main>

          <ProfileModal
            isOpen={profileOpen}
            onClose={() => setProfileOpen(false)}
            session={userSession}
          />

          <Toast
            message={toast.message}
            type={toast.type}
            onClose={() => setToast({ message: '', type: 'success' })}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
