    // تنظيف النصوص والمسافات الزائدة وتوحيد الألف والهمزات للمطابقة الذكية
    const normalizeArabic = (str) => {
      if (!str) return '';
      return str
        .trim()
        .replace(/\s+/g, ' ')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي');
    };

    const cleanSpaces = (str) => (str || '').trim().replace(/\s+/g, ' ');

    // إنشاء معرّف نظيف للقسم ليكون مساراً آمناً في Firestore
    const slugifyDept = (deptName) => {
      const normalized = normalizeArabic(deptName).toLowerCase();
      // تحويل النص العربي إلى معرّف آمن مع الحفاظ على التفرد
      let hash = 0;
      for (let i = 0; i < normalized.length; i++) {
        hash = ((hash << 5) - hash) + normalized.charCodeAt(i);
        hash |= 0;
      }
      return 'dept_' + Math.abs(hash).toString(36);
    };

    // بناء المسار المعزول بالكامل حسب المتطلبات:
    // branches/{branchId}/stages/{stage}/studyTypes/{studyType}/departments/{departmentId}
    const getIsolatedBasePath = (branchId, stageId, studyTypeId, deptName) => {
      const deptId = slugifyDept(deptName);
      return `branches/${branchId}/stages/${stageId}/studyTypes/${studyTypeId}/departments/${deptId}`;
    };

    // تشفير الرمز السري باستخدام SHA-256 مع Salt
    async function hashPassword(password, salt) {
      const encoder = new TextEncoder();
      const data = encoder.encode(`${salt}:${password}:NTU_SECURE_2026`);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function generateSalt() {
      const array = new Uint8Array(16);
      crypto.getRandomValues(array);
      return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
    }

    // ==========================================

    // ==========================================

    function Toast({ message, type, onClose }) {
      if (!message) return null;
      const styles = type === 'error' 
        ? 'bg-rose-600 text-white border-rose-700' 
        : type === 'warning'
        ? 'bg-amber-500 text-white border-amber-600'

      return (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md animate-bounce">
          <div className={`${styles} px-4 py-3.5 rounded-2xl shadow-xl border flex items-center justify-between gap-3`}>
            <span className="text-sm font-bold leading-relaxed">{message}</span>
            <button onClick={onClose} className="text-white/80 hover:text-white font-bold text-lg px-1">✕</button>

      );
    }

    // ==========================================
    // 4. الصفحة الرئيسية وبوابات الدخول (Landing & Auth)
    // ==========================================
    function LandingAndAuth({ authConfig, onLoginSuccess, notify }) {
      // الحالات: 'home' | 'student_login' | 'student_register' | 'doctor_login' | 'coordinator_login'
      const [view, setView] = useState('home');
      const [loading, setLoading] = useState(false);

      // --- حقول تسجيل الدخول للطالب ---
      const [loginName, setLoginName] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginBranch, setLoginBranch] = useState('kirkuk');

      // --- حقول إنشاء حساب طالب ---
      const [regName, setRegName] = useState('');
      const [regPass, setRegPass] = useState('');
      const [regPassConfirm, setRegPassConfirm] = useState('');
      const [regBranch, setRegBranch] = useState('kirkuk');
      const [regStudyType, setRegStudyType] = useState('morning');
      const [regStage, setRegStage] = useState('stage1');
      const [regDept, setRegDept] = useState('');

      // --- حقول دخول الدكتور (خطوات متسلسلة) ---
      const [docStep, setDocStep] = useState(1); // 1: حساب عام، 2: الفرع ورمزه، 3: الاسم والمادة
      const [docUser, setDocUser] = useState('');
      const [docPass, setDocPass] = useState('');
      const [docBranch, setDocBranch] = useState('kirkuk');
      const [docBranchCode, setDocBranchCode] = useState('');
      const [docFullName, setDocFullName] = useState('');
      const [docSubjectDept, setDocSubjectDept] = useState('');

      // --- حقول دخول مقرر القسم ---
      const [coordUser, setCoordUser] = useState('');
      const [coordPass, setCoordPass] = useState('');
      const [coordDept, setCoordDept] = useState('');

      // التحقق من الاسم الرباعي
      const validateQuadName = (rawName) => {
        const cleaned = cleanSpaces(rawName);
        const words = cleaned.split(' ').filter(Boolean);
        if (words.length < 4) {
          return { valid: false, cleaned };
        }
        return { valid: true, cleaned };
      };

      // معالجة إنشاء حساب طالب
      const handleStudentRegister = async (e) => {
        e.preventDefault();
        if (loading) return;

        const nameCheck = validateQuadName(regName);
        if (!nameCheck.valid) {
          notify('يرجى كتابة الاسم الرباعي (4 كلمات على الأقل)', 'error');
          return;
        }
        if (!regPass || regPass.length < 4) {
          notify('يرجى إدخال رمز سري لا يقل عن 4 رموز', 'error');
          return;
        }
        if (regPass !== regPassConfirm) {
          notify('الرمز السري وتأكيده غير متطابقين', 'error');
          return;
        }
        const cleanedDept = cleanSpaces(regDept);
        if (!cleanedDept || cleanedDept.length < 3) {
          notify('يرجى كتابة اسم القسم والكلية بشكل كامل', 'error');
          return;
        }

        setLoading(true);
        try {
          const { db, collection, query, where, getDocs, addDoc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(regBranch, regStage, regStudyType, cleanedDept);
          const studentsRef = collection(db, `${basePath}/students`);
          const normName = normalizeArabic(nameCheck.cleaned);

          // منع تكرار الحساب في نفس الفرع + النوع + المرحلة + القسم
          const q = query(studentsRef, where('normalizedName', '==', normName));
          const existingSnap = await getDocs(q);
          if (!existingSnap.empty) {
            notify('هذا الحساب مسجل مسبقاً في نفس القسم والمرحلة ونوع الدراسة!', 'error');
            setLoading(false);
            return;
          }

          const salt = generateSalt();
          const passwordHash = await hashPassword(regPass, salt);

          const studentData = {
            fullName: nameCheck.cleaned,
            normalizedName: normName,
            passwordHash,
            salt,
            branchId: regBranch,
            studyTypeId: regStudyType,
            stageId: regStage,
            departmentName: cleanedDept,
            departmentId: slugifyDept(cleanedDept),
            createdAt: serverTimestamp()
          };

          const docRef = await addDoc(studentsRef, studentData);

    // ==========================================
    // 5. واجهة الطالب (Student Dashboard)
    // ==========================================
    function StudentDashboard({ session, notify }) {
      const [activeTab, setActiveTab] = useState('lectures'); // 'lectures' | 'schedule' | 'results'
      const [lectures, setLectures] = useState([]);
      const [scheduleUrl, setScheduleUrl] = useState(null);
      const [results, setResults] = useState([]);
      const [loadingData, setLoadingData] = useState(true);
      const [zoomSchedule, setZoomSchedule] = useState(false);

      // حالات التنقل داخل النتائج
      const [selectedSubject, setSelectedSubject] = useState(null);
      const [examCategory, setExamCategory] = useState(null); // 'daily' | 'sem1' | 'sem2'
      const [subExamType, setSubExamType] = useState(null); // 'mid' | 'final'

      const basePath = useMemo(() => {
        return getIsolatedBasePath(session.branchId, session.stageId, session.studyTypeId, session.departmentName);
      }, [session]);

      // الاستماع اللحظي للبيانات المعزولة الخاصة بالطالب فقط
      useEffect(() => {
        const { db, collection, doc, query, where, onSnapshot } = window.fb;
        setLoadingData(true);

        // 1. محاضرات نفس الفرع والمرحلة ونوع الدراسة والقسم
        const unsubLectures = onSnapshot(collection(db, `${basePath}/lectures`), (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setLectures(list);
          setLoadingData(false);
        }, (err) => {
          console.error(err);
          setLoadingData(false);
        });

        // 2. صورة الجدول الخاصة بالقسم والمرحلة ونوع الدراسة
        const unsubSchedule = onSnapshot(doc(db, `${basePath}/schedule/current`), (docSnap) => {
          if (docSnap.exists()) {
            setScheduleUrl(docSnap.data().imageUrl);
          } else {
            setScheduleUrl(null);
          }
        });

        // 3. نتائج هذا الطالب حصراً (مفلترة بـ studentId)
        const qResults = query(
          collection(db, `${basePath}/results`),
          where('studentId', '==', session.studentId)
        );
        const unsubResults = onSnapshot(qResults, (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setResults(list);
        });

        return () => {
          unsubLectures();
          unsubSchedule();
          unsubResults();
        };
      }, [basePath, session.studentId]);

      // تجميع المحاضرات حسب (المادة + النوع عملي/نظري) ثم حسب الدكتور
      const groupedLectures = useMemo(() => {
        const groups = {};
        lectures.forEach(lec => {
          const subjectKey = `${lec.subjectName} – ${lec.lectureType === 'practical' ? 'عملي' : 'نظري'}`;
          if (!groups[subjectKey]) groups[subjectKey] = {};
          const docKey = lec.doctorName || 'دكتور المادة';
          if (!groups[subjectKey][docKey]) groups[subjectKey][docKey] = [];
          groups[subjectKey][docKey].push(lec);
        });
        return groups;
      }, [lectures]);

      // استخراج قائمة المواد المتوفرة في نتائج الطالب أو محاضراته
      const availableSubjects = useMemo(() => {
        const set = new Set();
        results.forEach(r => set.add(r.subjectName));
        lectures.forEach(l => set.add(l.subjectName));
        return Array.from(set);
      }, [results, lectures]);

      // تصفية الدرجات المعروضة بناءً على اختيار الطالب الدقيق
      const filteredStudentResults = useMemo(() => {
        if (!selectedSubject || !examCategory) return [];
        let targetExamType = '';
        if (examCategory === 'daily') {
          targetExamType = 'daily';
        } else if (examCategory === 'sem1') {
          if (!subExamType) return [];
          targetExamType = subExamType === 'mid' ? 'sem1_mid' : 'sem1_final';
        } else if (examCategory === 'sem2') {
          if (!subExamType) return [];
          targetExamType = subExamType === 'mid' ? 'sem2_mid' : 'sem2_final';
        }

        return results.filter(r => 
          normalizeArabic(r.subjectName) === normalizeArabic(selectedSubject) &&
          r.examType === targetExamType
        );
      }, [results, selectedSubject, examCategory, subExamType]);

                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'

            >
              <Icons.Book />
              <span>محاضرات</span>
            </button>

            <button
              onClick={() => setActiveTab('schedule')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${

                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md'

            >
              <Icons.Calendar />
              <span>جدول</span>
            </button>

            <button
              onClick={() => setActiveTab('results')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${
                activeTab === 'results' 
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              <Icons.Chart />
              <span>نتائج</span>
            </button>
          </div>

          {/* 1. قسم المحاضرات */}
          {activeTab === 'lectures' && (
            <div className="space-y-5">
              {loadingData ? (
                <div className="text-center py-12 text-slate-500 font-bold">جاري تحميل المحاضرات...</div>
              ) : Object.keys(groupedLectures).length === 0 ? (
                <div className="glass-card rounded-3xl p-10 text-center text-slate-500 font-bold">
                  لا توجد محاضرات مرفوعة لقسمك ومرحلتك حالياً.
                </div>
              ) : (
                Object.entries(groupedLectures).map(([subjectTitle, doctorsMap]) => (

                                  >
                                    فتح
                                  </a>
                                  <a
                                    href={lec.fileUrl}
                                    download={lec.fileName || lec.title}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-3 py-1.5 rounded-xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold text-xs transition"
                                  >
                                    تنزيل

                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

              )}
            </div>

              <h3 className="text-lg font-extrabold text-slate-900 mb-4">الجدول الدراسي الأسبوعي</h3>

                <div className="space-y-4">

                    onClick={() => setZoomSchedule(true)}
                    className="relative cursor-zoom-in rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 max-h-[500px] flex items-center justify-center"
                  >
                    <img src={scheduleUrl} alt="الجدول الدراسي" className="w-full h-auto object-contain" />
                  </div>
                  <button
                    onClick={() => setZoomSchedule(true)}
                    className="px-5 py-2.5 rounded-xl bg-ntu-700 text-white font-bold text-sm"
                  >
                    تكبير صورة الجدول 🔍

                <div className="py-12 text-slate-500 font-bold">

          {activeTab === 'results' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-6">
              <h3 className="text-lg font-extrabold text-slate-900">نتائج الامتحانات</h3>

              {availableSubjects.length === 0 ? (

                      {availableSubjects.map(subj => (

                          className={`px-4 py-2.5 rounded-2xl font-bold text-sm border-2 transition ${

                              ? 'bg-ntu-700 text-white border-ntu-700'

                        >
                          امتحانات الفصل الأول

                        <button

                  )}

              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================

    // ==========================================
    function DoctorDashboard({ session, notify }) {
      const [activeTab, setActiveTab] = useState('lectures'); // 'lectures' | 'daily_grades' | 'schedule'

      // --- حقول رفع محاضرة ---
      const [subjectName, setSubjectName] = useState('');
      const [lectureType, setLectureType] = useState('theoretical'); // 'theoretical' | 'practical'
      const [lectureTitle, setLectureTitle] = useState('');
      const [stageId, setStageId] = useState('stage1');
      const [studyTypeId, setStudyTypeId] = useState('morning');
      const [deptName, setDeptName] = useState('');
      const [lectureFile, setLectureFile] = useState(null);
      const [uploading, setUploading] = useState(false);

      // محاضرات الدكتور الحالية (للحذف أو التعديل)
      const [myLectures, setMyLectures] = useState([]);
      const [editingLecture, setEditingLecture] = useState(null);

      // --- حقول رفع درجات الامتحانات اليومية ---
      const [gradeSubject, setGradeSubject] = useState('');
      const [gradeExamTitle, setGradeExamTitle] = useState('');
      const [gradeStage, setGradeStage] = useState('stage1');
      const [gradeStudyType, setGradeStudyType] = useState('morning');
      const [gradeDept, setGradeDept] = useState('');
      const [rawPasteText, setRawPasteText] = useState('');
      const [parsedRows, setParsedRows] = useState([]); // { rawName, score, matchedStudent, status: 'matched'|'unmatched' }
      const [reviewMode, setReviewMode] = useState(false);
      const [publishingGrades, setPublishingGrades] = useState(false);

      // --- رفع صورة الجدول ---
      const [schedStage, setSchedStage] = useState('stage1');
      const [schedStudyType, setSchedStudyType] = useState('morning');
      const [schedDept, setSchedDept] = useState('');
      const [schedFile, setSchedFile] = useState(null);

      // جلب محاضرات هذا الدكتور فقط ضمن الفرع
      useEffect(() => {
        const { db, collection, query, where, onSnapshot } = window.fb;
        const q = query(
          collection(db, `branches/${session.branchId}/doctor_lectures_index`),
          where('doctorId', '==', session.doctorId)
        );
        const unsub = onSnapshot(q, (snap) => {
          setMyLectures(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        return () => unsub();
      }, [session]);

      // إضافة محاضرة جديدة
      const handleAddLecture = async (e) => {
        e.preventDefault();
        if (uploading) return;

        const cleanSubj = cleanSpaces(subjectName);
        const cleanTitle = cleanSpaces(lectureTitle);
        const cleanDept = cleanSpaces(deptName);

        if (!cleanSubj || !cleanTitle || !cleanDept || !lectureFile) {
          notify('يرجى ملء جميع الحقول واختيار ملف المحاضرة', 'error');
          return;
        }

        setUploading(true);
        try {
          const { storage, ref, uploadBytesResumable, getDownloadURL, db, collection, addDoc, setDoc, doc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(session.branchId, stageId, studyTypeId, cleanDept);
          const storagePath = `${basePath}/lectures/${Date.now()}_${lectureFile.name}`;
          const storageRef = ref(storage, storagePath);

          const uploadTask = await uploadBytesResumable(storageRef, lectureFile);
          const fileUrl = await getDownloadURL(uploadTask.ref);

          const lecPayload = {
            subjectName: cleanSubj,
            lectureType,
            title: cleanTitle,
            doctorId: session.doctorId,
            doctorName: session.doctorName,
            branchId: session.branchId,
            stageId,
            studyTypeId,
            departmentName: cleanDept,
            fileUrl,
            storagePath,
            fileName: lectureFile.name,
            createdAt: serverTimestamp()
          };

          const addedRef = await addDoc(collection(db, `${basePath}/lectures`), lecPayload);
          // حفظ مرجع في فهرس الدكتور ليتمكن من تعديلها أو حذفها
          await setDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${addedRef.id}`), {
            ...lecPayload,
            lectureDocPath: `${basePath}/lectures/${addedRef.id}`
          });

          notify('تم رفع ونشر المحاضرة بنجاح!', 'success');
          setLectureTitle('');
          setLectureFile(null);
        } catch (err) {
          console.error(err);
          notify('فشل رفع المحاضرة، يرجى المحاولة مجدداً', 'error');
        } finally {
          setUploading(false);
        }
      };

      // حذف محاضرة للدكتور
      const handleDeleteLecture = async (lec) => {
        try {
          const { db, doc, deleteDoc, storage, ref, deleteObject } = window.fb;
          if (lec.lectureDocPath) {
            await deleteDoc(doc(db, lec.lectureDocPath));
          }
          await deleteDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${lec.id}`));
          if (lec.storagePath) {
            try { await deleteObject(ref(storage, lec.storagePath)); } catch (_) {}
          }
          notify('تم حذف المحاضرة بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف المحاضرة', 'error');
        }
      };

      // تعديل عنوان المحاضرة
      const handleUpdateLectureTitle = async () => {
        if (!editingLecture || !cleanSpaces(editingLecture.title)) return;
        try {
          const { db, doc, updateDoc } = window.fb;
          const newTitle = cleanSpaces(editingLecture.title);
          if (editingLecture.lectureDocPath) {
            await updateDoc(doc(db, editingLecture.lectureDocPath), { title: newTitle });
          }
          await updateDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${editingLecture.id}`), { title: newTitle });
          notify('تم تحديث عنوان المحاضرة', 'success');
          setEditingLecture(null);
        } catch (err) {
          notify('فشل التحديث', 'error');
        }
      };

      // قراءة ملف Excel / CSV للدرجات
      const handleExcelUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const bstr = evt.target.result;
          const wb = XLSX.read(bstr, { type: 'binary' });
          const wsname = wb.SheetNames[0];
          const ws = wb.Sheets[wsname];
          const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
          const lines = data
            .filter(row => row && row.length >= 2 && row[0] && row[1] !== undefined)
            .map(row => `${cleanSpaces(String(row[0]))} - ${String(row[1]).trim()}`);
          setRawPasteText(lines.join('\n'));
          notify(`تم استخراج ${lines.length} صف من الملف بنجاح`, 'success');
        };
        reader.readAsBinaryString(file);
      };

      // تحليل ومطابقة أسماء الطلاب مع قاعدة البيانات قبل النشر
      const handleAnalyzeAndMatchGrades = async () => {
        const cleanSubj = cleanSpaces(gradeSubject);
        const cleanDept = cleanSpaces(gradeDept);
        if (!cleanSubj || !cleanDept || !rawPasteText.trim()) {
          notify('يرجى إدخال اسم المادة والقسم وقائمة الطلاب والدرجات', 'error');
          return;
        }

        setPublishingGrades(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, cleanDept);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const studentsList = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const lines = rawPasteText.split('\n').map(l => l.trim()).filter(Boolean);
          const analyzed = lines.map((line, idx) => {
            // استخراج الاسم والدرجة (يدعم الفاصلة أو الشرطة أو المسافات أو Tab)
            const match = line.match(/^(.+?)[\t\-:,،]+([0-9]+(?:\.[0-9]+)?)$/) || line.match(/^(.+?)\s+([0-9]+(?:\.[0-9]+)?)$/);
            if (!match) {
              return { id: idx, rawLine: line, rawName: line, score: '', matchedStudent: null, status: 'invalid' };
            }
            const rawName = cleanSpaces(match[1]);
            const score = match[2].trim();
            const normInput = normalizeArabic(rawName);

            const found = studentsList.find(s => s.normalizedName === normInput);
            return {
              id: idx,
              rawLine: line,
              rawName,
              score,
              matchedStudent: found || null,
              status: found ? 'matched' : 'unmatched'
            };
          });

          setParsedRows(analyzed);
          setReviewMode(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء مطابقة أسماء الطلاب', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      // نشر الدرجات المطابقة فقط
      const handlePublishMatchedGrades = async () => {
        const matchedItems = parsedRows.filter(r => r.status === 'matched' && r.matchedStudent);
        if (matchedItems.length === 0) {
          notify('لا توجد أسماء مطابقة لنشر درجاتها', 'error');
          return;
        }

        setPublishingGrades(true);
        try {
          const { db, collection, addDoc, serverTimestamp } = window.fb;
          const cleanSubj = cleanSpaces(gradeSubject);
          const cleanDept = cleanSpaces(gradeDept);
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, cleanDept);
          const resultsRef = collection(db, `${basePath}/results`);

          for (const item of matchedItems) {
            await addDoc(resultsRef, {
              studentId: item.matchedStudent.id,
              studentName: item.matchedStudent.fullName,
              subjectName: cleanSubj,
              examType: 'daily',
              examTitle: cleanSpaces(gradeExamTitle) || `امتحان يومي - ${cleanSubj}`,
              score: item.score,
              doctorName: session.doctorName,
              branchId: session.branchId,
              stageId: gradeStage,
              studyTypeId: gradeStudyType,
              departmentName: cleanDept,
              createdAt: serverTimestamp()
            });
          }

          notify(`تم نشر ${matchedItems.length} درجة بنجاح للطلاب المطابقين!`, 'success');
          setReviewMode(false);
          setRawPasteText('');
          setParsedRows([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر الدرجات', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      // رفع صورة الجدول للقسم والمرحلة
      const handleUploadSchedule = async (e) => {
        e.preventDefault();
        const cleanDept = cleanSpaces(schedDept);

          return;

        setUploading(true);
        try {
          const { storage, ref, uploadBytesResumable, getDownloadURL, db, doc, setDoc, serverTimestamp } = window.fb;

          const storageRef = ref(storage, `${basePath}/schedule_${Date.now()}_${schedFile.name}`);
          const task = await uploadBytesResumable(storageRef, schedFile);
          const imageUrl = await getDownloadURL(task.ref);

          await setDoc(doc(db, `${basePath}/schedule/current`), {
            imageUrl,
            updatedBy: session.doctorName,
            updatedAt: serverTimestamp()
          });
          notify('تم رفع صورة الجدول بنجاح!', 'success');
          setSchedFile(null);
        } catch (err) {
          notify('حدث خطأ أثناء رفع الجدول', 'error');
        } finally {
          setUploading(false);
        }

            <span className="px-3 py-1 rounded-full bg-ntu-600/40 text-ntu-100 text-xs font-bold">لوحة تحكم التدريسي</span>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-2">{session.doctorName}</h2>
            <p className="text-xs sm:text-sm text-slate-300 mt-1">

            </p>
          </div>

          {/* أزرار التبويب */}
          <div className="grid grid-cols-3 gap-3">
            <button
              onClick={() => setActiveTab('lectures')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeTab === 'lectures' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
              }`}
            >
              إنشاء محاضرات
            </button>
            <button
              onClick={() => setActiveTab('daily_grades')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeTab === 'daily_grades' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'

            >
              امتحانات يومية
            </button>
            <button
              onClick={() => setActiveTab('schedule')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeTab === 'schedule' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <label className="block text-sm font-bold text-slate-700 mb-1">اسم المادة</label>

                      type="text"
                      value={subjectName}
                      onChange={(e) => setSubjectName(e.target.value)}
                      placeholder="مثال: طفيليات"
                      className="w-full p-3 rounded-2xl border border-slate-300 outline-none focus:ring-2 focus:ring-ntu-600"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">نوع المحاضرة</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button

                      </button>
                      <button

                    </div>
                  </div>

                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">عنوان المحاضرة</label>
                  <input

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">المرحلة</label>
                    <select value={stageId} onChange={(e) => setStageId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">نوع الدراسة</label>
                    <select value={studyTypeId} onChange={(e) => setStudyTypeId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">
                      {STUDY_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">القسم</label>
                    <input
                      type="text"
                      value={deptName}
                      onChange={(e) => setDeptName(e.target.value)}
                      placeholder="اسم القسم الكامل"
                      className="w-full p-3 rounded-2xl border border-slate-300 outline-none focus:ring-2 focus:ring-ntu-600"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">ملف المحاضرة (PDF / Word / PowerPoint)</label>
                  <input
                    type="file"
                    accept=".pdf,.doc,.docx,.ppt,.pptx"
                    onChange={(e) => setLectureFile(e.target.files?.[0] || null)}
                    className="w-full p-3 rounded-2xl border border-dashed border-ntu-400 bg-ntu-50/40 text-sm"
                  />
                </div>

                <button
                  type="submit"
                  disabled={uploading}
                  className="w-full py-3.5 rounded-2xl bg-ntu-700 hover:bg-ntu-800 disabled:opacity-60 text-white font-bold shadow-md transition"
                >
                  {uploading ? 'جاري رفع المحاضرة...' : 'إضافة المحاضرة'}
                </button>
              </form>

              {/* قائمة محاضرات الدكتور (إدارة وحذف وتعديل) */}
              <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
                <h3 className="text-lg font-extrabold text-slate-900">محاضراتي المنشورة ({myLectures.length})</h3>
                {myLectures.length === 0 ? (
                  <p className="text-sm text-slate-500">لم تقم برفع أي محاضرات بعد.</p>
                ) : (
                  <div className="space-y-3">
                    {myLectures.map(lec => (
                      <div key={lec.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-ntu-100 text-ntu-800">
                            {lec.subjectName} – {lec.lectureType === 'practical' ? 'عملي' : 'نظري'}

                          </p>

                        <div className="flex items-center gap-2 shrink-0">

                            className="px-3.5 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs"
                          >
                            حذف
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

              </div>

              {/* نافذة تعديل عنوان المحاضرة */}
              {editingLecture && (
                <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl p-6 max-w-md w-full space-y-4">
                    <h4 className="font-extrabold text-lg">تعديل عنوان المحاضرة</h4>
                    <input
                      type="text"
                      value={editingLecture.title}
                      onChange={(e) => setEditingLecture({ ...editingLecture, title: e.target.value })}
                      className="w-full p-3 rounded-2xl border border-slate-300"
                    />
                    <div className="flex gap-2">
                      <button onClick={handleUpdateLectureTitle} className="flex-1 py-2.5 rounded-xl bg-ntu-700 text-white font-bold">حفظ</button>
                      <button onClick={() => setEditingLecture(null)} className="flex-1 py-2.5 rounded-xl bg-slate-200 text-slate-800 font-bold">إلغاء</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* تبويب 2: الامتحانات اليومية ومطابقة الأسماء */}
          {activeTab === 'daily_grades' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-5">
              <h3 className="text-lg font-extrabold text-slate-900">نشر درجات الامتحانات اليومية</h3>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">اسم المادة</label>
                  <input
                    type="text"
                    value={gradeSubject}
                    onChange={(e) => setGradeSubject(e.target.value)}
                    placeholder="مثال: طفيليات"
                    className="w-full p-3 rounded-2xl border border-slate-300 outline-none"
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">عنوان الامتحان (اختياري)</label>
                  <input
                    type="text"
                    value={gradeExamTitle}
                    onChange={(e) => setGradeExamTitle(e.target.value)}
                    placeholder="مثال: كويز 1"
                    className="w-full p-3 rounded-2xl border border-slate-300 outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">المرحلة</label>
                  <select value={gradeStage} onChange={(e) => setGradeStage(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">

                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">نوع الدراسة</label>
                  <select value={gradeStudyType} onChange={(e) => setGradeStudyType(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">

                <div>

                  <input

                    value={gradeDept}

                    className="w-full p-3 rounded-2xl border border-slate-300 outline-none"
                  />
                </div>
              </div>

              {!reviewMode ? (
                <div className="space-y-4">
                  <div className="p-4 rounded-2xl bg-slate-50 border border-dashed border-slate-300">
                    <label className="block text-sm font-bold text-slate-700 mb-2">
                      الخيار الأول: رفع ملف Excel أو CSV (العمود الأول: الاسم الرباعي، العمود الثاني: الدرجة)

                    <input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelUpload} className="text-sm" />

                    </button>
                    <button
                      onClick={handlePublishMatchedGrades}
                      disabled={publishingGrades}
                      className="flex-2 py-3 px-6 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow"
                    >
                      {publishingGrades ? 'جاري النشر...' : 'تأكيد ونشر الدرجات المطابقة'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* تبويب 3: رفع الجدول */}
          {activeTab === 'schedule' && (
            <form onSubmit={handleUploadSchedule} className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
              <h3 className="text-lg font-extrabold text-slate-900">رفع صورة الجدول الدراسي</h3>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">المرحلة</label>
                  <select value={schedStage} onChange={(e) => setSchedStage(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">
                    {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">نوع الدراسة</label>
                  <select value={schedStudyType} onChange={(e) => setSchedStudyType(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold">
                    {STUDY_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">القسم</label>
                  <input
                    type="text"
                    value={schedDept}
                    onChange={(e) => setSchedDept(e.target.value)}
                    placeholder="اسم القسم الكامل"
                    className="w-full p-3 rounded-2xl border border-slate-300 outline-none"
                  />
                </div>
              </div>
              <div>
                <label className="block text-sm font-bold text-slate-700 mb-1">صورة الجدول</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={(e) => setSchedFile(e.target.files?.[0] || null)}
                  className="w-full p-3 rounded-2xl border border-dashed border-ntu-400 bg-ntu-50/40 text-sm"
                />
              </div>
              <button type="submit" disabled={uploading} className="w-full py-3.5 rounded-2xl bg-ntu-700 text-white font-bold">
                {uploading ? 'جاري الرفع...' : 'نشر الجدول الدراسي'}
              </button>
            </form>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. واجهة مقرر القسم (Department Coordinator)
    // ==========================================
    function CoordinatorDashboard({ session, notify }) {
      const [selectedExamType, setSelectedExamType] = useState(null); // 'sem1_mid' | 'sem1_final' | 'sem2_mid' | 'sem2_final'
      const [branchId, setBranchId] = useState('kirkuk');
      const [stageId, setStageId] = useState('stage1');
      const [studyTypeId, setStudyTypeId] = useState('morning');
      const [deptName, setDeptName] = useState(session.departmentName || '');

      const [rawText, setRawText] = useState('');
      const [reviewList, setReviewList] = useState([]);
      const [isReviewing, setIsReviewing] = useState(false);
      const [processing, setProcessing] = useState(false);

      const examOptions = [
        { id: 'sem1_mid', label: 'الفصل الأول – ميدتيرم' },
        { id: 'sem1_final', label: 'الفصل الأول – فاينل' },
        { id: 'sem2_mid', label: 'الفصل الثاني – ميدتيرم' },
        { id: 'sem2_final', label: 'الفصل الثاني – فاينل' }
      ];

      // التحقق من أن مقرر القسم يعدّل قسمه فقط
      const isAuthorizedDept = () => {
        return slugifyDept(cleanSpaces(deptName)) === session.departmentId;
      };

      const handleExcelImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const wb = XLSX.read(evt.target.result, { type: 'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
          // التنسيق المتوقع: المادة | اسم الطالب | الدرجة
          const formatted = rows
            .filter(r => r && r.length >= 3 && r[0] && r[1] && r[2] !== undefined)
            .map(r => `${cleanSpaces(String(r[0]))} | ${cleanSpaces(String(r[1]))} | ${String(r[2]).trim()}`);
          setRawText(formatted.join('\n'));
          notify(`تم استيراد ${formatted.length} سجل من الملف`, 'success');
        };
        reader.readAsBinaryString(file);
      };

      const handleVerifyCoordinatorData = async () => {
        if (!selectedExamType) {
          notify('يرجى اختيار نوع الامتحان أولاً', 'error');
          return;
        }
        if (!isAuthorizedDept()) {
          notify(`غير مصرح لك! يمكنك النشر لقسمك (${session.departmentName}) فقط.`, 'error');
          return;
        }
        if (!rawText.trim()) {
          notify('يرجى إدخال النتائج أو رفع ملف Excel', 'error');
          return;
        }

        setProcessing(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const students = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
          const checked = lines.map((line, i) => {
            // الصيغة: المادة | اسم الطالب | الدرجة (أو مفصولة بـ - أو , أو Tab)
            const parts = line.split(/[\|\t,،\-]+/).map(p => cleanSpaces(p)).filter(Boolean);
            if (parts.length < 3) {
              return { id: i, rawLine: line, subject: '', rawName: line, score: '', matchedStudent: null, status: 'invalid' };
            }
            const subject = parts[0];
            const score = parts[parts.length - 1];
            const rawName = parts.slice(1, parts.length - 1).join(' ');
            const normName = normalizeArabic(rawName);

            const found = students.find(s => s.normalizedName === normName);
            return {
              id: i,
              rawLine: line,
              subject,
              rawName,
              score,
              matchedStudent: found || null,
              status: found ? 'matched' : 'unmatched'
            };
          });

          setReviewList(checked);
          setIsReviewing(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء فحص البيانات', 'error');
        } finally {
          setProcessing(false);
        }
      };

      const handlePublishResults = async () => {
        const validRows = reviewList.filter(r => r.status === 'matched' && r.matchedStudent);
        if (validRows.length === 0) {
          notify('لا توجد سجلات مطابقة للنشر', 'error');
          return;
        }

        setProcessing(true);
        try {
          const { db, collection, addDoc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const resultsRef = collection(db, `${basePath}/results`);
          const examLabel = examOptions.find(o => o.id === selectedExamType)?.label || selectedExamType;

          for (const row of validRows) {
            await addDoc(resultsRef, {
              studentId: row.matchedStudent.id,
              studentName: row.matchedStudent.fullName,
              subjectName: row.subject,
              examType: selectedExamType,
              examTitle: `${row.subject} (${examLabel})`,
              score: row.score,
              publishedBy: 'مقرر القسم',
              branchId,
              stageId,
              studyTypeId,
              departmentName: session.departmentName,
              createdAt: serverTimestamp()
            });
          }

          notify(`تم نشر ${validRows.length} نتيجة بنجاح في (${examLabel})!`, 'success');
          setIsReviewing(false);
          setRawText('');
          setReviewList([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر النتائج', 'error');
        } finally {
          setProcessing(false);
        }
      };

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
          <div className="bg-gradient-to-l from-amber-800 to-amber-600 rounded-3xl p-5 sm:p-6 text-white shadow-lg">
            <span className="px-3 py-1 rounded-full bg-white/20 text-xs font-bold">لوحة مقرر القسم</span>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-2">{session.departmentName}</h2>
            <p className="text-xs sm:text-sm text-amber-100 mt-1">إدارة ونشر نتائج الفصول الدراسية المستقلة</p>
          </div>

          {/* أزرار النتائج المستقلة */}
          <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-5">
            <h3 className="text-lg font-extrabold text-slate-900">نتائج الامتحانات الفصلية</h3>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              {examOptions.map(opt => (
                <button
                  key={opt.id}
                  onClick={() => { setSelectedExamType(opt.id); setIsReviewing(false); }}
                  className={`p-4 rounded-2xl font-extrabold text-sm border-2 transition ${
                    selectedExamType === opt.id
                      ? 'bg-ntu-700 text-white border-ntu-700 shadow-md'
                      : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-ntu-400'
                  }`}
                >
                  {opt.label}
                </button>
              ))}
            </div>

            {selectedExamType && (
              <div className="pt-4 border-t border-slate-100 space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">الفرع</label>
                    <select value={branchId} onChange={(e) => setBranchId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                      {BRANCHES.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">المرحلة</label>
                    <select value={stageId} onChange={(e) => setStageId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">نوع الدراسة</label>
                    <select value={studyTypeId} onChange={(e) => setStudyTypeId(e.target.value)} className="w-full p-3 rounded-2xl border border-slate-300 bg-white font-semibold text-sm">
                      {STUDY_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">القسم</label>
                    <input
                      type="text"
                      value={deptName}
                      onChange={(e) => setDeptName(e.target.value)}
                      className="w-full p-3 rounded-2xl border border-slate-300 text-sm font-semibold"
                    />
                  </div>
                </div>

                {!isReviewing ? (
                  <div className="space-y-4">
                    <div className="p-4 rounded-2xl bg-slate-50 border border-dashed border-slate-300">
                      <label className="block text-sm font-bold text-slate-700 mb-2">
                        رفع ملف Excel / CSV (الأعمدة: المادة | اسم الطالب الرباعي | الدرجة)
                      </label>
                      <input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelImport} className="text-sm" />
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1">
                        أو نسخ ولصق النتائج (الصيغة: المادة | الاسم الرباعي | الدرجة)
                      </label>
                      <textarea
                        rows={6}
                        value={rawText}
                        onChange={(e) => setRawText(e.target.value)}
                        placeholder={"طفيليات | أحمد محمد علي حسن | 45\nكيمياء حياتية | سارة خالد جاسم محمود | 48"}
                        className="w-full p-3.5 rounded-2xl border border-slate-300 outline-none font-mono text-sm"
                      />
                    </div>

                    <button
                      onClick={handleVerifyCoordinatorData}
                      disabled={processing}
                      className="w-full py-3.5 rounded-2xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold shadow-md"
                    >
                      {processing ? 'جاري التحقق...' : 'فحص ومراجعة النتائج قبل النشر'}
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-sm font-bold text-amber-900">
                      السجلات المطابقة: {reviewList.filter(r => r.status === 'matched').length} من أصل {reviewList.length}
                    </div>

                    <div className="max-h-72 overflow-y-auto space-y-2 border border-slate-200 rounded-2xl p-3">
                      {reviewList.map(r => (
                        <div key={r.id} className={`p-3 rounded-xl flex items-center justify-between text-sm ${r.status === 'matched' ? 'bg-emerald-50 border border-emerald-200' : 'bg-rose-50 border border-rose-200'}`}>
                          <div>
                            <span className="font-bold text-ntu-800">[{r.subject}]</span> — <span className="font-bold">{r.rawName}</span>
                            <span className="block text-xs mt-0.5">
                              {r.status === 'matched' ? '✓ مطابق لحساب الطالب' : '✕ الاسم غير مسجل في هذا القسم/المرحلة'}
                            </span>
                          </div>
                          <span className="font-extrabold px-3 py-1 rounded-lg bg-white border">{r.score}</span>
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-3">
                      <button onClick={() => setIsReviewing(false)} className="flex-1 py-3 rounded-2xl bg-slate-200 font-bold">رجوع للتعديل</button>
                      <button onClick={handlePublishResults} disabled={processing} className="flex-2 py-3 px-6 rounded-2xl bg-emerald-600 text-white font-bold shadow">
                        {processing ? 'جاري النشر...' : 'نشر النتائج الآن'}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. التطبيق الرئيسي (Main App Container)
    // ==========================================
    function App() {
      const [fbReady, setFbReady] = useState(!!window.fb);
      const [authReady, setAuthReady] = useState(false);
      const [authConfig, setAuthConfig] = useState(DEFAULT_AUTH_CONFIG);
      const [logoUrl, setLogoUrl] = useState('');
      const [uploadingLogo, setUploadingLogo] = useState(false);

      // جلسة الدخول (مسموح بحفظها في localStorage حسب المتطلبات)
      const [userSession, setUserSession] = useState(() => {
        try {
          const saved = localStorage.getItem('ntu_platform_session');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });

      const [profileOpen, setProfileOpen] = useState(false);
      const [toast, setToast] = useState({ message: '', type: 'success' });

      const notify = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast({ message: '', type: 'success' }), 4500);
      };

      // انتظار تحميل Firebase SDK
      useEffect(() => {
        if (window.fb) {
          setFbReady(true);
        } else {
          const handler = () => setFbReady(true);
          window.addEventListener('firebase-ready', handler);
          return () => window.removeEventListener('firebase-ready', handler);
        }
      }, []);

      // تسجيل الدخول المجهول في Firebase Auth وجلب إعدادات النظام واللوغو
      useEffect(() => {
        if (!fbReady) return;
        const { auth, signInAnonymously, onAuthStateChanged, db, doc, getDoc, setDoc, onSnapshot } = window.fb;

        const initAuthAndConfig = async () => {
          try {
            await signInAnonymously(auth);
          } catch (err) {
            console.error('Auth error:', err);
          }
        };

        initAuthAndConfig();

        const unsubAuth = onAuthStateChanged(auth, async (user) => {
          if (user) {
            setAuthReady(true);
            // جلب أو تهيئة config/auth في Firestore
            const configRef = doc(db, 'config', 'auth');
            try {
              const snap = await getDoc(configRef);
              if (snap.exists()) {
                setAuthConfig({ ...DEFAULT_AUTH_CONFIG, ...snap.data() });
              } else {
                await setDoc(configRef, DEFAULT_AUTH_CONFIG);
              }
            } catch (e) {
              console.warn('Using default config:', e);
            }

            // الاستماع اللحظي للوغو الجامعة
            onSnapshot(doc(db, 'config', 'branding'), (bSnap) => {
              if (bSnap.exists() && bSnap.data().logoUrl) {
                setLogoUrl(bSnap.data().logoUrl);
              }
            });
          }
        });

        return () => unsubAuth();
      }, [fbReady]);

      // رفع لوغو الجامعة إلى Firebase Storage وحفظ رابطه في Firestore
      const handleLogoUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !fbReady) return;
        setUploadingLogo(true);
        try {
          const { storage, ref, uploadBytesResumable, getDownloadURL, db, doc, setDoc } = window.fb;
          const logoRef = ref(storage, `branding/ntu_logo_${Date.now()}`);
          const task = await uploadBytesResumable(logoRef, file);
          const url = await getDownloadURL(task.ref);
          await setDoc(doc(db, 'config', 'branding'), { logoUrl: url }, { merge: true });
          notify('تم تحديث لوغو الجامعة بنجاح!', 'success');
        } catch (err) {
          console.error(err);
          notify('تعذر رفع اللوغو، تأكد من صلاحيات التخزين', 'error');
        } finally {
          setUploadingLogo(false);
        }
      };

      const handleLoginSuccess = (sessionObj) => {
        setUserSession(sessionObj);
        try {
          localStorage.setItem('ntu_platform_session', JSON.stringify(sessionObj));
        } catch (_) {}
      };

      const handleLogout = () => {
        setUserSession(null);
        setProfileOpen(false);
        try {
          localStorage.removeItem('ntu_platform_session');
        } catch (_) {}
        notify('تم تسجيل الخروج بنجاح', 'success');
      };

      if (!fbReady || !authReady) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4">
            <div className="w-12 h-12 border-4 border-ntu-200 border-t-ntu-700 rounded-full animate-spin"></div>
            <p className="font-bold text-slate-700">جاري الاتصال السحابي بمنصة جامعة التقنية الشمالية...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <Header
            logoUrl={logoUrl}
            onLogoUpload={handleLogoUpload}
            uploadingLogo={uploadingLogo}
            userSession={userSession}
            onLogout={handleLogout}
            onOpenProfile={() => setProfileOpen(true)}
          />

          <main className="flex-1">
            {!userSession && (
              <LandingAndAuth
                authConfig={authConfig}
                onLoginSuccess={handleLoginSuccess}
                notify={notify}
              />
            )}

            {userSession?.role === 'student' && (
              <StudentDashboard session={userSession} notify={notify} />
            )}

            {userSession?.role === 'doctor' && (
              <DoctorDashboard session={userSession} notify={notify} />
            )}

            {userSession?.role === 'coordinator' && (
              <CoordinatorDashboard session={userSession} notify={notify} />
            )}
          </main>

          <ProfileModal
            isOpen={profileOpen}
            onClose={() => setProfileOpen(false)}
            session={userSession}
          />

          <Toast
            message={toast.message}
            type={toast.type}
            onClose={() => setToast({ message: '', type: 'success' })}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
