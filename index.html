                  className="text-sm font-bold text-slate-500 hover:text-slate-800"
                >
                  عودة ←
                </button>
              </div>

              {coordStep === 1 && (
                <form onSubmit={handleCoordinatorStep1} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">الاسم</label>
                    <input
                      type="text"
                      autoCapitalize="off"
                      autoCorrect="off"
                      spellCheck={false}
                      value={coordUser}
                      onChange={(e) => setCoordUser(e.target.value)}
                      placeholder="أدخل اسم الدخول"
                      className="w-full p-3.5 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-ntu-600 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">الرمز</label>
                    <input
                      type="password"
                      autoCapitalize="off"
                      autoCorrect="off"
                      spellCheck={false}
                      value={coordPass}
                      onChange={(e) => setCoordPass(e.target.value)}
                      placeholder="••••••••"
                      className="w-full p-3.5 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-ntu-600 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">القسم</label>
                    <select
                      value={coordDeptChoice}
                      onChange={(e) => setCoordDeptChoice(e.target.value)}
                      className="w-full p-3.5 rounded-2xl border border-slate-300 bg-white focus:ring-2 focus:ring-ntu-600 outline-none font-semibold"
                    >
                      {departments.map(d => (
                        <option key={d.id} value={d.id}>{d.name}</option>
                      ))}
                      <option value="__new__">+ إضافة قسم جديد</option>
                    </select>
                  </div>

                  {coordDeptChoice === '__new__' && (
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1">اسم القسم الجديد</label>
                      <input
                        type="text"
                        value={coordNewDeptName}
                        onChange={(e) => setCoordNewDeptName(e.target.value)}
                        placeholder="مثال: قسم المختبرات الطبية – الكلية الصحية والطبية"
                        className="w-full p-3.5 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-ntu-600 outline-none"
                      />
                    </div>
                  )}

                  <button type="submit" className="w-full py-3.5 rounded-2xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold transition">
                    التالي
                  </button>
                </form>
              )}

              {coordStep === 2 && (
                <form onSubmit={handleCoordinatorStep2} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">اختر الفرع</label>
                    <div className="grid grid-cols-3 gap-2">
                      {BRANCHES.map(b => (
                        <button
                          type="button"
                          key={b.id}
                          onClick={() => setCoordBranch(b.id)}
                          className={`py-3 px-2 rounded-2xl font-bold text-sm border-2 transition ${
                            coordBranch === b.id 
                              ? 'bg-ntu-700 text-white border-ntu-700 shadow' 
                              : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
                          }`}
                        >
                          {b.name}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">رمز الفرع</label>
                    <input
                      type="password"
                      autoCapitalize="off"
                      autoCorrect="off"
                      spellCheck={false}
                      value={coordBranchCode}
                      onChange={(e) => setCoordBranchCode(e.target.value)}
                      placeholder="أدخل الرمز الخاص بالفرع"
                      className="w-full p-3.5 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-ntu-600 outline-none"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full py-3.5 rounded-2xl bg-ntu-700 hover:bg-ntu-800 disabled:opacity-60 text-white font-bold transition"
                  >
                    {loading ? 'جاري التحقق...' : 'دخول مقرر القسم'}
                  </button>
                </form>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. واجهة الطالب (Student Dashboard)
    // ==========================================
    function StudentDashboard({ session, notify, onLogout }) {
      const [activeTab, setActiveTab] = useState('lectures'); // 'lectures' | 'schedule' | 'results'
      const [lectures, setLectures] = useState([]);
      const [scheduleUrl, setScheduleUrl] = useState(null);
      const [schedKind, setSchedKind] = useState('weekly'); // 'weekly' | 'exam'
      const [schedSemester, setSchedSemester] = useState('sem1'); // 'sem1' | 'sem2'
      const [results, setResults] = useState([]);
      const [loadingData, setLoadingData] = useState(true);
      const [zoomSchedule, setZoomSchedule] = useState(false);

      // حالة تتبع أزرار الفتح والتنزيل للمحاضرات المجزأة
      const [loadingFileKey, setLoadingFileKey] = useState(null);

      // حالات التنقل داخل النتائج
      const [selectedSubject, setSelectedSubject] = useState(null);
      const [examCategory, setExamCategory] = useState(null); // 'daily' | 'sem1' | 'sem2'
      const [subExamType, setSubExamType] = useState(null); // 'mid' | 'final'

      const basePath = useMemo(() => {
        return getIsolatedBasePath(session.branchId, session.stageId, session.studyTypeId, session.departmentName);
      }, [session]);

      // التحقق من استمرار وجود حساب الطالب (خروج فوري عند حذفه من قبل المقرر)
      useEffect(() => {
        const { db, doc, onSnapshot } = window.fb;
        const studentRef = doc(db, `${basePath}/students/${session.studentId}`);
        const unsubStudent = onSnapshot(studentRef, (snap) => {
          if (!snap.exists()) {
            notify('تم حذف حسابك، يرجى التواصل مع مقرر القسم', 'error');
            if (onLogout) onLogout();
          }
        }, (err) => {
          console.error(err);
        });
        return () => unsubStudent();
      }, [basePath, session.studentId]);

      // الاستماع اللحظي للمحاضرات والنتائج المعزولة الخاصة بالطالب
      useEffect(() => {
        const { db, collection, query, where, onSnapshot } = window.fb;
        setLoadingData(true);

        const unsubLectures = onSnapshot(collection(db, `${basePath}/lectures`), (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setLectures(list);
          setLoadingData(false);
        }, (err) => {
          console.error(err);
          setLoadingData(false);
        });

        const qResults = query(
          collection(db, `${basePath}/results`),
          where('studentId', '==', session.studentId)
        );
        const unsubResults = onSnapshot(qResults, (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setResults(list);
        });

        return () => {
          unsubLectures();
          unsubResults();
        };
      }, [basePath, session.studentId]);

      // الاستماع لصورة الجدول المختار (أسبوعي/امتحاني + فصل أول/ثاني) فقط عندما يكون تبويب schedule مفتوحاً
      useEffect(() => {
        if (activeTab !== 'schedule') return;
        const { db, doc, getDoc, onSnapshot } = window.fb;
        const docKey = `${schedKind}_${schedSemester}`;
        let cancelled = false;

        const unsubSchedule = onSnapshot(doc(db, `${basePath}/schedule/${docKey}`), async (docSnap) => {
          if (cancelled) return;
          if (docSnap.exists()) {
            setScheduleUrl(docSnap.data().imageUrl);
          } else if (docKey === 'weekly_sem1') {
            try {
              const legacySnap = await getDoc(doc(db, `${basePath}/schedule/current`));
              if (!cancelled) {
                setScheduleUrl(legacySnap.exists() ? legacySnap.data().imageUrl : null);
              }
            } catch (_) {
              if (!cancelled) setScheduleUrl(null);
            }
          } else {
            setScheduleUrl(null);
          }
        }, (err) => {
          console.error(err);
        });

        return () => {
          cancelled = true;
          unsubSchedule();
        };
      }, [activeTab, basePath, schedKind, schedSemester]);

      // تنزيل المحاضرة من أجزاء Firestore
      const triggerBlobDownload = (blob, fileName) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName || 'lecture_file';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const handleDownloadChunkedLecture = async (lec) => {
        const key = `${lec.id}_download`;
        if (loadingFileKey) return;
        setLoadingFileKey(key);
        try {
          const lecDocPath = `${basePath}/lectures/${lec.id}`;
          const mime = lec.mimeType || resolveMimeType({ name: lec.fileName });
          const blob = await fetchFileBlobFromChunks(lecDocPath, mime);
          triggerBlobDownload(blob, lec.fileName || lec.title);
        } catch (err) {
          console.error(err);
          notify('تعذر تنزيل المحاضرة، تحقق من الاتصال بالإنترنت وأعد المحاولة', 'error');
        } finally {
          setLoadingFileKey(null);
        }
      };

      const handleOpenChunkedLecture = async (lec) => {
        const key = `${lec.id}_open`;
        if (loadingFileKey) return;

        const mime = lec.mimeType || resolveMimeType({ name: lec.fileName });
        const canPreviewInBrowser = mime === 'application/pdf' || mime.startsWith('image/');

        if (!canPreviewInBrowser) {
          await handleDownloadChunkedLecture(lec);
          return;
        }

        const popup = window.open('', '_blank');
        setLoadingFileKey(key);
        try {
          const lecDocPath = `${basePath}/lectures/${lec.id}`;
          const blob = await fetchFileBlobFromChunks(lecDocPath, mime);
          const blobUrl = URL.createObjectURL(blob);
          if (popup && !popup.closed) {
            popup.location.href = blobUrl;
          } else {
            triggerBlobDownload(blob, lec.fileName || lec.title);
          }
        } catch (err) {
          if (popup && !popup.closed) popup.close();
          console.error(err);
          notify('تعذر فتح المحاضرة، تحقق من الاتصال بالإنترنت وأعد المحاولة', 'error');
        } finally {
          setLoadingFileKey(null);
        }
      };

      // تجميع المحاضرات حسب الدكتور، ثم داخل كل دكتور حسب المادة، وبداخلها نظري وعملي منفصلان
      const groupedLectures = useMemo(() => {
        const doctorsMap = {};
        lectures.forEach(lec => {
          const docKey = lec.doctorId || `name_${normalizeArabic(lec.doctorName || 'دكتور المادة')}`;
          if (!doctorsMap[docKey]) {
            doctorsMap[docKey] = {
              doctorName: lec.doctorName || 'دكتور المادة',
              subjects: {}
            };
          }
          const subjNorm = normalizeArabic(lec.subjectName || 'مادة دراسية');
          if (!doctorsMap[docKey].subjects[subjNorm]) {
            doctorsMap[docKey].subjects[subjNorm] = {
              subjectName: lec.subjectName || 'مادة دراسية',
              theoretical: [],
              practical: []
            };
          }
          if (lec.lectureType === 'practical') {
            doctorsMap[docKey].subjects[subjNorm].practical.push(lec);
          } else {
            doctorsMap[docKey].subjects[subjNorm].theoretical.push(lec);
          }
        });
        return Object.entries(doctorsMap);
      }, [lectures]);

      // استخراج قائمة المواد المتوفرة في نتائج الطالب أو محاضراته
      const availableSubjects = useMemo(() => {
        const set = new Set();
        results.forEach(r => set.add(r.subjectName));
        lectures.forEach(l => set.add(l.subjectName));
        return Array.from(set);
      }, [results, lectures]);

      // تصفية الدرجات المعروضة بناءً على اختيار الطالب الدقيق
      const filteredStudentResults = useMemo(() => {
        if (!selectedSubject || !examCategory) return [];
        let targetExamType = '';
        if (examCategory === 'daily') {
          targetExamType = 'daily';
        } else if (examCategory === 'sem1') {
          if (!subExamType) return [];
          targetExamType = subExamType === 'mid' ? 'sem1_mid' : 'sem1_final';
        } else if (examCategory === 'sem2') {
          if (!subExamType) return [];
          targetExamType = subExamType === 'mid' ? 'sem2_mid' : 'sem2_final';
        }

        return results.filter(r => 
          normalizeArabic(r.subjectName) === normalizeArabic(selectedSubject) &&
          r.examType === targetExamType
        );
      }, [results, selectedSubject, examCategory, subExamType]);

      const renderLectureRow = (lec) => {
        const isLegacyUrl = !!lec.fileUrl && !lec.chunkCount;
        const isOpening = loadingFileKey === `${lec.id}_open`;
        const isDownloading = loadingFileKey === `${lec.id}_download`;
        return (
          <div key={lec.id} className="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between gap-3 shadow-xs">
            <div className="min-w-0">
              <p className="font-bold text-slate-800 text-sm truncate">{lec.title}</p>
              <p className="text-xs text-slate-500 mt-0.5">{lec.doctorName}</p>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {isLegacyUrl ? (
                <>
                  <a
                    href={lec.fileUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-3 py-1.5 rounded-xl bg-ntu-50 hover:bg-ntu-100 text-ntu-800 font-bold text-xs transition"
                  >
                    فتح
                  </a>
                  <a
                    href={lec.fileUrl}
                    download={lec.fileName || lec.title}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-3 py-1.5 rounded-xl bg-ntu-700 hover:bg-ntu-800 text-white font-bold text-xs transition"
                  >
                    تنزيل
                  </a>
                </>
              ) : (
                <>
                  <button
                    type="button"
                    disabled={!!loadingFileKey}
                    onClick={() => handleOpenChunkedLecture(lec)}
                    className="px-3 py-1.5 rounded-xl bg-ntu-50 hover:bg-ntu-100 disabled:opacity-60 text-ntu-800 font-bold text-xs transition"
                  >
                    {isOpening ? 'جاري التحميل...' : 'فتح'}
                  </button>
                  <button
                    type="button"
                    disabled={!!loadingFileKey}
                    onClick={() => handleDownloadChunkedLecture(lec)}
                    className="px-3 py-1.5 rounded-xl bg-ntu-700 hover:bg-ntu-800 disabled:opacity-60 text-white font-bold text-xs transition"
                  >
                    {isDownloading ? 'جاري التحميل...' : 'تنزيل'}
                  </button>
                </>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
          {/* شريط ترحيبي */}
          <div className="bg-gradient-to-l from-ntu-800 to-ntu-600 rounded-3xl p-5 sm:p-6 text-white shadow-lg">
            <p className="text-ntu-100 text-xs sm:text-sm font-semibold">مرحباً بك في بوابة الطالب</p>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-1">{session.fullName}</h2>
            <p className="text-xs sm:text-sm text-ntu-100 mt-1 opacity-90">{session.departmentName}</p>
          </div>

          {/* أزرار الأقسام الرئيسية الثلاثة */}
          <div className="grid grid-cols-3 gap-3">
            <button
              onClick={() => setActiveTab('lectures')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${
                activeTab === 'lectures' 
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              <Icons.Book />
              <span>محاضرات</span>
            </button>

            <button
              onClick={() => setActiveTab('schedule')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${
                activeTab === 'schedule' 
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              <Icons.Calendar />
              <span>جدول</span>
            </button>

            <button
              onClick={() => setActiveTab('results')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${
                activeTab === 'results' 
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              <Icons.Chart />
              <span>نتائج</span>
            </button>
          </div>

          {/* 1. قسم المحاضرات (مفصول حسب الدكتور ثم المادة ثم نظري وعملي) */}
          {activeTab === 'lectures' && (
            <div className="space-y-5">
              {loadingData ? (
                <div className="text-center py-12 text-slate-500 font-bold">جاري تحميل المحاضرات...</div>
              ) : groupedLectures.length === 0 ? (
                <div className="glass-card rounded-3xl p-10 text-center text-slate-500 font-bold">
                  لا توجد محاضرات مرفوعة لقسمك ومرحلتك حالياً.
                </div>
              ) : (
                groupedLectures.map(([docKey, docGroup]) => (
                  <div key={docKey} className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-5">
                    <div className="flex items-center gap-2 pb-3 border-b border-slate-100">
                      <span className="w-3 h-3 rounded-full bg-ntu-600"></span>
                      <h3 className="text-lg font-extrabold text-ntu-900">{docGroup.doctorName}</h3>
                    </div>

                    <div className="space-y-5">
                      {Object.entries(docGroup.subjects).map(([subjKey, subjData]) => (
                        <div key={subjKey} className="space-y-3">
                          <div className="text-sm font-extrabold text-slate-800 bg-ntu-50 border border-ntu-200 px-3.5 py-1.5 rounded-xl inline-block">
                            المادة: {subjData.subjectName}
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {/* صندوق النظري */}
                            <div className="rounded-2xl bg-slate-50 border border-slate-200/80 p-4 space-y-3">
                              <div className="text-xs font-extrabold text-ntu-800 bg-ntu-100/70 px-3 py-1 rounded-lg inline-block">
                                نظري ({subjData.theoretical.length})
                              </div>
                              {subjData.theoretical.length === 0 ? (
                                <p className="text-xs text-slate-400 font-bold py-4 text-center">لا توجد محاضرات</p>
                              ) : (
                                <div className="space-y-2.5">
                                  {subjData.theoretical.map(renderLectureRow)}
                                </div>
                              )}
                            </div>

                            {/* صندوق العملي */}
                            <div className="rounded-2xl bg-slate-50 border border-slate-200/80 p-4 space-y-3">
                              <div className="text-xs font-extrabold text-amber-900 bg-amber-100/80 px-3 py-1 rounded-lg inline-block">
                                عملي ({subjData.practical.length})
                              </div>
                              {subjData.practical.length === 0 ? (
                                <p className="text-xs text-slate-400 font-bold py-4 text-center">لا توجد محاضرات</p>
                              ) : (
                                <div className="space-y-2.5">
                                  {subjData.practical.map(renderLectureRow)}
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {/* 2. قسم الجدول الدراسي (بنوعين وفصلين) */}
          {activeTab === 'schedule' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
              <h3 className="text-lg font-extrabold text-slate-900 text-center">الجدول الدراسي</h3>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setSchedKind('weekly')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedKind === 'weekly'
                        ? 'bg-ntu-700 text-white border-ntu-700 shadow-xs'
                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-ntu-400'
                    }`}
                  >
                    جدول أسبوعي
                  </button>
                  <button
                    type="button"
                    onClick={() => setSchedKind('exam')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedKind === 'exam'
                        ? 'bg-ntu-700 text-white border-ntu-700 shadow-xs'
                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-ntu-400'
                    }`}
                  >
                    جدول امتحاني
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setSchedSemester('sem1')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedSemester === 'sem1'
                        ? 'bg-amber-600 text-white border-amber-600 shadow-xs'
                        : 'bg-amber-50 text-amber-900 border-amber-200 hover:border-amber-400'
                    }`}
                  >
                    الفصل الأول
                  </button>
                  <button
                    type="button"
                    onClick={() => setSchedSemester('sem2')}
                    className={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                      schedSemester === 'sem2'
                        ? 'bg-amber-600 text-white border-amber-600 shadow-xs'
                        : 'bg-amber-50 text-amber-900 border-amber-200 hover:border-amber-400'
                    }`}
                  >
                    الفصل الثاني
                  </button>
                </div>
              </div>

              <div className="text-center pt-2">
                {scheduleUrl ? (
                  <div className="space-y-4">
                    <div 
                      onClick={() => setZoomSchedule(true)}
                      className="relative cursor-zoom-in rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 max-h-[500px] flex items-center justify-center"
                    >
                      <img src={scheduleUrl} alt="الجدول الدراسي" className="w-full h-auto object-contain" />
                    </div>
                    <button
                      onClick={() => setZoomSchedule(true)}
                      className="px-5 py-2.5 rounded-xl bg-ntu-700 text-white font-bold text-sm"
                    >
                      تكبير صورة الجدول 🔍
                    </button>
                  </div>
                ) : (
                  <div className="py-12 text-slate-500 font-bold">
                    لم يتم رفع صورة هذا الجدول لقسمك ومرحلتك بعد.
                  </div>
                )}
              </div>

              {/* نافذة تكبير الجدول */}
              {zoomSchedule && scheduleUrl && (
                <div 
                  onClick={() => setZoomSchedule(false)}
                  className="fixed inset-0 z-50 bg-black/90 p-4 flex items-center justify-center cursor-zoom-out"
                >
                  <img src={scheduleUrl} alt="الجدول مكبر" className="max-w-full max-h-full object-contain rounded-xl" />
                </div>
              )}
            </div>
          )}

          {/* 3. قسم النتائج */}
          {activeTab === 'results' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-6">
              <h3 className="text-lg font-extrabold text-slate-900">نتائج الامتحانات</h3>

              {availableSubjects.length === 0 ? (
                <p className="text-center py-8 text-slate-500 font-bold">لا توجد مواد أو درجات منشورة لك حالياً.</p>
              ) : (
                <>
                  {/* اختيار المادة */}
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">1. اختر المادة الدراسية:</label>
                    <div className="flex flex-wrap gap-2">
                      {availableSubjects.map(subj => (
                        <button
                          key={subj}
                          onClick={() => {
                            setSelectedSubject(subj);
                            setExamCategory(null);
                            setSubExamType(null);
                          }}
                          className={`px-4 py-2.5 rounded-2xl font-bold text-sm border-2 transition ${
                            selectedSubject === subj
                              ? 'bg-ntu-700 text-white border-ntu-700'
                              : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
                          }`}
                        >
                          {subj}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* اختيار نوع الامتحان للمادة المختارة */}
                  {selectedSubject && (
                    <div className="pt-4 border-t border-slate-100 space-y-4">
                      <label className="block text-sm font-bold text-slate-700">2. اختر نوع الامتحان لمادة ({selectedSubject}):</label>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <button
                          onClick={() => { setExamCategory('daily'); setSubExamType(null); }}
                          className={`p-3.5 rounded-2xl font-bold text-sm border-2 transition ${
                            examCategory === 'daily' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-slate-50 text-slate-800 border-slate-200'
                          }`}
                        >
                          امتحانات يومية
                        </button>
                        <button
                          onClick={() => { setExamCategory('sem1'); setSubExamType(null); }}
                          className={`p-3.5 rounded-2xl font-bold text-sm border-2 transition ${
                            examCategory === 'sem1' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-slate-50 text-slate-800 border-slate-200'
                          }`}
                        >
                          امتحانات الفصل الأول
                        </button>
                        <button
                          onClick={() => { setExamCategory('sem2'); setSubExamType(null); }}
                          className={`p-3.5 rounded-2xl font-bold text-sm border-2 transition ${
                            examCategory === 'sem2' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-slate-50 text-slate-800 border-slate-200'
                          }`}
                        >
                          امتحانات الفصل الثاني
                        </button>
                      </div>

                      {/* خانتان مستقلتان: ميدتيرم / فاينل عند اختيار الفصل الأول أو الثاني */}
                      {(examCategory === 'sem1' || examCategory === 'sem2') && (
                        <div className="pt-3 flex gap-3">
                          <button
                            onClick={() => setSubExamType('mid')}
                            className={`flex-1 py-3 rounded-2xl font-extrabold text-sm border-2 transition ${
                              subExamType === 'mid' ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 text-amber-900 border-amber-200'
                            }`}
                          >
                            ميدتيرم (Midterm)
                          </button>
                          <button
                            onClick={() => setSubExamType('final')}
                            className={`flex-1 py-3 rounded-2xl font-extrabold text-sm border-2 transition ${
                              subExamType === 'final' ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 text-amber-900 border-amber-200'
                            }`}
                          >
                            فاينل (Final)
                          </button>
                        </div>
                      )}

                      {/* عرض درجة الطالب فقط */}
                      {(examCategory === 'daily' || subExamType) && (
                        <div className="mt-5 p-5 rounded-3xl bg-ntu-50 border-2 border-ntu-200">
                          {filteredStudentResults.length === 0 ? (
                            <p className="text-center text-slate-600 font-bold">لم يتم نشر درجتك في هذا الخيار بعد.</p>
                          ) : (
                            <div className="space-y-3">
                              {filteredStudentResults.map(res => (
                                <div key={res.id} className="bg-white p-4 rounded-2xl shadow-xs flex items-center justify-between">
                                  <div>
                                    <p className="text-xs text-slate-500 font-bold">الطالب: {session.fullName}</p>
                                    <p className="text-base font-extrabold text-slate-900 mt-0.5">
                                      {res.examTitle || res.subjectName}
                                    </p>
                                  </div>
                                  <div className="px-5 py-2.5 rounded-2xl bg-ntu-700 text-white font-extrabold text-xl shadow" dir="ltr">
                                    {res.maxScore !== undefined && res.maxScore !== null && res.maxScore !== ''
                                      ? `${res.score} / ${res.maxScore}`
                                      : res.score}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. واجهة الدكتور (Doctor Dashboard)
    // ==========================================
    function DoctorDashboard({ session, notify }) {
      const { departments } = useDepartments();
      const [activeTab, setActiveTab] = useState('lectures'); // 'lectures' | 'daily_grades'

      // --- حقول رفع محاضرة ---
      const [subjectName, setSubjectName] = useState('');
      const [lectureType, setLectureType] = useState('theoretical');
      const [lectureTitle, setLectureTitle] = useState('');
      const [stageId, setStageId] = useState('stage1');
      const [studyTypeId, setStudyTypeId] = useState('morning');
      const [deptId, setDeptId] = useState(session.departmentId || '');
      const [lectureFile, setLectureFile] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      const cancelRef = useRef(false);
      const lectureFileInputRef = useRef(null);

      // محاضرات الدكتور الحالية (للحذف أو التعديل)
      const [myLectures, setMyLectures] = useState([]);
      const [editingLecture, setEditingLecture] = useState(null);

      // --- حقول رفع درجات الامتحانات اليومية ---
      const [gradeSubject, setGradeSubject] = useState('');
      const [gradeExamTitle, setGradeExamTitle] = useState('');
      const [gradeMaxScore, setGradeMaxScore] = useState('');
      const [gradeStage, setGradeStage] = useState('stage1');
      const [gradeStudyType, setGradeStudyType] = useState('morning');
      const [gradeDeptId, setGradeDeptId] = useState(session.departmentId || '');
      const [rawPasteText, setRawPasteText] = useState('');
      const [parsedRows, setParsedRows] = useState([]);
      const [reviewMode, setReviewMode] = useState(false);
      const [publishingGrades, setPublishingGrades] = useState(false);

      // --- نتائجي المنشورة للدكتور ---
      const [myResultGroups, setMyResultGroups] = useState([]);
      const [expandedGroupId, setExpandedGroupId] = useState(null);
      const [groupStudents, setGroupStudents] = useState([]);
      const [loadingGroupDetails, setLoadingGroupDetails] = useState(false);

      useEffect(() => {
        if (departments.length > 0) {
          if (!deptId) setDeptId(session.departmentId || departments[0].id);
          if (!gradeDeptId) setGradeDeptId(session.departmentId || departments[0].id);
        }
      }, [departments, session.departmentId]);

      // جلب محاضرات ونتائج هذا الدكتور فقط ضمن الفرع
      useEffect(() => {
        const { db, collection, query, where, onSnapshot } = window.fb;
        const qLec = query(
          collection(db, `branches/${session.branchId}/doctor_lectures_index`),
          where('doctorId', '==', session.doctorId)
        );
        const unsubLec = onSnapshot(qLec, (snap) => {
          setMyLectures(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const qRes = query(
          collection(db, `branches/${session.branchId}/doctor_results_index`),
          where('doctorId', '==', session.doctorId)
        );
        const unsubRes = onSnapshot(qRes, (snap) => {
          setMyResultGroups(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        return () => {
          unsubLec();
          unsubRes();
        };
      }, [session]);

      // تقسيم محاضرات الدكتور إلى نظري وعملي
      const myTheoreticalLectures = useMemo(
        () => myLectures.filter(l => l.lectureType !== 'practical'),
        [myLectures]
      );
      const myPracticalLectures = useMemo(
        () => myLectures.filter(l => l.lectureType === 'practical'),
        [myLectures]
      );

      // إضافة محاضرة جديدة عبر الأجزاء (Chunks) في Firestore
      const handleAddLecture = async (e) => {
        e.preventDefault();
        if (uploading) return;

        const cleanSubj = cleanSpaces(subjectName);
        const cleanTitle = cleanSpaces(lectureTitle);
        const selectedDeptObj = departments.find(d => d.id === deptId);

        if (!cleanSubj || !cleanTitle || !selectedDeptObj || !lectureFile) {
          notify('يرجى ملء جميع الحقول واختيار القسم وملف المحاضرة', 'error');
          return;
        }

        cancelRef.current = false;
        setUploadProgress(0);
        setUploading(true);

        try {
          const { db, collection, setDoc, doc, serverTimestamp } = window.fb;
          const cleanDept = selectedDeptObj.name;
          const basePath = getIsolatedBasePath(session.branchId, stageId, studyTypeId, cleanDept);
          const lecRef = doc(collection(db, `${basePath}/lectures`));

          const { chunkCount, fileSize, mimeType } = await uploadFileInChunks({
            file: lectureFile,
            parentDocPath: lecRef.path,
            onProgress: (pct) => setUploadProgress(pct),
            cancelRef
          });

          const lecPayload = {
            subjectName: cleanSubj,
            lectureType,
            title: cleanTitle,
            doctorId: session.doctorId,
            doctorName: session.doctorName,
            branchId: session.branchId,
            stageId,
            studyTypeId,
            departmentId: selectedDeptObj.id,
            departmentName: cleanDept,
            fileName: lectureFile.name,
            chunkCount,
            fileSize,
            mimeType,
            createdAt: serverTimestamp()
          };

          await withTimeout(setDoc(lecRef, lecPayload), 30000, 'app/timeout');
          await withTimeout(
            setDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${lecRef.id}`), {
              ...lecPayload,
              lectureDocPath: lecRef.path
            }),
            30000,
            'app/timeout'
          );

          notify('تم رفع ونشر المحاضرة بنجاح!', 'success');
          setLectureTitle('');
          setLectureFile(null);
          if (lectureFileInputRef.current) lectureFileInputRef.current.value = '';
        } catch (err) {
          notify(uploadErrorMessage(err), 'error');
        } finally {
          setUploading(false);
          setUploadProgress(0);
        }
      };

      // حذف محاضرة للدكتور مع أجزائها
      const handleDeleteLecture = async (lec) => {
        if (!window.confirm(`هل أنت متأكد من حذف المحاضرة "${lec.title}"؟`)) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          if (lec.lectureDocPath) {
            await deleteChunks(lec.lectureDocPath);
            await deleteDoc(doc(db, lec.lectureDocPath));
          }
          await deleteDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${lec.id}`));
          notify('تم حذف المحاضرة بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف المحاضرة', 'error');
        }
      };

      // تعديل عنوان المحاضرة
      const handleUpdateLectureTitle = async () => {
        if (!editingLecture || !cleanSpaces(editingLecture.title)) return;
        try {
          const { db, doc, updateDoc } = window.fb;
          const newTitle = cleanSpaces(editingLecture.title);
          if (editingLecture.lectureDocPath) {
            await updateDoc(doc(db, editingLecture.lectureDocPath), { title: newTitle });
          }
          await updateDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${editingLecture.id}`), { title: newTitle });
          notify('تم تحديث عنوان المحاضرة', 'success');
          setEditingLecture(null);
        } catch (err) {
          notify('فشل التحديث', 'error');
        }
      };

      // قراءة ملف Excel / CSV للدرجات (تحمل SheetJS عند الحاجة فقط)
      const handleExcelUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const XLSXLib = await loadXLSX();
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const bstr = evt.target.result;
              const wb = XLSXLib.read(bstr, { type: 'binary' });
              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];
              const data = XLSXLib.utils.sheet_to_json(ws, { header: 1 });
              const lines = data
                .filter(row => row && row.length >= 2 && row[0] && row[1] !== undefined)
                .map(row => `${cleanSpaces(String(row[0]))} - ${String(row[1]).trim()}`);
              setRawPasteText(lines.join('\n'));
              notify(`تم استخراج ${lines.length} صف من الملف بنجاح`, 'success');
            } catch (parseErr) {
              console.error(parseErr);
              notify('تعذرت قراءة محتوى الملف، تأكد من صيغته', 'error');
            }
          };
          reader.readAsBinaryString(file);
        } catch (err) {
          console.error(err);
          notify('تعذر تحميل أداة قراءة Excel، تحقق من الإنترنت', 'error');
        }
      };

      // تحليل ومطابقة أسماء الطلاب مع قاعدة البيانات والتحقق من الدرجة العظمى
      const handleAnalyzeAndMatchGrades = async () => {
        const cleanSubj = cleanSpaces(gradeSubject);
        const selectedDeptObj = departments.find(d => d.id === gradeDeptId);
        const maxNum = Number(toLatinDigits(gradeMaxScore).trim());

        if (!cleanSubj || !selectedDeptObj || !rawPasteText.trim()) {
          notify('يرجى إدخال اسم المادة واختيار القسم وقائمة الطلاب والدرجات', 'error');
          return;
        }
        if (!Number.isFinite(maxNum) || maxNum <= 0) {
          notify('يرجى إدخال قيمة صحيحة لحقل "الدرجة من" (أكبر من 0)', 'error');
          return;
        }

        setPublishingGrades(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, selectedDeptObj.name);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const studentsList = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const lines = rawPasteText.split('\n').map(l => l.trim()).filter(Boolean);
          const analyzed = lines.map((line, idx) => {
            const match = line.match(/^(.+?)[\t\-:,،]+([^\t\-:,،]+)$/) || line.match(/^(.+?)\s+(\S+)$/);
            if (!match) {
              return { id: idx, rawLine: line, rawName: line, score: '', matchedStudent: null, status: 'invalid' };
            }
            const rawName = cleanSpaces(match[1]);
            const rawScoreStr = toLatinDigits(match[2]).trim();
            const numScore = Number(rawScoreStr);
            const normInput = normalizeArabic(rawName);
            const found = studentsList.find(s => s.normalizedName === normInput);

            if (!found) {
              return {
                id: idx,
                rawLine: line,
                rawName,
                score: rawScoreStr,
                matchedStudent: null,
                status: 'unmatched'
              };
            }

            if (rawScoreStr === '' || !Number.isFinite(numScore) || numScore < 0 || numScore > maxNum) {
              return {
                id: idx,
                rawLine: line,
                rawName,
                score: rawScoreStr,
                matchedStudent: found,
                status: 'badscore'
              };
            }

            return {
              id: idx,
              rawLine: line,
              rawName,
              score: numScore,
              matchedStudent: found,
              status: 'matched'
            };
          });

          setParsedRows(analyzed);
          setReviewMode(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء مطابقة أسماء الطلاب', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      // نشر الدرجات المطابقة فقط على دفعات متوازية مع فهرس نتائجي للدكتور
      const handlePublishMatchedGrades = async () => {
        const matchedItems = parsedRows.filter(r => r.status === 'matched' && r.matchedStudent);
        if (matchedItems.length === 0) {
          notify('لا توجد أسماء مطابقة لنشر درجاتها', 'error');
          return;
        }
        const selectedDeptObj = departments.find(d => d.id === gradeDeptId);
        if (!selectedDeptObj) {
          notify('يرجى اختيار القسم من القائمة', 'error');
          return;
        }

        const maxNum = Number(toLatinDigits(gradeMaxScore).trim());
        setPublishingGrades(true);
        try {
          const { db, doc, setDoc, serverTimestamp } = window.fb;
          const cleanSubj = cleanSpaces(gradeSubject);
          const cleanExamTitle = cleanSpaces(gradeExamTitle);
          const cleanDept = selectedDeptObj.name;
          const deptIdVal = selectedDeptObj.id;
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, cleanDept);
          const examHash = hashExamKey(cleanSubj, cleanExamTitle);
          const finalExamTitle = cleanExamTitle || `امتحان يومي - ${cleanSubj}`;

          const BATCH_SIZE = 20;
          for (let i = 0; i < matchedItems.length; i += BATCH_SIZE) {
            const batch = matchedItems.slice(i, i + BATCH_SIZE);
            await Promise.all(batch.map(item => {
              const resultId = `${item.matchedStudent.id}__daily__${examHash}`;
              return setDoc(doc(db, `${basePath}/results/${resultId}`), {
                studentId: item.matchedStudent.id,
                studentName: item.matchedStudent.fullName,
                subjectName: cleanSubj,
                examType: 'daily',
                examTitle: finalExamTitle,
                score: Number(item.score),
                maxScore: maxNum,
                doctorId: session.doctorId,
                doctorName: session.doctorName,
                examHash,
                branchId: session.branchId,
                stageId: gradeStage,
                studyTypeId: gradeStudyType,
                departmentId: deptIdVal,
                departmentName: cleanDept,
                createdAt: serverTimestamp()
              });
            }));
          }

          // حفظ مستند فهرس المجموعة في doctor_results_index
          const groupIndexId = `${session.doctorId}__${examHash}__${gradeStage}__${gradeStudyType}__${deptIdVal}`;
          await setDoc(doc(db, `branches/${session.branchId}/doctor_results_index/${groupIndexId}`), {
            doctorId: session.doctorId,
            subjectName: cleanSubj,
            examTitle: finalExamTitle,
            maxScore: maxNum,
            stageId: gradeStage,
            studyTypeId: gradeStudyType,
            departmentId: deptIdVal,
            departmentName: cleanDept,
            basePath,
            examHash,
            updatedAt: serverTimestamp()
          });

          notify(`تم نشر ${matchedItems.length} درجة`, 'success');
          setReviewMode(false);
          setRawPasteText('');
          setParsedRows([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر الدرجات', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      // عرض طلاب مجموعة درجات منشورة للدكتور
      const handleViewDoctorResultGroup = async (grp) => {
        if (expandedGroupId === grp.id) {
          setExpandedGroupId(null);
          setGroupStudents([]);
          return;
        }
        setExpandedGroupId(grp.id);
        setLoadingGroupDetails(true);
        try {
          const { db, collection, query, where, getDocs } = window.fb;
          const q = query(
            collection(db, `${grp.basePath}/results`),
            where('examHash', '==', grp.examHash),
            where('doctorId', '==', session.doctorId)
          );
          const snap = await getDocs(q);
          setGroupStudents(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء تحميل قائمة الطلاب', 'error');
        } finally {
          setLoadingGroupDetails(false);
        }
      };

      // حذف درجة طالب واحد من مجموعة الدكتور
      const handleDeleteSingleDoctorResult = async (grp, resItem) => {
        if (!window.confirm(`هل أنت متأكد من حذف درجة الطالب "${resItem.studentName}"؟`)) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          await deleteDoc(doc(db, `${grp.basePath}/results/${resItem.id}`));
          const remaining = groupStudents.filter(s => s.id !== resItem.id);
          setGroupStudents(remaining);
          if (remaining.length === 0) {
            await deleteDoc(doc(db, `branches/${session.branchId}/doctor_results_index/${grp.id}`));
            setExpandedGroupId(null);
          }
          notify('تم حذف الدرجة بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف الدرجة', 'error');
        }
      };

      // حذف مجموعة درجات كاملة للدكتور
      const handleDeleteDoctorResultGroup = async (grp) => {
        if (!window.confirm(`هل أنت متأكد من حذف جميع درجات "${grp.examTitle}" بالكامل؟`)) return;
        try {
          const { db, collection, query, where, getDocs, doc, deleteDoc } = window.fb;
          const q = query(
            collection(db, `${grp.basePath}/results`),
            where('examHash', '==', grp.examHash),
            where('doctorId', '==', session.doctorId)
          );
          const snap = await getDocs(q);
          for (const d of snap.docs) {
            await deleteDoc(doc(db, `${grp.basePath}/results/${d.id}`));
          }
          await deleteDoc(doc(db, `branches/${session.branchId}/doctor_results_index/${grp.id}`));
          if (expandedGroupId === grp.id) {
            setExpandedGroupId(null);
            setGroupStudents([]);
          }

    function CoordinatorDashboard({ session, notify }) {
      // التبديل بين أقسام المقرر: 'results' | 'schedule' | 'members' | 'published'

      // اختيار الفصل والامتحان على مستويين
      const [selectedSemester, setSelectedSemester] = useState(null); // 'sem1' | 'sem2'
      const [selectedSubExam, setSelectedSubExam] = useState(null); // 'mid' | 'final'
      const [midMaxScore, setMidMaxScore] = useState(40); // 30 أو 40 (الافتراضي 40)

      // الفرع والقسم ثابتان من جلسة المقرر
      const branchId = session.branchId;
      const branchName = BRANCHES.find(b => b.id === branchId)?.name || branchId;

      const [stageId, setStageId] = useState('stage1');
      const [studyTypeId, setStudyTypeId] = useState('morning');
      const deptName = session.departmentName || '';

      const [rawText, setRawText] = useState('');
      const [reviewList, setReviewList] = useState([]);
      const [isReviewing, setIsReviewing] = useState(false);
      const [processing, setProcessing] = useState(false);

      // حالات رفع الجدول الدراسي لمقرر القسم (نوعين وفصلين)
      const [schedKind, setSchedKind] = useState('weekly'); // 'weekly' | 'exam'
      const [schedSemester, setSchedSemester] = useState('sem1'); // 'sem1' | 'sem2'
      const [schedStage, setSchedStage] = useState('stage1');
      const [schedStudyType, setSchedStudyType] = useState('morning');
      const [schedFile, setSchedFile] = useState(null);
      const [uploadingSched, setUploadingSched] = useState(false);
      const [schedProgress, setSchedProgress] = useState(0);
      const cancelSchedRef = useRef(false);
      const schedInputRef = useRef(null);

      // --- حالات "سجل أعضاء" ---
      const [membersTab, setMembersTab] = useState('students'); // 'students' | 'doctors'
      const [memberStageFilter, setMemberStageFilter] = useState('all');
      const [memberStudyFilter, setMemberStudyFilter] = useState('all');
      const [memberSearch, setMemberSearch] = useState('');
      const [deptStudents, setDeptStudents] = useState([]);
      const [loadingMembers, setLoadingMembers] = useState(false);
      const [resetPassTarget, setResetPassTarget] = useState(null);
      const [newStudentPass, setNewStudentPass] = useState('');
      const [updatingPass, setUpdatingPass] = useState(false);
      const [deptDoctors, setDeptDoctors] = useState([]);
      const [loadingDoctors, setLoadingDoctors] = useState(false);

      // --- حالات "ما تم نشره" ---
      const [publishedTab, setPublishedTab] = useState('results'); // 'results' | 'schedules'
      const [pubStage, setPubStage] = useState('stage1');
      const [pubStudyType, setPubStudyType] = useState('morning');
      const [pubResultGroups, setPubResultGroups] = useState([]);
      const [loadingPubResults, setLoadingPubResults] = useState(false);
      const [expandedPubGroupKey, setExpandedPubGroupKey] = useState(null);
      const [pubSchedules, setPubSchedules] = useState([]);
      const [loadingPubSchedules, setLoadingPubSchedules] = useState(false);
      const [viewingScheduleImg, setViewingScheduleImg] = useState(null);

      // معرّف نوع الامتحان الفعلي المحفوظ في Firestore
      const selectedExamType = useMemo(() => {
        if (!selectedSemester || !selectedSubExam) return null;
        return `${selectedSemester}_${selectedSubExam}`;
      }, [selectedSemester, selectedSubExam]);

      const currentMaxScore = selectedSubExam === 'final' ? 100 : midMaxScore;

      const examLabelsMap = {
        sem1_mid: 'الفصل الأول – ميدتيرم',
        sem1_final: 'الفصل الأول – فاينل',
        sem2_mid: 'الفصل الثاني – ميدتيرم',
        sem2_final: 'الفصل الثاني – فاينل'
      };

      // التحقق من أن مقرر القسم يعدّل قسمه فقط
      const isAuthorizedDept = () => {
        return slugifyDept(cleanSpaces(deptName)) === session.departmentId;
      };

      const handleExcelImport = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const XLSXLib = await loadXLSX();
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const wb = XLSXLib.read(evt.target.result, { type: 'binary' });
              const ws = wb.Sheets[wb.SheetNames[0]];
              const rows = XLSXLib.utils.sheet_to_json(ws, { header: 1 });
              const formatted = rows
                .filter(r => r && r.length >= 3 && r[0] && r[1] && r[2] !== undefined)
                .map(r => `${cleanSpaces(String(r[0]))} | ${cleanSpaces(String(r[1]))} | ${String(r[2]).trim()}`);
              setRawText(formatted.join('\n'));
              notify(`تم استيراد ${formatted.length} سجل من الملف`, 'success');
            } catch (parseErr) {
              console.error(parseErr);
              notify('تعذرت قراءة محتوى الملف، تأكد من صيغته', 'error');
            }
          };
          reader.readAsBinaryString(file);
        } catch (err) {
          console.error(err);
          notify('تعذر تحميل أداة قراءة Excel، تحقق من الإنترنت', 'error');
        }
      };

      const handleVerifyCoordinatorData = async () => {
        if (!selectedExamType) {
          notify('يرجى اختيار الفصل ونوع الامتحان أولاً', 'error');
          return;
        }
        if (!isAuthorizedDept()) {
          notify(`غير مصرح لك! يمكنك النشر لقسمك (${session.departmentName}) فقط.`, 'error');
          return;
        }
        if (!rawText.trim()) {
          notify('يرجى إدخال النتائج أو رفع ملف Excel', 'error');
          return;
        }

        setProcessing(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const students = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const maxAllowed = currentMaxScore;
          const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
          const checked = lines.map((line, i) => {
            const parts = line.split(/[\|\t,،\-]+/).map(p => cleanSpaces(p)).filter(Boolean);
            if (parts.length < 3) {
              return { id: i, rawLine: line, subject: '', rawName: line, score: '', matchedStudent: null, status: 'invalid' };
            }
            const subject = parts[0];
            const rawScoreStr = toLatinDigits(parts[parts.length - 1]).trim();
            const numScore = Number(rawScoreStr);
            const rawName = parts.slice(1, parts.length - 1).join(' ');
            const normName = normalizeArabic(rawName);

            const found = students.find(s => s.normalizedName === normName);
            if (!found) {
              return {
                id: i,
                rawLine: line,
                subject,
                rawName,
                score: rawScoreStr,
                matchedStudent: null,
                status: 'unmatched'
              };
            }

            if (rawScoreStr === '' || !Number.isFinite(numScore) || numScore < 0 || numScore > maxAllowed) {
              return {
                id: i,
                rawLine: line,
                subject,
                rawName,
                score: rawScoreStr,
                matchedStudent: found,
                status: 'badscore'
              };
            }

            return {
              id: i,
              rawLine: line,
              subject,
              rawName,
              score: numScore,
              matchedStudent: found,
              status: 'matched'
            };
          });

          setReviewList(checked);
          setIsReviewing(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء فحص البيانات', 'error');
        } finally {
          setProcessing(false);
        }
      };

      const handlePublishResults = async () => {
        const validRows = reviewList.filter(r => r.status === 'matched' && r.matchedStudent);
        if (validRows.length === 0) {
          notify('لا توجد سجلات مطابقة للنشر', 'error');
          return;
        }

        const maxAllowed = currentMaxScore;
        setProcessing(true);
        try {
          const { db, doc, setDoc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(branchId, stageId, studyTypeId, session.departmentName);
          const examLabel = examLabelsMap[selectedExamType] || selectedExamType;

          const BATCH_SIZE = 20;
          for (let i = 0; i < validRows.length; i += BATCH_SIZE) {
            const batch = validRows.slice(i, i + BATCH_SIZE);
            await Promise.all(batch.map(row => {
              const subjHash = hashExamKey(row.subject, '');
              const resultId = `${row.matchedStudent.id}__${selectedExamType}__${subjHash}`;
              return setDoc(doc(db, `${basePath}/results/${resultId}`), {
                studentId: row.matchedStudent.id,
                studentName: row.matchedStudent.fullName,
                subjectName: row.subject,
                examType: selectedExamType,
                examTitle: `${row.subject} (${examLabel})`,
                score: Number(row.score),
                maxScore: maxAllowed,
                publishedBy: 'مقرر القسم',
                branchId,
                stageId,
                studyTypeId,
                departmentId: session.departmentId,
                departmentName: session.departmentName,
                createdAt: serverTimestamp()
              });
            }));
          }

          notify(`تم نشر ${validRows.length} درجة`, 'success');
          setIsReviewing(false);
          setRawText('');
          setReviewList([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر النتائج', 'error');
        } finally {
          setProcessing(false);
        }
      };

      // رفع صورة الجدول الدراسي للقسم (بنوعين وفصلين) مع فهرس خفيف
      const handleCoordinatorUploadSchedule = async (e) => {
        e.preventDefault();
        if (uploadingSched) return;

        if (!isAuthorizedDept()) {
          notify(`غير مصرح لك! يمكنك رفع الجدول لقسمك (${session.departmentName}) فقط.`, 'error');
          return;
        }
        if (!schedFile) {
          notify('يرجى اختيار صورة الجدول الدراسي أولاً', 'error');
          return;
        }

        cancelSchedRef.current = false;
        setSchedProgress(10);
        setUploadingSched(true);

        try {
          const compressedDataUrl = await compressImageToDataUrl(schedFile, 850000);
          if (cancelSchedRef.current) {
            const cErr = new Error('canceled');
            cErr.code = 'canceled';
            throw cErr;
          }
          setSchedProgress(60);

          const { db, doc, setDoc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(branchId, schedStage, schedStudyType, session.departmentName);
          const schedDocKey = `${schedKind}_${schedSemester}`;

          await withTimeout(
            setDoc(doc(db, `${basePath}/schedule/${schedDocKey}`), {
              imageUrl: compressedDataUrl,
              kind: schedKind,
              semester: schedSemester,
              updatedBy: `مقرر قسم (${session.departmentName})`,
              updatedAt: serverTimestamp()
            }),
            45000,
            'app/timeout'
          );

          const indexDocId = `${session.departmentId}__${schedStage}__${schedStudyType}__${schedKind}__${schedSemester}`;
          await withTimeout(
            setDoc(doc(db, `branches/${branchId}/schedule_index/${indexDocId}`), {
              departmentId: session.departmentId,
              departmentName: session.departmentName,
              kind: schedKind,
              semester: schedSemester,
              stageId: schedStage,
              studyTypeId: schedStudyType,
              basePath,
              updatedAt: serverTimestamp()
            }),
            30000,
            'app/timeout'
          );

          setSchedProgress(100);
          notify('تم رفع ونشر صورة الجدول الدراسي بنجاح!', 'success');
          setSchedFile(null);
          if (schedInputRef.current) schedInputRef.current.value = '';
        } catch (err) {
          notify(uploadErrorMessage(err), 'error');
        } finally {
          setUploadingSched(false);
          setSchedProgress(0);
        }
      };

      // ==========================================
      // منطق تبويب "سجل أعضاء"
      // ==========================================
      useEffect(() => {
        if (activeSection !== 'members') return;
        const { db, collection, getDocs } = window.fb;

        if (membersTab === 'students') {
          let cancelled = false;
          setLoadingMembers(true);

          const targetStages = memberStageFilter === 'all' ? STAGES.map(s => s.id) : [memberStageFilter];
          const targetTypes = memberStudyFilter === 'all' ? STUDY_TYPES.map(t => t.id) : [memberStudyFilter];

          const tasks = [];
          for (const stId of targetStages) {
            for (const tyId of targetTypes) {
              const bp = getIsolatedBasePath(branchId, stId, tyId, session.departmentName);
              tasks.push(
                getDocs(collection(db, `${bp}/students`)).then(snap =>
                  snap.docs.map(d => ({
                    id: d.id,
                    basePath: bp,
                    ...d.data(),
                    stageId: d.data().stageId || stId,
                    studyTypeId: d.data().studyTypeId || tyId
                  }))
                )
              );
            }
          }

          Promise.all(tasks)
            .then(resultsArrays => {
              if (cancelled) return;
              const merged = resultsArrays.flat().sort((a, b) =>
                (a.fullName || '').localeCompare(b.fullName || '', 'ar')
              );
              setDeptStudents(merged);
            })
            .catch(err => {
              console.error(err);
              if (!cancelled) notify('حدث خطأ أثناء تحميل سجل الطلاب', 'error');
            })
            .finally(() => {
              if (!cancelled) setLoadingMembers(false);
            });

          return () => { cancelled = true; };
        } else if (membersTab === 'doctors') {
          let cancelled = false;
          setLoadingDoctors(true);
          getDocs(collection(db, `branches/${branchId}/doctors`))
            .then(snap => {
              if (cancelled) return;
              const list = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(docItem => docItem.deptMap && docItem.deptMap[session.departmentId]);
              setDeptDoctors(list);
            })
            .catch(err => {
              console.error(err);
              if (!cancelled) notify('حدث خطأ أثناء تحميل قائمة الدكاترة', 'error');
            })
            .finally(() => {
              if (!cancelled) setLoadingDoctors(false);
            });
          return () => { cancelled = true; };
        }
      }, [activeSection, membersTab, memberStageFilter, memberStudyFilter, branchId, session.departmentName, session.departmentId]);

      const filteredDeptStudents = useMemo(() => {
        const q = normalizeArabic(memberSearch);
        if (!q) return deptStudents;
        return deptStudents.filter(st => normalizeArabic(st.fullName).includes(q));
      }, [deptStudents, memberSearch]);

      const handleSaveNewStudentPassword = async (e) => {
        e.preventDefault();
        if (!resetPassTarget || updatingPass) return;
        if (!newStudentPass || newStudentPass.length < 4) {
          notify('يرجى إدخال رمز سري جديد لا يقل عن 4 أحرف/أرقام', 'error');
          return;
        }

        setUpdatingPass(true);
        try {
          const { db, doc, updateDoc } = window.fb;
          const salt = generateSalt();
          const passwordHash = await hashPassword(newStudentPass, salt);
          await updateDoc(doc(db, `${resetPassTarget.basePath}/students/${resetPassTarget.id}`), {
            salt,
            passwordHash
          });
          notify(`تم تحديث الرمز السري للطالب ${resetPassTarget.fullName} بنجاح`, 'success');
          setResetPassTarget(null);
          setNewStudentPass('');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء تحديث الرمز السري', 'error');
        } finally {
          setUpdatingPass(false);
        }
      };

      const handleDeleteStudentMember = async (st) => {
        if (!window.confirm(`هل أنت متأكد من حذف الطالب "${st.fullName}" وجميع درجاته نهائياً؟`)) return;
        try {
          const { db, doc, deleteDoc, collection, query, where, getDocs } = window.fb;
          await deleteDoc(doc(db, `${st.basePath}/students/${st.id}`));
          try {
            await deleteDoc(doc(db, `branches/${branchId}/student_index/${st.id}`));
          } catch (_) {}

          const qRes = query(collection(db, `${st.basePath}/results`), where('studentId', '==', st.id));
          const resSnap = await getDocs(qRes);
          for (const rDoc of resSnap.docs) {
            await deleteDoc(doc(db, `${st.basePath}/results/${rDoc.id}`));
          }

          setDeptStudents(prev => prev.filter(item => item.id !== st.id));
          notify('تم حذف الطالب وجميع سجلاته بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف الطالب', 'error');
        }
      };

      const handleDeleteDoctorMember = async (docItem) => {
        if (!window.confirm(`هل أنت متأكد من حذف الدكتور "${docItem.doctorName}" من سجل القسم؟`)) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          await deleteDoc(doc(db, `branches/${branchId}/doctors/${docItem.id}`));
          setDeptDoctors(prev => prev.filter(item => item.id !== docItem.id));
          notify('تم حذف الدكتور بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف الدكتور', 'error');
        }
      };

      // ==========================================
      // منطق تبويب "ما تم نشره"
      // ==========================================
      const loadPublishedResults = async () => {
        setLoadingPubResults(true);
        setExpandedPubGroupKey(null);
        try {
          const { db, collection, getDocs } = window.fb;
          const bp = getIsolatedBasePath(branchId, pubStage, pubStudyType, session.departmentName);
          const snap = await getDocs(collection(db, `${bp}/results`));
          const semesterTypes = new Set(['sem1_mid', 'sem1_final', 'sem2_mid', 'sem2_final']);
          const rawRows = snap.docs
            .map(d => ({ id: d.id, basePath: bp, ...d.data() }))
            .filter(r => semesterTypes.has(r.examType));

          const groupsMap = {};
          rawRows.forEach(r => {
            const gKey = `${r.examType}__${normalizeArabic(r.subjectName)}`;
            if (!groupsMap[gKey]) {
              groupsMap[gKey] = {
                key: gKey,
                examType: r.examType,
                examLabel: examLabelsMap[r.examType] || r.examType,
                subjectName: r.subjectName,
                maxScore: r.maxScore,
                basePath: bp,
                items: []
              };
            }
            groupsMap[gKey].items.push(r);
          });

          setPubResultGroups(Object.values(groupsMap));
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء جلب النتائج المنشورة', 'error');
        } finally {
          setLoadingPubResults(false);
        }
      };

      const loadPublishedSchedules = async () => {
        setLoadingPubSchedules(true);
        try {
          const { db, collection, query, where, getDocs } = window.fb;
          const q = query(
            collection(db, `branches/${branchId}/schedule_index`),
            where('departmentId', '==', session.departmentId)
          );
          const snap = await getDocs(q);
          setPubSchedules(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء جلب الجداول المنشورة', 'error');
        } finally {
          setLoadingPubSchedules(false);
        }
      };

      useEffect(() => {
        if (activeSection !== 'published') return;
        if (publishedTab === 'results') {
          loadPublishedResults();
        } else if (publishedTab === 'schedules') {
          loadPublishedSchedules();
        }
      }, [activeSection, publishedTab, pubStage, pubStudyType]);

      const handleDeleteSinglePublishedResult = async (groupKey, item) => {
        if (!window.confirm(`هل أنت متأكد من حذف درجة الطالب "${item.studentName}"؟`)) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          await deleteDoc(doc(db, `${item.basePath}/results/${item.id}`));
          setPubResultGroups(prev =>
            prev
              .map(g => g.key === groupKey ? { ...g, items: g.items.filter(x => x.id !== item.id) } : g)
              .filter(g => g.items.length > 0)
          );
          notify('تم حذف النتيجة بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف النتيجة', 'error');
        }
      };

      const handleDeletePublishedGroup = async (grp) => {
        if (!window.confirm(`هل أنت متأكد من حذف نتائج مادة "${grp.subjectName}" (${grp.examLabel}) بالكامل؟`)) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          for (const item of grp.items) {
            await deleteDoc(doc(db, `${grp.basePath}/results/${item.id}`));
          }
          setPubResultGroups(prev => prev.filter(g => g.key !== grp.key));
          if (expandedPubGroupKey === grp.key) setExpandedPubGroupKey(null);
          notify('تم حذف نتائج المادة بالكامل', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف المادة', 'error');
        }
      };

      const handleViewPublishedSchedule = async (schedItem) => {
        try {
          const { db, doc, getDoc } = window.fb;
          const docKey = `${schedItem.kind}_${schedItem.semester}`;
          const snap = await getDoc(doc(db, `${schedItem.basePath}/schedule/${docKey}`));
          if (snap.exists() && snap.data().imageUrl) {
            setViewingScheduleImg(snap.data().imageUrl);
          } else {
            notify('لم يتم العثور على صورة الجدول', 'error');
          }
        } catch (err) {
          console.error(err);
          notify('تعذر تحميل صورة الجدول', 'error');
        }
      };

      const handleDeletePublishedSchedule = async (schedItem) => {
        if (!window.confirm('هل أنت متأكد من حذف هذا الجدول نهائياً؟')) return;
        try {
          const { db, doc, deleteDoc } = window.fb;
          const docKey = `${schedItem.kind}_${schedItem.semester}`;
          await deleteDoc(doc(db, `${schedItem.basePath}/schedule/${docKey}`));
          await deleteDoc(doc(db, `branches/${branchId}/schedule_index/${schedItem.id}`));
          setPubSchedules(prev => prev.filter(s => s.id !== schedItem.id));
          notify('تم حذف الجدول بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف الجدول', 'error');
        }
      };

      const formatFirestoreDate = (ts) => {
        if (!ts) return '—';
        try {
          const d = ts.toDate ? ts.toDate() : new Date(ts);
          return d.toLocaleDateString('ar-IQ');
        } catch {
          return '—';
        }
      };

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
          <div className="bg-gradient-to-l from-amber-800 to-amber-600 rounded-3xl p-5 sm:p-6 text-white shadow-lg">
            <span className="px-3 py-1 rounded-full bg-white/20 text-xs font-bold">لوحة مقرر القسم</span>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-2">{session.departmentName}</h2>
            <p className="text-xs sm:text-sm text-amber-100 mt-1">
              فرع {branchName} | إدارة ونشر نتائج الفصول الدراسية والجدول الأسبوعي والأعضاء
            </p>
          </div>

          {/* 4 أزرار للتبديل فوق البطاقة (grid-cols-2 على الجوال و grid-cols-4 على الشاشات الكبيرة) */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <button
              onClick={() => setActiveSection('results')}
              className={`p-3.5 rounded-2xl font-extrabold text-sm border-2 transition ${
                activeSection === 'results'
