    const MAX_UPLOAD_SIZE_BYTES = 50 * 1024 * 1024; // 50 ميجابايت

    // تنظيف النصوص والمسافات الزائدة وتوحيد الألف والهمزات للمطابقة الذكية
    const normalizeArabic = (str) => {
      if (!str) return '';
      return str
        .trim()
        .replace(/\s+/g, ' ')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي');
    };

    const cleanSpaces = (str) => (str || '').trim().replace(/\s+/g, ' ');

    // تنظيف اسم الملف قبل الرفع إلى Firebase Storage
    const sanitizeStorageFileName = (originalName) => {
      const parts = (originalName || 'file').split('.');
      const ext = parts.length > 1 ? '.' + parts.pop().replace(/[^a-zA-Z0-9]/g, '').toLowerCase() : '';
      const base = parts.join('.').replace(/[^a-zA-Z0-9_-]/g, '');
      return `${base || 'file'}${ext}`;
    };

    // ترجمة أخطاء Firebase Storage إلى رسائل عربية واضحة
    const getStorageErrorMessage = (err) => {
      if (!err) return 'حدث خطأ غير متوقع أثناء الرفع';
      if (err.code === 'storage/unauthorized') return 'لا توجد صلاحية رفع للملفات (storage/unauthorized) - تأكد من قواعد Storage';
      if (err.code === 'storage/retry-limit-exceeded') return 'فشل الرفع بسبب انقطاع الاتصال أو مشكلة في التخزين (storage/retry-limit-exceeded)';
      if (err.code === 'storage/canceled') return 'تم إلغاء عملية الرفع';
      if (err.code === 'custom/timeout') return 'انتهت المهلة القصوى للرفع (3 دقائق)، يرجى التحقق من سرعة الإنترنت والمحاولة مجدداً';
      return `فشل الرفع: ${err.message || err.code || 'خطأ غير معروف'}`;
    };

    // دالة مساعدة للرفع مع تتبع التقدم، المهلة القصوى، وإمكانية الإلغاء
    const uploadFileWithProgress = ({ storageRef, file, onProgress, onTaskCreated }) => {
      return new Promise((resolve, reject) => {
        const { uploadBytesResumable, getDownloadURL } = window.fb;
        const metadata = file.type ? { contentType: file.type } : undefined;
        const uploadTask = uploadBytesResumable(storageRef, file, metadata);
        if (onTaskCreated) onTaskCreated(uploadTask);

        let settled = false;
        const timeoutId = setTimeout(() => {
          if (!settled) {
            settled = true;
            try { uploadTask.cancel(); } catch (_) {}
            reject({ code: 'custom/timeout', message: 'انتهت المهلة القصوى للرفع' });
          }
        }, UPLOAD_TIMEOUT_MS);

        uploadTask.on(
          'state_changed',
          (snapshot) => {
            if (snapshot.totalBytes > 0 && onProgress) {
              const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
              onProgress(pct);
            }
          },
          (error) => {
            clearTimeout(timeoutId);
            if (!settled) {
              settled = true;
              reject(error);
            }
          },
          async () => {
            clearTimeout(timeoutId);
            if (!settled) {
              try {
                const url = await getDownloadURL(uploadTask.snapshot.ref);
                settled = true;
                resolve(url);
              } catch (urlErr) {
                settled = true;
                reject(urlErr);
              }
            }
          }
        );
      });
    };

    // إنشاء معرّف نظيف للقسم ليكون مساراً آمناً في Firestore
    const slugifyDept = (deptName) => {
      const normalized = normalizeArabic(deptName).toLowerCase();
      let hash = 0;
      for (let i = 0; i < normalized.length; i++) {
        hash = ((hash << 5) - hash) + normalized.charCodeAt(i);
        hash |= 0;
      }
      return 'dept_' + Math.abs(hash).toString(36);
    };

    // بناء معرّف ثابت للنتيجة لمنع التكرار عند إعادة النشر
    const buildResultDocId = (studentId, subjectName, examType, examTitle) => {
      const cleanIdPart = (val) => normalizeArabic(val || '').replace(/[\/\.\#\$\[\]\s]+/g, '_');
      const subjPart = cleanIdPart(subjectName);
      const titlePart = examType === 'daily' ? cleanIdPart(examTitle || `امتحان يومي - ${subjectName}`) : cleanIdPart(examType);
      return `${studentId}__${subjPart}__${examType}__${titlePart}`;
    };

    // بناء البريد الداخلي للطالب من اسمه المطبّع وبياناته الأكاديمية لحسابات Firebase Auth
    const buildStudentAuthEmail = (branchId, stageId, studyTypeId, deptId, normalizedName) => {
      let hash = 0;
      const seed = `${branchId}:${stageId}:${studyTypeId}:${deptId}:${normalizedName}`;
      for (let i = 0; i < seed.length; i++) {
        hash = ((hash << 5) - hash) + seed.charCodeAt(i);
        hash |= 0;
      }
      const hex = Math.abs(hash).toString(36);
      return `stu_${branchId}_${deptId}_${hex}@ntu.local`;
    };

    // ==========================================
    // 2. مكون الشريط العلوي واللوغو الثابت (Header & Logo)

    function Header({ logoUrl, userSession, onLogout, onOpenProfile }) {

            {/* أزرار الزاوية اليسرى: الملف الشخصي وتسجيل الخروج */}

    // ==========================================
    // 3. مكون التنبيهات والنوافذ المنبثقة (Toast & Modals)
    // ==========================================
    function Toast({ message, type, onClose }) {
      if (!message) return null;
      const styles = type === 'error' 
        ? 'bg-rose-600 text-white border-rose-700' 
        : type === 'warning'
        ? 'bg-amber-500 text-white border-amber-600'
        : 'bg-emerald-600 text-white border-emerald-700';

      return (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md animate-bounce">
          <div className={`${styles} px-4 py-3.5 rounded-2xl shadow-xl border flex items-center justify-between gap-3`}>
            <span className="text-sm font-bold leading-relaxed">{message}</span>
            <button onClick={onClose} className="text-white/80 hover:text-white font-bold text-lg px-1">✕</button>
          </div>
        </div>
      );
    }

    function ConfirmModal({ isOpen, title, message, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <h4 className="text-lg font-extrabold text-slate-900">{title || 'تأكيد العملية'}</h4>
            <p className="text-sm text-slate-600 font-semibold leading-relaxed">{message}</p>
            <div className="flex gap-2 pt-2">
              <button
                onClick={onConfirm}
                className="flex-1 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm transition"
              >
                تأكيد الحذف
              </button>
              <button
                onClick={onCancel}
                className="flex-1 py-2.5 rounded-2xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-sm transition"
              >
                إلغاء
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. الصفحة الرئيسية وبوابات الدخول (Landing & Auth)
    // ==========================================
    function LandingAndAuth({ departments, onSessionLoaded, notify }) {
      const [view, setView] = useState('home');
      const [loading, setLoading] = useState(false);

      // --- حقول تسجيل الدخول للطالب ---
      const [loginName, setLoginName] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginBranch, setLoginBranch] = useState('kirkuk');

      // --- حقول إنشاء حساب طالب ---
      const [regName, setRegName] = useState('');
      const [regPass, setRegPass] = useState('');
      const [regPassConfirm, setRegPassConfirm] = useState('');
      const [regBranch, setRegBranch] = useState('kirkuk');
      const [regStudyType, setRegStudyType] = useState('morning');
      const [regStage, setRegStage] = useState('stage1');
      const [regDept, setRegDept] = useState(departments[0] || DEFAULT_DEPARTMENTS[0]);

      // --- حقول دخول الدكتور (خطوات متسلسلة) ---
      const [docStep, setDocStep] = useState(1);
      const [docUser, setDocUser] = useState('');
      const [docPass, setDocPass] = useState('');
      const [docBranch, setDocBranch] = useState('kirkuk');
      const [docBranchCode, setDocBranchCode] = useState('');
      const [docFullName, setDocFullName] = useState('');
      const [docSubject, setDocSubject] = useState('');
      const [docDept, setDocDept] = useState(departments[0] || DEFAULT_DEPARTMENTS[0]);

      // --- حقول دخول مقرر القسم ---
      const [coordUser, setCoordUser] = useState('');
      const [coordPass, setCoordPass] = useState('');
      const [coordDept, setCoordDept] = useState(departments[0] || DEFAULT_DEPARTMENTS[0]);

      useEffect(() => {
        if (departments.length > 0) {
          if (!departments.includes(regDept)) setRegDept(departments[0]);
          if (!departments.includes(docDept)) setDocDept(departments[0]);
          if (!departments.includes(coordDept)) setCoordDept(departments[0]);
        }
      }, [departments]);

      const validateQuadName = (rawName) => {
        const cleaned = cleanSpaces(rawName);
        const words = cleaned.split(' ').filter(Boolean);
        if (words.length < 4) {
          return { valid: false, cleaned };
        }
        return { valid: true, cleaned };
      };

      // تسجيل دخول الطالب عبر Firebase Authentication (Email/Password)
      const handleStudentLogin = async (e) => {
        e.preventDefault();
        if (loading) return;

        const nameCheck = validateQuadName(loginName);
        if (!nameCheck.valid) {
          notify('يرجى كتابة الاسم الرباعي المسجل به', 'error');
          return;
        }
        if (!loginPass || loginPass.length < 6) {
          notify('يرجى إدخال الرمز السري (6 أحرف على الأقل)', 'error');
          return;
        }

        setLoading(true);
        try {
          const {
            auth, db, doc, getDoc, collection, query, where, getDocs,
            signInWithEmailAndPassword, signOut
          } = window.fb;
          const normName = normalizeArabic(nameCheck.cleaned);

          // البحث في student_index عن البريد الداخلي المرتبط بالطالب
          let candidateEmails = [];
          try {
            const indexRef = collection(db, `branches/${loginBranch}/student_index`);
            const qIndex = query(indexRef, where('normalizedName', '==', normName));
            const indexSnap = await getDocs(qIndex);
            indexSnap.forEach((idxDoc) => {
              const meta = idxDoc.data();
              if (meta.authEmail) {
                candidateEmails.push(meta.authEmail);
              } else if (meta.departmentId && meta.stageId && meta.studyTypeId) {
                candidateEmails.push(buildStudentAuthEmail(loginBranch, meta.stageId, meta.studyTypeId, meta.departmentId, normName));
              }
            });
          } catch (_) {}

          // توليد احتمالات البريد من الأقسام الرسمية كاحتياط
          if (candidateEmails.length === 0) {
            for (const dName of departments) {
              const dId = slugifyDept(dName);
              for (const st of STAGES) {
                for (const ty of STUDY_TYPES) {
                  candidateEmails.push(buildStudentAuthEmail(loginBranch, st.id, ty.id, dId, normName));
                }
              }
            }
          }

          let signedUser = null;
          for (const email of [...new Set(candidateEmails)]) {
            try {
              const cred = await signInWithEmailAndPassword(auth, email, loginPass);
              signedUser = cred.user;
              break;
            } catch (authErr) {
              if (authErr.code === 'auth/too-many-requests') {
                throw authErr;
              }
            }
          }

          if (!signedUser) {
            notify('الاسم الرباعي أو الرمز السري غير صحيح في هذا الفرع', 'error');
            setLoading(false);
            return;
          }

          const userSnap = await getDoc(doc(db, 'users', signedUser.uid));
          if (!userSnap.exists() || userSnap.data().role !== 'student') {
            await signOut(auth);
            notify('لم يتم العثور على ملف الطالب، يرجى مراجعة الإدارة', 'error');
            setLoading(false);
            return;
          }

          const profile = { uid: signedUser.uid, ...userSnap.data() };
          notify(`أهلاً بك، ${profile.fullName}`, 'success');
          onSessionLoaded(profile);
        } catch (err) {
          console.error(err);
          if (err.code === 'auth/too-many-requests') {
            notify('تم حظر المحاولات مؤقتاً لكثرة المحاولات الخاطئة، حاول لاحقاً', 'error');
          } else {
            notify('حدث خطأ أثناء تسجيل الدخول', 'error');
          }
        } finally {
          setLoading(false);
        }
      };

      // إنشاء حساب طالب جديد عبر Firebase Auth (Email/Password) وحفظ users/{uid}
      const handleStudentRegisterWithIndex = async (e) => {
        e.preventDefault();
        if (loading) return;

        const nameCheck = validateQuadName(regName);
        if (!nameCheck.valid) {
          notify('يرجى كتابة الاسم الرباعي (4 كلمات على الأقل)', 'error');
          return;
        }
        if (!regPass || regPass.length < 6) {
          notify('يرجى إدخال رمز سري لا يقل عن 6 أحرف', 'error');
          return;
        }
        if (regPass !== regPassConfirm) {
          notify('الرمز السري وتأكيده غير متطابقين', 'error');
          return;
        }
        const cleanedDept = cleanSpaces(regDept);
        if (!cleanedDept || !departments.includes(cleanedDept)) {
          notify('يرجى اختيار القسم من القائمة المعتمدة', 'error');
          return;
        }

        setLoading(true);
        try {
          const {
            auth, db, setDoc, doc, serverTimestamp,
            createUserWithEmailAndPassword
          } = window.fb;

          const normName = normalizeArabic(nameCheck.cleaned);
          const deptId = slugifyDept(cleanedDept);
          const basePath = getIsolatedBasePath(regBranch, regStage, regStudyType, cleanedDept);
          const authEmail = buildStudentAuthEmail(regBranch, regStage, regStudyType, deptId, normName);

          // إنشاء حساب حقيقي في Firebase Authentication
          let userCred;
          try {
            userCred = await createUserWithEmailAndPassword(auth, authEmail, regPass);
          } catch (authErr) {
            if (authErr.code === 'auth/email-already-in-use') {
              notify('عذراً، هذا الحساب مسجل مسبقاً في نفس القسم والمرحلة ونوع الدراسة!', 'error');
              setLoading(false);
              return;
            }
            if (authErr.code === 'auth/weak-password') {
              notify('الرمز السري ضعيف، يجب أن يتكون من 6 أحرف على الأقل', 'error');
              setLoading(false);
              return;
            }
            throw authErr;
          }

          const uid = userCred.user.uid;

          const studentData = {
            uid,
            studentId: uid,
            fullName: nameCheck.cleaned,
            normalizedName: normName,
            branchId: regBranch,
            studyTypeId: regStudyType,
            stageId: regStage,
            departmentName: cleanedDept,
            departmentId: deptId,
            createdAt: serverTimestamp()
          };

          // حفظ سجل الطالب في المسار الأكاديمي المعزول باستخدام uid
          await setDoc(doc(db, `${basePath}/students/${uid}`), studentData);

          // حفظ مستند المستخدم المعتمد للصلاحيات في users/{uid}
          const userProfile = {
            uid,
            role: 'student',
            studentId: uid,
            fullName: nameCheck.cleaned,
            normalizedName: normName,
            branchId: regBranch,
            studyTypeId: regStudyType,
            stageId: regStage,
            departmentName: cleanedDept,
            departmentId: deptId,
            createdAt: serverTimestamp()
          };
          await setDoc(doc(db, 'users', uid), userProfile);

          // حفظ مؤشر البحث السريع في الفرع لتسهيل الدخول بالاسم والرمز فقط
          await setDoc(doc(db, `branches/${regBranch}/student_index/${uid}`), {
            studentId: uid,
            normalizedName: normName,
            authEmail,
            basePath,
            branchId: regBranch,
            stageId: regStage,
            studyTypeId: regStudyType,
            departmentName: cleanedDept,
            departmentId: deptId
          });

          notify('تم إنشاء حسابك بنجاح!', 'success');
          onSessionLoaded({
            uid,
            role: 'student',
            studentId: uid,
            fullName: nameCheck.cleaned,
            normalizedName: normName,
            branchId: regBranch,
            studyTypeId: regStudyType,
            stageId: regStage,
            departmentName: cleanedDept,
            departmentId: deptId
          });
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء إنشاء الحساب', 'error');
        } finally {
          setLoading(false);
        }
      };

      // خطوات دخول الدكتور (التحقق الفعلي يتم في الخادم عبر Cloud Function claimRole)
      const handleDoctorStep1 = (e) => {
        e.preventDefault();
        if (!cleanSpaces(docUser) || !docPass) {
          notify('يرجى إدخال اسم الدخول والرمز السري', 'error');
          return;
        }
        setDocStep(2);
      };

      const handleDoctorStep2 = (e) => {
        e.preventDefault();
        if (!docBranchCode.trim()) {
          notify('يرجى إدخال رمز الفرع', 'error');
          return;
        }
        setDocStep(3);
      };

      const handleDoctorStep3 = async (e) => {
        e.preventDefault();
        if (loading) return;

        const cleanedName = cleanSpaces(docFullName);
        const words = cleanedName.split(' ').filter(Boolean);
        if (!cleanedName.startsWith('دكتور') || words.length < 2) {
          notify('يجب أن يبدأ الاسم بكلمة "دكتور" متبوعة بالاسم الكامل (ثنائي أو ثلاثي أو رباعي)', 'error');
          return;
        }
        const cleanedSubj = cleanSpaces(docSubject);
        if (!cleanedSubj || cleanedSubj.length < 2) {
          notify('يرجى كتابة اسم المادة الدراسية', 'error');
          return;
        }
        const cleanedDept = cleanSpaces(docDept);
        if (!cleanedDept || !departments.includes(cleanedDept)) {
          notify('يرجى اختيار القسم من القائمة المعتمدة', 'error');
          return;
        }

        setLoading(true);
        try {
          const { auth, signInAnonymously, functions, httpsCallable, db, doc, getDoc } = window.fb;
          if (!auth.currentUser) {
            await signInAnonymously(auth);
          }

          const subjectAndDept = `${cleanedSubj} – ${cleanedDept}`;
          const deptId = slugifyDept(cleanedDept);

          const claimRoleFn = httpsCallable(functions, 'claimRole');
          await claimRoleFn({
            role: 'doctor',
            username: cleanSpaces(docUser),
            password: docPass,
            branchId: docBranch,
            branchCode: docBranchCode.trim(),
            doctorName: cleanedName,
            subjectName: cleanedSubj,
            departmentName: cleanedDept,
            departmentId: deptId,
            subjectAndDept
          });

          // تحديث التوكن للحصول على Custom Claims الجديدة فوراً
          await auth.currentUser.getIdToken(true);

          const userSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
          const profile = userSnap.exists()
            ? { uid: auth.currentUser.uid, ...userSnap.data() }
            : {
                uid: auth.currentUser.uid,
                role: 'doctor',
                doctorId: auth.currentUser.uid,
                doctorName: cleanedName,
                branchId: docBranch,
                departmentName: cleanedDept,
                departmentId: deptId,
                subjectAndDept
              };

          notify(`مرحباً ${cleanedName}`, 'success');
          onSessionLoaded(profile);
        } catch (err) {
          console.error(err);
          const msg = err?.message || 'فشل التحقق من بيانات الدكتور أو رمز الفرع';
          notify(msg, 'error');
        } finally {
          setLoading(false);
        }
      };

      // دخول مقرر القسم (التحقق الفعلي يتم في الخادم عبر Cloud Function claimRole)
      const handleCoordinatorLogin = async (e) => {
        e.preventDefault();
        if (loading) return;

        if (!cleanSpaces(coordUser) || !coordPass) {
          notify('يرجى إدخال اسم الدخول والرمز السري', 'error');
          return;
        }
        const cleanedDept = cleanSpaces(coordDept);
        if (!cleanedDept || !departments.includes(cleanedDept)) {
          notify('يرجى اختيار القسم من القائمة المعتمدة', 'error');
          return;
        }

        setLoading(true);
        try {
          const { auth, signInAnonymously, functions, httpsCallable, db, doc, getDoc } = window.fb;
          if (!auth.currentUser) {
            await signInAnonymously(auth);
          }

          const deptId = slugifyDept(cleanedDept);
          const claimRoleFn = httpsCallable(functions, 'claimRole');
          await claimRoleFn({
            role: 'coordinator',
            username: cleanSpaces(coordUser),
            password: coordPass,
            departmentName: cleanedDept,
            departmentId: deptId
          });

          // تحديث التوكن للحصول على Custom Claims الجديدة فوراً
          await auth.currentUser.getIdToken(true);

          const userSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
          const profile = userSnap.exists()
            ? { uid: auth.currentUser.uid, ...userSnap.data() }
            : {
                uid: auth.currentUser.uid,
                role: 'coordinator',
                departmentName: cleanedDept,
                departmentId: deptId
              };

          notify('تم تسجيل الدخول بصفة مقرر قسم', 'success');
          onSessionLoaded(profile);
        } catch (err) {
          console.error(err);
          const msg = err?.message || 'بيانات دخول مقرر القسم غير صحيحة';
          notify(msg, 'error');
        } finally {
          setLoading(false);
        }
      };

      return (

    // ==========================================
    // 5. واجهة الطالب (Student Dashboard)
    // ==========================================
    function StudentDashboard({ session, notify }) {
      const [activeTab, setActiveTab] = useState('lectures');
      const [lectures, setLectures] = useState([]);
      const [scheduleUrl, setScheduleUrl] = useState(null);
      const [results, setResults] = useState([]);
      const [loadingData, setLoadingData] = useState(true);
      const [zoomSchedule, setZoomSchedule] = useState(false);
      const [downloadingId, setDownloadingId] = useState(null);

      const [selectedSubject, setSelectedSubject] = useState(null);
      const [examCategory, setExamCategory] = useState(null);
      const [subExamType, setSubExamType] = useState(null);

      const basePath = useMemo(() => {
        return getIsolatedBasePath(session.branchId, session.stageId, session.studyTypeId, session.departmentName);
      }, [session]);

      useEffect(() => {
        const { db, collection, doc, query, where, onSnapshot } = window.fb;
        setLoadingData(true);

        const unsubLectures = onSnapshot(collection(db, `${basePath}/lectures`), (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setLectures(list);
          setLoadingData(false);
        }, (err) => {
          console.error(err);
          setLoadingData(false);
        });

        const unsubSchedule = onSnapshot(doc(db, `${basePath}/schedule/current`), (docSnap) => {
          if (docSnap.exists()) {
            setScheduleUrl(docSnap.data().imageUrl);
          } else {
            setScheduleUrl(null);
          }
        });

        const qResults = query(
          collection(db, `${basePath}/results`),
          where('studentId', '==', session.studentId)
        );
        const unsubResults = onSnapshot(qResults, (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setResults(list);
        });

        return () => {
          unsubLectures();
          unsubSchedule();
          unsubResults();
        };
      }, [basePath, session.studentId]);

      // تنزيل فعلي لملف المحاضرة باسمه الأصلي
      const handleDownloadLecture = async (lec) => {
        if (downloadingId === lec.id) return;
        setDownloadingId(lec.id);
        try {
          const response = await fetch(lec.fileUrl);
          if (!response.ok) throw new Error('Fetch failed');
          const blob = await response.blob();
          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = lec.fileName || `${lec.title}.pdf`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
        } catch (err) {
          console.warn('Direct blob download fallback:', err);
          window.open(lec.fileUrl, '_blank', 'noopener,noreferrer');
        } finally {
          setDownloadingId(null);
        }
      };

      const groupedLectures = useMemo(() => {
        const groups = {};
        lectures.forEach(lec => {
          const subjectKey = `${lec.subjectName} – ${lec.lectureType === 'practical' ? 'عملي' : 'نظري'}`;
          if (!groups[subjectKey]) groups[subjectKey] = {};
          const docKey = lec.doctorName || 'دكتور المادة';
          if (!groups[subjectKey][docKey]) groups[subjectKey][docKey] = [];
          groups[subjectKey][docKey].push(lec);
        });
        return groups;
      }, [lectures]);

      const availableSubjects = useMemo(() => {
        const set = new Set();
        results.forEach(r => set.add(r.subjectName));
        lectures.forEach(l => set.add(l.subjectName));
        return Array.from(set);
      }, [results, lectures]);

      const filteredStudentResults = useMemo(() => {
        if (!selectedSubject || !examCategory) return [];
        let targetExamType = '';
        if (examCategory === 'daily') {
          targetExamType = 'daily';
        } else if (examCategory === 'sem1') {
          if (!subExamType) return [];
          targetExamType = subExamType === 'mid' ? 'sem1_mid' : 'sem1_final';
        } else if (examCategory === 'sem2') {
          if (!subExamType) return [];
          targetExamType = subExamType === 'mid' ? 'sem2_mid' : 'sem2_final';
        }

        return results.filter(r => 
          normalizeArabic(r.subjectName) === normalizeArabic(selectedSubject) &&
          r.examType === targetExamType
        );
      }, [results, selectedSubject, examCategory, subExamType]);

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
          <div className="bg-gradient-to-l from-ntu-800 to-ntu-600 rounded-3xl p-5 sm:p-6 text-white shadow-lg">
            <p className="text-ntu-100 text-xs sm:text-sm font-semibold">مرحباً بك في بوابة الطالب</p>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-1">{session.fullName}</h2>
            <p className="text-xs sm:text-sm text-ntu-100 mt-1 opacity-90">{session.departmentName}</p>
          </div>

          <div className="grid grid-cols-3 gap-3">
            <button
              onClick={() => setActiveTab('lectures')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${
                activeTab === 'lectures' 
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              <Icons.Book />
              <span>محاضرات</span>
            </button>

            <button
              onClick={() => setActiveTab('schedule')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${
                activeTab === 'schedule' 
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              <Icons.Calendar />
              <span>جدول</span>
            </button>

            <button
              onClick={() => setActiveTab('results')}
              className={`p-4 rounded-2xl font-extrabold text-sm sm:text-base flex flex-col sm:flex-row items-center justify-center gap-2 transition shadow-sm border-2 ${
                activeTab === 'results' 
                  ? 'bg-ntu-700 text-white border-ntu-700 shadow-md' 
                  : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'
              }`}
            >
              <Icons.Chart />
              <span>نتائج</span>
            </button>
          </div>

          {activeTab === 'lectures' && (
            <div className="space-y-5">
              {loadingData ? (

                      <h3 className="text-lg font-extrabold text-slate-900">{subjectTitle}</h3>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                <div className="min-w-0">
                                  <p className="font-bold text-slate-800 text-sm truncate">{lec.title}</p>

                                <div className="flex items-center gap-2 shrink-0">
                                  <a

          {activeTab === 'schedule' && (

              <h3 className="text-lg font-extrabold text-slate-900 mb-4">الجدول الدراسي الأسبوعي</h3>
              {scheduleUrl ? (

                  <div 
                    onClick={() => setZoomSchedule(true)}
                    className="relative cursor-zoom-in rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 max-h-[500px] flex items-center justify-center"
                  >
                    <img src={scheduleUrl} alt="الجدول الدراسي" className="w-full h-auto object-contain" />
                  </div>
                  <button
                    onClick={() => setZoomSchedule(true)}
                    className="px-5 py-2.5 rounded-xl bg-ntu-700 text-white font-bold text-sm"

                    تكبير صورة الجدول 🔍

              ) : (
                <div className="py-12 text-slate-500 font-bold">
                  لم يتم رفع صورة الجدول الدراسي لقسمك ومرحلتك بعد.
                </div>

              {zoomSchedule && scheduleUrl && (
                <div 
                  onClick={() => setZoomSchedule(false)}
                  className="fixed inset-0 z-50 bg-black/90 p-4 flex items-center justify-center cursor-zoom-out"
                >
                  <img src={scheduleUrl} alt="الجدول مكبر" className="max-w-full max-h-full object-contain rounded-xl" />

          {activeTab === 'results' && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-6">
              <h3 className="text-lg font-extrabold text-slate-900">نتائج الامتحانات</h3>

              {availableSubjects.length === 0 ? (
                <p className="text-center py-8 text-slate-500 font-bold">لا توجد مواد أو درجات منشورة لك حالياً.</p>
              ) : (
                <>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">1. اختر المادة الدراسية:</label>
                    <div className="flex flex-wrap gap-2">
                      {availableSubjects.map(subj => (
                        <button
                          key={subj}
                          onClick={() => {
                            setSelectedSubject(subj);
                            setExamCategory(null);
                            setSubExamType(null);
                          }}
                          className={`px-4 py-2.5 rounded-2xl font-bold text-sm border-2 transition ${
                            selectedSubject === subj
                              ? 'bg-ntu-700 text-white border-ntu-700'
                              : 'bg-white text-slate-700 border-slate-200 hover:border-ntu-400'

                  {selectedSubject && (
                    <div className="pt-4 border-t border-slate-100 space-y-4">
                      <label className="block text-sm font-bold text-slate-700">2. اختر نوع الامتحان لمادة ({selectedSubject}):</label>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <button
                          onClick={() => { setExamCategory('daily'); setSubExamType(null); }}
                          className={`p-3.5 rounded-2xl font-bold text-sm border-2 transition ${
                            examCategory === 'daily' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-slate-50 text-slate-800 border-slate-200'
                          }`}
                        >
                          امتحانات يومية
                        </button>
                        <button
                          onClick={() => { setExamCategory('sem1'); setSubExamType(null); }}
                          className={`p-3.5 rounded-2xl font-bold text-sm border-2 transition ${
                            examCategory === 'sem1' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-slate-50 text-slate-800 border-slate-200'
                          }`}
                        >
                          امتحانات الفصل الأول
                        </button>
                        <button
                          onClick={() => { setExamCategory('sem2'); setSubExamType(null); }}
                          className={`p-3.5 rounded-2xl font-bold text-sm border-2 transition ${
                            examCategory === 'sem2' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-slate-50 text-slate-800 border-slate-200'
                          }`}
                        >
                          امتحانات الفصل الثاني
                        </button>
                      </div>

                      {(examCategory === 'sem1' || examCategory === 'sem2') && (
                        <div className="pt-3 flex gap-3">
                          <button
                            onClick={() => setSubExamType('mid')}
                            className={`flex-1 py-3 rounded-2xl font-extrabold text-sm border-2 transition ${
                              subExamType === 'mid' ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 text-amber-900 border-amber-200'
                            }`}
                          >
                            ميدتيرم (Midterm)
                          </button>
                          <button
                            onClick={() => setSubExamType('final')}
                            className={`flex-1 py-3 rounded-2xl font-extrabold text-sm border-2 transition ${
                              subExamType === 'final' ? 'bg-amber-600 text-white border-amber-600' : 'bg-amber-50 text-amber-900 border-amber-200'
                            }`}
                          >
                            فاينل (Final)
                          </button>
                        </div>
                      )}

                      {(examCategory === 'daily' || subExamType) && (
                        <div className="mt-5 p-5 rounded-3xl bg-ntu-50 border-2 border-ntu-200">
                          {filteredStudentResults.length === 0 ? (
                            <p className="text-center text-slate-600 font-bold">لم يتم نشر درجتك في هذا الخيار بعد.</p>
                          ) : (
                            <div className="space-y-3">
                              {filteredStudentResults.map(res => (
                                <div key={res.id} className="bg-white p-4 rounded-2xl shadow-xs flex items-center justify-between">
                                  <div>
                                    <p className="text-xs text-slate-500 font-bold">الطالب: {session.fullName}</p>
                                    <p className="text-base font-extrabold text-slate-900 mt-0.5">
                                      {res.examTitle || res.subjectName}
                                    </p>
                                  </div>
                                  <div className="px-5 py-2.5 rounded-2xl bg-ntu-700 text-white font-extrabold text-xl shadow" dir="ltr">
                                    {res.maxScore ? `${res.score} / ${res.maxScore}` : res.score}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. واجهة الدكتور (Doctor Dashboard)
    // ==========================================
    function DoctorDashboard({ session, departments, notify }) {
      const [activeTab, setActiveTab] = useState('lectures'); // 'lectures' | 'daily_grades'

      // --- حقول رفع محاضرة ---
      const [subjectName, setSubjectName] = useState('');
      const [lectureType, setLectureType] = useState('theoretical');
      const [lectureTitle, setLectureTitle] = useState('');
      const [stageId, setStageId] = useState('stage1');
      const [studyTypeId, setStudyTypeId] = useState('morning');
      const [deptName, setDeptName] = useState(session.departmentName || departments[0] || DEFAULT_DEPARTMENTS[0]);
      const [lectureFile, setLectureFile] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      const lectureUploadTaskRef = useRef(null);
      const lectureFileInputRef = useRef(null);

      // محاضرات الدكتور الحالية (للحذف أو التعديل)
      const [myLectures, setMyLectures] = useState([]);
      const [editingLecture, setEditingLecture] = useState(null);
      const [lectureToDelete, setLectureToDelete] = useState(null);

      // --- حقول رفع درجات الامتحانات اليومية ---
      const [gradeSubject, setGradeSubject] = useState('');
      const [gradeExamTitle, setGradeExamTitle] = useState('');
      const [gradeStage, setGradeStage] = useState('stage1');
      const [gradeStudyType, setGradeStudyType] = useState('morning');
      const [gradeDept, setGradeDept] = useState(session.departmentName || departments[0] || DEFAULT_DEPARTMENTS[0]);
      const [rawPasteText, setRawPasteText] = useState('');
      const [parsedRows, setParsedRows] = useState([]);
      const [reviewMode, setReviewMode] = useState(false);
      const [publishingGrades, setPublishingGrades] = useState(false);

      const doctorUid = session.uid || session.doctorId;

      useEffect(() => {
        if (departments.length > 0) {
          if (!departments.includes(deptName)) setDeptName(departments[0]);
          if (!departments.includes(gradeDept)) setGradeDept(departments[0]);
        }
      }, [departments]);

      // جلب محاضرات هذا الدكتور فقط ضمن الفرع
      useEffect(() => {
        const { db, collection, query, where, onSnapshot } = window.fb;
        const q = query(
          collection(db, `branches/${session.branchId}/doctor_lectures_index`),
          where('doctorId', '==', doctorUid)
        );
        const unsub = onSnapshot(q, (snap) => {
          setMyLectures(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        return () => unsub();
      }, [session.branchId, doctorUid]);

      // إلغاء رفع المحاضرة
      const handleCancelLectureUpload = () => {
        if (lectureUploadTaskRef.current) {
          try {
            lectureUploadTaskRef.current.cancel();
          } catch (_) {}
          lectureUploadTaskRef.current = null;
        }
        setUploading(false);
        setUploadProgress(0);
      };

      // إضافة محاضرة جديدة
      const handleAddLecture = async (e) => {
        e.preventDefault();
        if (uploading) return;

        const cleanSubj = cleanSpaces(subjectName);
        const cleanTitle = cleanSpaces(lectureTitle);
        const cleanDept = cleanSpaces(deptName);

        if (!cleanSubj || !cleanTitle || !cleanDept || !lectureFile) {
          notify('يرجى ملء جميع الحقول واختيار ملف المحاضرة', 'error');
          return;
        }

        if (!departments.includes(cleanDept)) {
          notify('يرجى اختيار القسم من القائمة المعتمدة', 'error');
          return;
        }

        if (lectureFile.size > MAX_UPLOAD_SIZE_BYTES) {
          notify('حجم الملف يتجاوز الحد الأقصى المسموح به (50 ميجابايت)', 'error');
          return;
        }

        setUploading(true);
        setUploadProgress(0);
        try {
          const { storage, ref, db, collection, addDoc, setDoc, doc, serverTimestamp } = window.fb;
          const basePath = getIsolatedBasePath(session.branchId, stageId, studyTypeId, cleanDept);
          const safeFileName = sanitizeStorageFileName(lectureFile.name);
          const storagePath = `${basePath}/lectures/${Date.now()}_${safeFileName}`;
          const storageRef = ref(storage, storagePath);

          const fileUrl = await uploadFileWithProgress({
            storageRef,
            file: lectureFile,
            onProgress: (pct) => setUploadProgress(pct),
            onTaskCreated: (task) => { lectureUploadTaskRef.current = task; }
          });

          const lecPayload = {
            subjectName: cleanSubj,
            lectureType,
            title: cleanTitle,
            doctorId: doctorUid,
            doctorName: session.doctorName,
            branchId: session.branchId,
            stageId,
            studyTypeId,
            departmentName: cleanDept,
            departmentId: slugifyDept(cleanDept),
            fileUrl,
            storagePath,
            fileName: lectureFile.name,
            createdAt: serverTimestamp()
          };

          const addedRef = await addDoc(collection(db, `${basePath}/lectures`), lecPayload);
          await setDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${addedRef.id}`), {
            ...lecPayload,
            lectureDocPath: `${basePath}/lectures/${addedRef.id}`
          });

          notify('تم رفع ونشر المحاضرة بنجاح!', 'success');
          setLectureTitle('');
          setLectureFile(null);
          if (lectureFileInputRef.current) lectureFileInputRef.current.value = '';
        } catch (err) {
          console.error('Lecture upload error:', err);
          notify(getStorageErrorMessage(err), 'error');
        } finally {
          lectureUploadTaskRef.current = null;
          setUploading(false);
          setUploadProgress(0);
        }
      };

      const confirmDeleteLecture = async () => {
        if (!lectureToDelete) return;
        const lec = lectureToDelete;
        setLectureToDelete(null);
        try {
          const { db, doc, deleteDoc, storage, ref, deleteObject } = window.fb;
          if (lec.lectureDocPath) {
            await deleteDoc(doc(db, lec.lectureDocPath));
          }
          await deleteDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${lec.id}`));
          if (lec.storagePath) {
            try { await deleteObject(ref(storage, lec.storagePath)); } catch (_) {}
          }
          notify('تم حذف المحاضرة بنجاح', 'success');
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء حذف المحاضرة', 'error');
        }
      };

      const handleUpdateLectureTitle = async () => {
        if (!editingLecture || !cleanSpaces(editingLecture.title)) return;
        try {
          const { db, doc, updateDoc } = window.fb;
          const newTitle = cleanSpaces(editingLecture.title);
          if (editingLecture.lectureDocPath) {
            await updateDoc(doc(db, editingLecture.lectureDocPath), { title: newTitle });
          }
          await updateDoc(doc(db, `branches/${session.branchId}/doctor_lectures_index/${editingLecture.id}`), { title: newTitle });
          notify('تم تحديث عنوان المحاضرة', 'success');
          setEditingLecture(null);
        } catch (err) {
          notify('فشل التحديث', 'error');
        }
      };

      const handleExcelUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const bstr = evt.target.result;
          const wb = XLSX.read(bstr, { type: 'binary' });
          const wsname = wb.SheetNames[0];
          const ws = wb.Sheets[wsname];
          const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
          const lines = data
            .filter(row => row && row.length >= 2 && row[0] && row[1] !== undefined)
            .map(row => `${cleanSpaces(String(row[0]))} - ${String(row[1]).trim()}`);
          setRawPasteText(lines.join('\n'));
          notify(`تم استخراج ${lines.length} صف من الملف بنجاح`, 'success');
        };
        reader.readAsBinaryString(file);
      };

      const handleAnalyzeAndMatchGrades = async () => {
        const cleanSubj = cleanSpaces(gradeSubject);
        const cleanDept = cleanSpaces(gradeDept);
        if (!cleanSubj || !cleanDept || !rawPasteText.trim()) {
          notify('يرجى إدخال اسم المادة واختيار القسم وكتابة قائمة الطلاب والدرجات', 'error');
          return;
        }

        setPublishingGrades(true);
        try {
          const { db, collection, getDocs } = window.fb;
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, cleanDept);
          const studentsSnap = await getDocs(collection(db, `${basePath}/students`));
          const studentsList = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          const lines = rawPasteText.split('\n').map(l => l.trim()).filter(Boolean);
          const analyzed = lines.map((line, idx) => {
            const match = line.match(/^(.+?)[\t\-:,،]+([0-9]+(?:\.[0-9]+)?)$/) || line.match(/^(.+?)\s+([0-9]+(?:\.[0-9]+)?)$/);
            if (!match) {
              return { id: idx, rawLine: line, rawName: line, score: '', matchedStudent: null, status: 'invalid' };
            }
            const rawName = cleanSpaces(match[1]);
            const score = match[2].trim();
            const normInput = normalizeArabic(rawName);

            const found = studentsList.find(s => s.normalizedName === normInput);
            return {
              id: idx,
              rawLine: line,
              rawName,
              score,
              matchedStudent: found || null,
              status: found ? 'matched' : 'unmatched'
            };
          });

          setParsedRows(analyzed);
          setReviewMode(true);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء مطابقة أسماء الطلاب', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      // نشر الدرجات بمعرّف ثابت وباستخدام writeBatch (500 عملية كحد أقصى للدفعة) لمنع التكرار
      const handlePublishMatchedGrades = async () => {
        const matchedItems = parsedRows.filter(r => r.status === 'matched' && r.matchedStudent);
        if (matchedItems.length === 0) {
          notify('لا توجد أسماء مطابقة لنشر درجاتها', 'error');
          return;
        }

        setPublishingGrades(true);
        try {
          const { db, doc, getDocs, collection, writeBatch, serverTimestamp } = window.fb;
          const cleanSubj = cleanSpaces(gradeSubject);
          const cleanDept = cleanSpaces(gradeDept);
          const finalExamTitle = cleanSpaces(gradeExamTitle) || `امتحان يومي - ${cleanSubj}`;
          const basePath = getIsolatedBasePath(session.branchId, gradeStage, gradeStudyType, cleanDept);
          const resultsColRef = collection(db, `${basePath}/results`);

          // جلب المعرّفات الموجودة مسبقاً لحساب عدد الدرجات المضافة مقابل المحدّثة
          const existingSnap = await getDocs(resultsColRef);
          const existingIds = new Set(existingSnap.docs.map(d => d.id));

          // إزالة التكرار داخل نفس القائمة المرفوعة إن وُجد (الاعتماد على آخر سطر للطالب)
          const uniqueMap = new Map();
          for (const item of matchedItems) {
            const stuId = item.matchedStudent.studentId || item.matchedStudent.id;
            const docId = buildResultDocId(stuId, cleanSubj, 'daily', finalExamTitle);
            uniqueMap.set(docId, { docId, stuId, item });
          }

          const entries = Array.from(uniqueMap.values());
          let addedCount = 0;
          let updatedCount = 0;

          // تقسيم العمليات إلى دفعات بحد أقصى 500 عملية في كل writeBatch
          const BATCH_LIMIT = 500;
          for (let i = 0; i < entries.length; i += BATCH_LIMIT) {
            const chunk = entries.slice(i, i + BATCH_LIMIT);
            const batch = writeBatch(db);

            for (const { docId, stuId, item } of chunk) {
              if (existingIds.has(docId)) {
                updatedCount++;
              } else {
                addedCount++;
              }

              const targetRef = doc(db, `${basePath}/results/${docId}`);
              batch.set(targetRef, {
                studentId: stuId,
                studentName: item.matchedStudent.fullName,
                subjectName: cleanSubj,
                examType: 'daily',
                examTitle: finalExamTitle,
                score: item.score,
                doctorId: doctorUid,
                doctorName: session.doctorName,
                branchId: session.branchId,
                stageId: gradeStage,
                studyTypeId: gradeStudyType,
                departmentName: cleanDept,
                departmentId: slugifyDept(cleanDept),
                updatedAt: serverTimestamp()
              }, { merge: true });
            }

            await batch.commit();
          }

          notify(`تم نشر الدرجات بنجاح! (أُضيفت: ${addedCount}، حُدّثت: ${updatedCount})`, 'success');
          setReviewMode(false);
          setRawPasteText('');
          setParsedRows([]);
        } catch (err) {
          console.error(err);
          notify('حدث خطأ أثناء نشر الدرجات', 'error');
        } finally {
          setPublishingGrades(false);
        }
      };

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
          <div className="bg-gradient-to-l from-slate-900 to-ntu-900 rounded-3xl p-5 sm:p-6 text-white shadow-lg">
            <span className="px-3 py-1 rounded-full bg-ntu-600/40 text-ntu-100 text-xs font-bold">لوحة تحكم التدريسي</span>
            <h2 className="text-xl sm:text-2xl font-extrabold mt-2">{session.doctorName}</h2>
            <p className="text-xs sm:text-sm text-slate-300 mt-1">
              فرع {BRANCHES.find(b => b.id === session.branchId)?.name} | {session.subjectAndDept}
            </p>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={() => setActiveTab('lectures')}
              className={`p-3.5 rounded-2xl font-extrabold text-xs sm:text-sm border-2 transition ${
                activeTab === 'lectures' ? 'bg-ntu-700 text-white border-ntu-700' : 'bg-white text-slate-700 border-slate-200'
              }`}
            >
              إنشاء محاضرات
            </button>
            <button
